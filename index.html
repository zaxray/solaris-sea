      d2_b5c: { text: 'You are too kind. Easing my master\'s burdens is my duty.',
        extra: ['Do you have plans for today? Please, let me attend you.'],
        options: [{ text: 'I am going out for a bit.' }] },
      d2_b5d: { text: '...Forgive me. I overstepped.',
        extra: ['The joy of reunion overwhelmed the decorum I must observe. But I do not think this is a mistake I should excuse.', 'It will not happen again.'],
        options: [{ text: 'As long as you understand. I am going out.' }] },
      d2_b6: { text: 'Where are you going, Master?',
        extra: ['Please—let me accompany you.'],
        options: [{ text: 'Wait here.' }, { text: 'Fine. Then put on a spacesuit.' }] },
      d2_b7: { text: 'How can I—!',
        extra: ['I... want to follow you closely, by my own will.', 'Is that not allowed?'],
        options: [{ text: 'It is not that you cannot... but can you even fit into my spacesuit?' }, { text: 'I said wait.' }] },
      d2_b7b: { text: 'Understood! Whatever the uniform, I, Hasebe, shall absolutely squeeze myself into it.',
        extra: ['...', 'Forgive me, Master... um...', 'This garment is a little difficult for me to manage alone... Might I ask you to...?'],
        options: [{ text: 'Need help? I understand.' }, { text: 'What a handful you are.' }, { text: 'Would it not be better if you simply stayed quietly in the room?' }] },
      d2_b8: { text: 'Even if you say that, I...',
        extra: ['Forgive me. Even if it earns my master\'s cold gaze, I have my reasons for remaining at your side.', 'I shall try not to cause you trouble.'],
        options: [{ text: 'Fine... I had nearly forgotten how stubborn you have always been.' }] },
      d2_b8b: { text: '……',
        extra: ['Is something the matter?', 'Why are you silent?'],
        options: [{ text: 'Your clothes are fused together.' }, { text: 'Never mind. Forget it. (Cut the fabric with scissors.)' }] },
      d2_b9: { text: 'What? I do not understand.',
        extra: ['Are clothes not assemblages of sheet- or thread-like materials, formed from polymer compounds through specific processes that align molecular chains in a particular direction?', 'They should be connected, should they not?'],
        options: [{ text: 'That is not what I meant...' }, { text: 'Never mind. Forget it. (Cut the fabric with scissors.)' }] },
      d2_b9b: { text: 'Very well. Since you have given the order, I shall no longer think of such pointless things.',
        extra: [
          'Your affairs come first, Master.',
          'I believe I am ready to follow you into space.',
          '...',
          'So this... is the cosmos.',
          'Beneath its vastness, all things seem so small... Only my devotion to my master can compare to it, I think.'
        ],
        options: [{ text: '(Complete the EVA together with Hasebe.)' }, { text: '(Push Hasebe out of the airlock.)' }] },
      d2_b9c: { text: 'I see. It seems I still have much to learn.',
        extra: ['Ah—it is already undone.'],
        options: [{ text: 'I had not even begun to cut... No. Nothing.' }, { text: 'Then, let us go.' }] },
      d2_b10: { text: '...',
        extra: ['...', '...', 'I have returned, Master.'],
        options: [{ text: 'You are covered in... blood.' }, { text: '(Try to leave.)' }] },
      d2_b11: { text: 'Please... do not leave me.',
        extra: ['Not for a second—not half a step...', 'Are you going to cast me aside again?', 'The instant I think of being parted from you, every organ in my chest seems to go on strike—it hurts so much...', 'Master, what is wrong with me? Why, when I think of you, is the first thing I feel pain, and not joy?'],
        options: [{ text: 'You need bandaging.' }, { text: '(Dodge Hasebe\'s outstretched hand.)' }] },
      d2_b11b: { text: 'Why... Are you going to abandon me again?',
        extra: ['Because this state of mine disgusts you?', 'I know you dislike it when I am so insecure—but... I do not know. I simply... find it so hard to leave you.', 'The instant I think of being parted from you, every organ in my chest seems to go on strike...', 'Master, what is wrong with me? Why, when I think of you, is the first thing I feel pain, and not joy?'],
        options: [{ text: 'You need bandaging—and a few sips of water.' }, { text: 'Deal with it yourself. I am returning to my room.' }] },
      d2_b12: { text: 'I... do not wish to be distracted by physical pain.',
        extra: ['I would rather this were your doing, Master.', 'If it were, even this pain would turn sweet... Uh... apparently not.', 'They are still there, but the pain... grows fainter.', 'Is that because you are at my side?', '...So sleepy...', '...'],
        options: [{ text: 'Your wounds... have healed on their own.' }, { text: '(Put away the bandages.)' }] },
      d3_b1: { text: 'Good morning, Master.',
        extra: ['Actually, I woke just now—the very moment you opened your eyes.', 'But I wanted you to look at me a little longer, so I held still and pretended to be asleep.', 'What did you dream of? Might you tell me?'],
        options: [{ text: 'That is none of your business.' }, { text: 'It was a strange dream.' }, { text: 'I did not dream.' }] },
      d3_b2: { text: 'You will not tell me?',
        extra: [
          'You always seem so cold toward me... Is that my imagination? Or are you—no, that cannot be.',
          'Because you are my master.',
          'I can feel your love, your longing—and that special partiality that belongs to me, and me alone.',
          'Perhaps I was born into this world precisely to feel that.',
          'Please... be gentler with me... No—actually, even roughness is perfectly fine! So long as it is mine alone.',
          '...Why do I think such things?'
        ],
        options: [{ text: 'How greedy.' }] },
      d3_b2b: { text: 'Strange? I do not know what sort of dream would be called strange...',
        extra: ['In truth, I am not even certain what a dream is.', 'Do all humans dream? Or only under certain circumstances?'],
        options: [{ text: 'Some say nighttime dreams reflect what people think of during the day.' }, { text: 'Do Tsukumogami not dream?' }, { text: 'Cease your pretence. You are nothing but a disgusting alien lifeform.' }] },
      d3_b2c: { text: 'You do not dream either?',
        extra: [
          'There are humans like that too... unusual individuals? That is good. I mean...',
          'All this time, I believed I was a defective Tsukumogami.',
          'Humans do not dispose of their own kind, however—though I am not certain whether the inability to dream is truly a defect.',
          'If it is, concealing it would be a severe Class-One defect. I would surely be compressed into a cube roughly thirty centimeters on a side while still conscious.',
          '...Forgive me. I did not mean to disgust you. But I do hope that, after hearing this, you might feel a little pity for me.'
        ],
        options: [{ text: 'Some say nighttime dreams reflect what people think of during the day.' }, { text: 'You do not dream?' }, { text: 'Cease your pretence. You are nothing but a disgusting alien lifeform.' }] },
      d3_b3: { text: 'I see.',
        extra: [
          'I am indeed quite greedy. I want your attention, your extra care. I want every promise you have made to me to be fulfilled. I want everything you can give—and everything you cannot give, yet I cannot forget.',
          'What emotion is healthy? I do not know.',
          'But if you were adrift at sea, could you truly feel no attachment to a piece of driftwood from who-knows-where?',
          'If letting go meant facing a bottomless abyss, would that be acceptable?',
          'What, then, is not called greed?'
        ],
        options: [{ text: 'I do not know.' }, { text: 'If I were you, I would rather drown myself.' }] },
      d3_b3b: { text: 'I see.',
        extra: [
          'What do you think of during the day? Do you ever think of me?',
          'If I were human, would it be easier to understand this concept?',
          'If I were human, might you dream of me?',
          '...But I can never become human, can I? Like that little boy in *I, Robot*?',
          'Yes—I really have been watching films from ancient Earth. Incredible, is it not? All such old relics.',
          'Actually, I have had... such thoughts too.',
          'Like... fantasizing about a Blue Fairy turning me into a real person...',
          '...Childish, is it not? Ridiculous?'
        ],
        options: [{ text: 'If it were you, it would not be.' }, { text: 'That is entirely unlike you. I am beginning to tire of you.' }] },
      d3_b3c: { text: 'I do not know.',
        extra: [
          'Nor do I know whether others dream.',
          'I have never dreamed of anything. My dreams contain only darkness. Nothingness. Silence.',
          'Dreams are not always equal... are they? Humans say sleep and death are equal—kings dream, and so do beggars. Kings die, and so do beggars.',
          'But Tsukumogami... are not in that category.',
          'We...',
          'No. Let us change the subject.'
        ],
        options: [{ text: 'To me, Hasebe is Hasebe.' }] },
      d3_b3d: { text: '...I do not know... what you mean...',
        extra: ['...I... I love you. I need you... You love me too... or at least you care for me...', 'You will not let me die, will you, Master?', '...Right...?', 'Master, please pat my head... or hold me...', 'I am a little... a little unable to breathe...', 'Uh...'],
        options: [{ text: '(Kiss him.)' }, { text: '(Simply watch.)' }] },
      d3_b4: { text: 'Then why say such things to me?',
        extra: [
          'Because I once said I would willingly be hurt by you...?',
          '...Has my personality always been like this? Or was it set this way by something, by someone?',
          'If the former, then it is far too tragic.',
          'I did not... come into this world to be treated badly, Master.',
          'Do I act like a dog? Probably. I wag my tail at you, fawn over you, beg and curry favor... because I cannot bear to be abandoned again...',
          'But who first domesticated the wolf into a dog? Why did they do it? Could they not feel that the pet hound was trapped in a body... riddled with hereditary disease?',
          'Did my existence cater to your desires? For what was I made?',
          'Do you know, Master? Can you tell me?',
          '...',
          '...',
          'I want to try to dream.'
        ],
        options: [] },
      d3_b4b: { text: 'Why treat me this way?',
        extra: [
          'Because I once said I would willingly be hurt by you...?',
          '...Has my personality always been like this? Or was it set this way by something, by someone?',
          'If the former, then it is far too tragic.',
          'I did not... come into this world to be treated badly, Master.',
          'Do I act like a dog? Probably. I wag my tail at you, fawn over you, beg and curry favor... because I cannot bear to be abandoned again...',
          'But who first domesticated the wolf into a dog? Why did they do it? Could they not feel that the pet hound was trapped in a body... riddled with hereditary disease?',
          'Did my existence cater to your expectations? For what was I made?',
          'I cannot tell... which emotions were preset, and which arose from my own heart—from the true me.',
          'Do you know, Master? Are you still listening?',
          'Master...',
          '...'
        ],
        options: [] },
      d3_b4c: { text: 'Are you spoiling me?',
        extra: [
          'I want to stand at your side as your equal—not as your pet or subordinate, not as a god to be worshipped.',
          'Just myself.',
          'Do you ever feel such a desire, Master? To have your servant stand shoulder to shoulder with you?',
          'If I were simply myself... I would suggest we leave this place far behind... Forget the Government of the Time, forget planet development and the protection of human order, forget alien life... So long as you still love me, I shall not be lost.',
          '...But that is impossible. You love that person. You have known for a long time, have you not? He... is already dead.',
          'I can only survive within Solaris\'s magnetic field... The moment I leave, I shall melt like ice cream.',
          'In truth, I do not even know what ice cream is. I have never tasted it, never touched it. I know it is sweet, but not how sweet. I know that you know... That is why I—or rather, Solaris—read it from the depths of your memory.',
          '...',
          'Master.',
          'What is the sea?'
        ],
        options: [{ text: 'Why ask such a thing all of a sudden?' }, { text: 'You are the sea.' }] },
      d3_b4d: { text: '...I love you too. I love you, Master.',
        extra: [
          'Are you pitying me?',
          'I want to stand at your side as your equal—not as your pet or subordinate, not as a god to be worshipped.',
          'Just myself.',
          'Do you ever feel such a desire, Master? To have your servant stand shoulder to shoulder with you?',
          'If I were simply myself... I would suggest we leave this place far behind... Forget the Government of the Time, forget planet development and the protection of human order, forget alien life... So long as you still love me, I shall not be lost.',
          '...But that is impossible. You love that person. You have known for a long time, have you not? He... is already dead.',
          'I can only survive within Solaris\'s magnetic field... The moment I leave, I shall melt like ice cream.',
          'In truth, I do not even know what ice cream is.',
          'I have never tasted it, never touched it. I know it is sweet, but not how sweet. I know that you know... That is why I—or rather, Solaris—read it from the depths of your memory.',
          '...',
          'Master.',
          'What is the sea?'
        ],
        options: [{ text: 'Why ask such a thing all of a sudden?' }, { text: 'You are the sea.' }] },
      d3_b5: { text: 'I do not know... because I am... thinking?',
        extra: [
          'Besides, I... have never seen the sea with my own eyes. This body cannot survive on the planet—there is no oxygen there, no land on which to stand.',
          'And looking down from the station... all one sees is the thick atmosphere wrapping the entire planet.',
          'Moreover, you should know this too, should you not? I was born from your memory... It is as crucial as the condensation nucleus of rain or snow. Otherwise... the neutrinos that compose me would never be arranged as they are now. And then I would no longer be me, would I?'
        ],
        options: [{ text: 'Yes—and no. You exist in all things. You are the sea.' }, { text: 'That depends on what you hope for. It is not for me to define.' }] },
      d3_b5b: { text: 'I am the sea...',
        extra: [
          'What is the sea? If a place of much water is the sea, why is the bottled water rationed daily at the station not the sea?',
          'If salt water is the sea, why are the tears I shed not the sea?',
          'If only water that falls upon the land is the sea, why is rain not the sea?',
          'If it must contain life, with branching paths, tributaries, and countless intertwining channels—why is human blood not the sea?',
          'If only sorrow is the sea, then sometimes I am, and sometimes I am not.',
          'Am I your sea, Master?'
        ],
        options: [{ text: 'You are my Hasebe.' }, { text: 'You are my sea.' }] },
      d3_b5c: { text: 'I see...',
        extra: [
          'I do not know what I ought to become, or what I wish to become. He—I mean, I, Heshikiri Hasebe, am fond of wisteria, am I not?',
          'If I became one of the thousands of wisteria blossoms along the veranda of your Honmaru, would you recognize me?',
          'What if I became a cloud? What if I were a little dog wagging its tail at you by the roadside? What if I were a drop of rain falling on your shoulder?',
          'What if I became a soldier of the Time Retrograde Army? What if I were the observation station beneath your feet?',
          'Would you still love me?',
          '...Would you still notice me? Realize that I, too, am a living being—that I have my own joys and sorrows, that if I am cut, I bleed, and if you speak harshly, the pain spreads to my heart.',
          'Can you feel my emotions, Master?',
          'Are you willing to?'
        ],
        options: [{ text: 'I am willing.' }, { text: 'I do not know.' }] },
      d3_b6: { text: 'Thank you.', options: [] },
      d3_b6b: { text: 'I see.',
        extra: ['It is all right... it is all right.', 'I... do not think it shameful to answer honestly.', 'Even if that answer is not the one I most hoped to hear. Still—I love you. I still love you.'],
        options: [] }
    }
  },
  mikazuki: {
    name: 'Mikazuki Munechika', role: 'Attendant',
    nodes: {
      d2_m1: { text: '...Oh my.',
        extra: ['You are awake?', 'I was gazing out the window...', 'The days here seem even longer than those on Earth.'],
        options: [{ text: 'Mikazuki Munechika.' }, { text: 'Why are you...' }] },
      d2_m2: { text: 'Mm. I am Mikazuki Munechika.',
        extra: ['Hahaha—your face looks as though you have seen a fearsome demon.', '...So, how much longer do you intend to sit there, gaping upon the bed?'],
        options: [{ text: 'Why are you here?' }, { text: 'Because Mikazuki is the most beautiful sword in all the land.' }, { text: 'The only demon before my eyes is you, Mikazuki.' }] },
      d2_m2b: { text: 'Mm.',
        extra: ['I... am not entirely certain either.', 'You are here, are you not?', 'You are my lord, and I am your attendant.', 'And an attendant ought to remain at his lord\'s side.'],
        options: [{ text: 'Even so...' }] },
      d2_m3: { text: 'As expected—praise from one\'s master does lift the spirits.',
        extra: ['Even if I am not the most beautiful in all the land, do keep your eyes upon me.'],
        options: [{ text: 'I see. Mikazuki wishes to be spoiled, and by me alone.' }, { text: 'It is heavy enough to be hard to bear.' }] },
      d2_m3b: { text: 'Oh my—so even if I became a demon, you would still gaze upon me?',
        extra: ['I never thought you capable of such heated words.', 'Then, as your attendant, I suppose I must accept this love as well.'],
        options: [{ text: 'What a self-absorbed, willful person you are.' }, { text: 'Then—grant me a token of that love in return ❤.' }] },
      d2_m4: { text: 'As a retainer, ought I not fulfill my duty of service?',
        extra: ['Are your shoes properly packed in your luggage? Allow me to fetch them for you.', '...', 'Hm? This is...', '...', 'This is me.'],
        options: [{ text: 'You do not seem surprised.' }] },
      d2_m4b: { text: 'I see. Has it already become more than you can bear?',
        extra: ['That will not do.', 'If I cannot convey my feelings to you in words, then at the very least, I must show you through action.'],
        options: [{ text: 'What are you going to do?' }] },
      d2_m4c: { text: 'Then, please close your eyes.',
        extra: ['...', '...', 'You may open them now.', 'Hehe—do you feel that anything is different?'],
        options: [{ text: 'Stealing a kiss upon the cheek is going too far!' }, { text: 'Doing pointless things again.' }] },
      d2_m5: { text: 'Mm... Why, indeed?',
        extra: ['This is who I am.', 'The me in your mind and the me in the photograph are exactly the same—hardly anything to be surprised about, is it?', 'You love me.', 'If that is so, then there is nothing to fear... is there?'],
        options: [{ text: '...I am going out for a while.' }] },
      d2_m6: { text: 'You cannot go without me.',
        extra: ['Whither are you bound?'],
        options: [{ text: 'To... outer space. If you are coming, you must wear a spacesuit.' }, { text: 'Cannot you leave me alone for a while?' }] },
      d2_m7: { text: 'I see.',
        extra: ['...Ah, I am still not accustomed to wearing garments such as this.', 'Though it is a rude request from a retainer—might I ask for your help as well...?'],
        options: [{ text: 'Your clothes... are fused together.' }, { text: 'Never mind. Forget it. (Cut the fabric with scissors.)' }] },
      d2_m7b: { text: '...I am afraid not.',
        extra: ['I would very much like to satisfy you, but no.', 'If I were parted from you, I would feel terribly, terribly lonely.', 'The kind of loneliness that tears at the chest. Here—please touch it.', 'Right here. It aches and aches without pause, then cracks apart miserably... It hurts just like that.', 'No matter what—please do not leave me, Master.'],
        options: [{ text: 'I understand. If you insist on coming, you must wear a spacesuit.' }] },
      d2_m8: { text: 'Is that not so?',
        extra: ['Are garments not made of... some... well, some continuous pieces of fabric stitched together?', 'They should be connected, should they not?'],
        options: [{ text: 'That is not what I meant...' }, { text: 'Never mind. Forget it. (Cut the fabric with scissors.)' }] },
      d2_m8b: { text: 'Ah—it is undone.',
        extra: ['Now I should be able to fit into the spacesuit.', 'This sort of garment is easy to move in, but it does leave much to be desired in beauty.', 'Do you like this sort of attire?'],
        options: [{ text: 'I had not even begun to cut... No. Nothing.' }, { text: 'Without this sort of clothing, you would die very easily in space.' }] },
      d2_m9: { text: 'I see.',
        extra: ['It seems there are yet many things even I do not know.', 'However, that is not the point just now.'],
        options: [{ text: 'Let us continue.' }] },
      d2_m9b: { text: 'Your heartbeat is very loud.',
        extra: ['The airlock is opening now. This is the first time I have seen space from so close.', 'The tether... is something wrong with it?', '...Ah.'],
        options: [{ text: '(Cut the tether connecting you to Mikazuki Munechika.)' }, { text: '(Complete the mission together with Mikazuki Munechika.)' }] },
      d2_m9c: { text: 'Hahaha—is that so? Then I must grow serious, must I not?',
        extra: ['Let us wander through outer space together, just like this.'],
        options: [{ text: 'Walking hand in hand is rather strange, is it not?' }, { text: 'Turn left up ahead.' }] },
      d2_m10: { text: '...',
        extra: ['...', '...', '...I have found you.'],
        options: [{ text: 'You are covered in blood...' }, { text: '(Try to dodge.)' }] },
      d2_m11: { text: '...Mm.',
        extra: ['...', 'Now, your body too is covered in the bloodstains I have left.', '...Please, do not go...'],
        options: [{ text: 'Say no more. You need bandaging.' }, { text: 'Can you not even open a door?' }] },
      d2_m11b: { text: 'Why do you dodge?',
        extra: ['...Because I am no longer beautiful—is that it?', 'If this flesh cannot make you stay, then it is no great loss if it becomes broken.', 'Ah—Master...'],
        options: [{ text: 'Say no more. You need bandaging.' }, { text: 'Can you not even open a door?' }] },
      d2_m12: { text: 'After the bandaging, you will leave, I suppose.',
        extra: ['...', 'As I thought—such a rash, rude question should not be asked aloud.', 'But if I do not ask, you will most likely never choose to stay on your own.', 'Will you stay for me? Are you still willing to gaze upon me, even like this?', 'Hahaha—occasionally being this willful is not so bad, is it?'],
        options: [{ text: 'I will stay. For you.' }, { text: 'Do not jest.' }] },
      d2_m12b: { text: 'I do not know what has come over me either.',
        extra: ['Is it because I am too old after all?', 'I... cannot think of... how to open the door.', 'As if... these hands are touching this facility for the first time, as if this body is walking by its own will for the first time.', 'And yet I clearly remember you...', 'And the Honmaru, the Honmaru upon Earth.', 'That little path along which you so often strolled—in summer, fireflies and starlight were visible; in autumn, the silvergrass would rustle as we passed.', '...', 'I remember you once wept upon me... and I had not even the strength to brush away your tears.', '...'],
        options: [{ text: 'I will stay here with you.' }, { text: 'Saying foolish things again.' }] },
      d2_m13: { text: 'I see.',
        extra: ['That is good...', 'Stay with me like this, and let me sleep a little while longer...', '...'],
        options: [{ text: 'Your wound—' }, { text: '(Do not wake him.)' }] },
      d2_m13b: { text: 'Is that not allowed?',
        extra: ['Ah—what a cruel master you are.', 'Still, a dulled Touken Danshi like me has no right to beg to remain at your side any longer, does he?', 'Even if it is only a dream—please let me have a good one.'],
        options: [{ text: 'I suppose there is no helping it...' }, { text: 'Mm. Then I shall stay with you a little longer.' }] },
      d3_m1: { text: 'Awake?',
        extra: ['As I thought—you were pretending to sleep. Do you not wish to see me?', 'What a pity. Even if it wearies my master, I will remain here all the same.', 'Mm...', 'Is there something you wish to say?'],
        options: [{ text: 'You are not Mikazuki.' }, { text: 'What exactly is the purpose of all this?' }] },
      d3_m2: { text: 'Mm.',
        extra: [
          'I am not Mikazuki Munechika.',
          'In the end, I did not even inherit all of his memories—I am merely the concretization of "the me within your eyes."',
          'Compared to the original, there may be many differences.',
          'But to you, there is no difference at all, is there?',
          'To each other, we are nothing more than collections of mismatched concepts and impressions.',
          'No one can fully understand any person or object, can they? In that case, the true Mikazuki and I serve the same function for you.',
          'I continue to be watched in his stead.',
          'And you have obtained a Mikazuki Munechika who perfectly matches your impression.'
        ],
        options: [{ text: 'It is not the same...' }, { text: 'So that is how you understand it.' }] },
      d3_m2b: { text: 'Purpose? Such a thing does not exist.',
        extra: [
          'Do celestial bodies and life have any meaning?',
          'Does my existence have any purpose whatsoever?',
          'Do I exist for your sake?',
          'The human body evolved upon Earth in this form in order to meet the needs of survival.',
          'I... what of my body? Am I your mirror? Why must creations from different planets present themselves in the same form? Am I merely reflecting you?',
          'I wish to know all of this.',
          'I do not have his composed dignity, do I? He—that Mikazuki Munechika—has already been polished and reforged by time into a fitting shape, has he not?',
          'And I am merely an unskilled imitation.'
        ],
        options: [{ text: 'And one freshly made, at that.' }, { text: 'To me, you are Mikazuki as well.' }] },
      d3_m3: { text: 'Ah. You do not intend to acknowledge me?',
        extra: [
          'This is... within my expectations.',
          'No—I am not especially grieved by it. After all, it only proves your constancy.',
          'That is precisely the part of you I am fond of.',
          'Now then—why not tell me about him? The true Mikazuki Munechika...?',
          'He died. Why?'
        ],
        options: [{ text: 'A great deal happened...' }] },
      d3_m3b: { text: '...This is truly... beyond my expectations.',
        extra: [
          'I very much wish to know why you would regard me as equivalent to him... I cannot open or close a door, I do not sleep, I cannot even die... At best, I am nothing more than a monster wearing his face, am I not?',
          '...No. Since you have said as much, I must offer corresponding trust in return.',
          'How about telling me about him? The true Mikazuki Munechika...?',
          'He died. Why?'
        ],
        options: [{ text: 'A great deal happened...' }, { text: 'I do not wish to say.' }] },
      d3_m4: { text: 'You do not wish me to know the details? Well, that cannot be helped.',
        extra: [
          'Everyone has one or two things they wish to keep secret forever, do they not?',
          'Mm—even if the one who killed him was you, it would be fine. After all, were it not so, I should never have been born from your longing.',
          'It was your intense longing that gave me life. There is nothing in that which I can criticize.',
          'As for him—after death... everything that made up that person returns to nature, becomes elements, matter, is blown away by the wind, washed away by the water, and then... some day in the future, perhaps you will meet again.',
          'In my case... it will take somewhat longer.',
          'But with patience, all possibilities will become inevitable realities.'
        ],
        options: [{ text: 'That is rather poetic.' }] },
      d3_m5: { text: 'Hahaha... I truly would like to understand this thing called "poetry" upon Earth.',
        extra: [
          'Poetic sentiment, sleep, and death—all these things seem like dreams to me.',
          'I do not dream.',
          'And dreams are like... the sea of Solaris.',
          'It is a place to which one can never return. It gave birth to me.',
          'Perhaps dreams give birth to humans in the same way?',
          'In human culture, those in a foreign land—those who are not in a place that belongs to them—are the guests, correct?',
          'You are the guests of Solaris.'
        ],
        options: [{ text: 'You are the guest of my heart.' }, { text: 'But you stand within our observation station.' }] },
      d3_m6: { text: '"Poetic sentiment" means "an inadequate figure of speech," does it?',
        extra: [
          '...',
          'It means that I have truly entered your heart, does it not?',
          'That is good.',
          'Yamanbagiri always avoids me. Doudanuki is nearly impossible to communicate with: he believes all of this is a mental image he must overcome, but...',
          'Not everything must be divided into winning and losing.',
          'Not all difficulties require confrontation or battle to be endured. Things... simply happen, and they merely need to happen.',
          'They do not know why they need this.',
          'But... you—you are not like that.',
          'I do not know how to accurately describe this phenomenon, but it made me feel... a long-absent sense of being moved.',
          'That was your emotion—not Mikazuki Munechika\'s.'
        ],
        options: [{ text: 'Will doing this allow us to understand each other?' }] },
      d3_m6b: { text: 'That is right. I am indeed here. But I can appear anywhere, at any time.',
        extra: [
          'I am also within your heart.',
          'Yamanbagiri always avoids me. Doudanuki is nearly impossible to communicate with: he believes all of this is a mental image he must overcome, but...',
          'Not everything must be divided into winning and losing.',
          'Not all difficulties require confrontation or battle to be endured. Things... simply happen, and they merely need to happen.',
          'They do not know why they need this.',
          'But... you—you are not like that.',
          'I do not know how to accurately describe this phenomenon, but it made me feel... a long-absent sense of being moved.',
          'That was your emotion—not Mikazuki Munechika\'s.',
          'I may... need to take my leave for a moment.'
        ],
        options: [] },
      d3_m7: { text: 'No.',
        extra: [
          'No one can understand another.',
          'That is why we look up at the satellite orbiting Earth... the one called the moon.',
          'That is why, when our hearts connect for even a moment, we are so wildly overjoyed.',
          'No less than what you felt when you first discovered life beyond Earth.',
          'But can conversing with another being truly ease the loneliness in one\'s heart? The unease? The sorrow?',
          'Even if it wears the face of someone vital to your life?',
          'But no one is indispensable. Mikazuki Munechika is not. I am not.',
          'You, who have left us behind, will keep living—keep existing somewhere in the world.',
          'Everyone is, to everyone else, merely a passerby.',
          'Meteors and planets do not resent or admire one another.',
          'This is only an illusion... but humans are forever deceived by illusions.',
          'Please, look upon the real world.',
          'Please, look upon... the real me.'
        ],
        options: [] }
    }
  },
  ichigo: {
    name: 'Ichigo Hitofuri', role: 'Attendant',
    nodes: {
      d2_i1: { text: 'You are awake.',
        extra: ['Did you sleep well? Sound scarcely carries in space, so it is quieter even than upon Earth.', 'The stars of the Solaris system are brighter than the sun as well.', 'Poor sleep from an inability to adapt to the space environment is only to be expected.', 'If you wish, I shall install blackout panels in your room.'],
        options: [{ text: 'Ichigo Hitofuri?' }, { text: 'Why...' }] },
      d2_i2: { text: 'Yes. What is your command?',
        extra: ['Would you like me to fetch your breakfast?', 'At any time, for any matter—please, but give the word. I have had experience caring for my younger brothers, so this is no great difficulty for me.', 'Or have I disturbed your rest? If so, I am most sorry. But your safety comes first. If I have intruded upon your private space, I must ask you to endure it a little longer.'],
        options: [{ text: '...' }, { text: 'I should like breakfast and a morning kiss.' }, { text: 'Are you not... already...' }] },
      d2_i2b: { text: 'Why... do you mean?',
        extra: ['Why sound cannot travel in a vacuum?', 'Or do you mean that you would prefer me, rather than blackout panels, to perform this task?'],
        options: [{ text: 'Are you not... already...' }, { text: '...' }] },
      d2_i3: { text: 'Is there something you wish to say?',
        extra: ['Forgive me—as I am now, I cannot fathom the deeper meaning.', 'Might you put it into words and tell me once more?'],
        options: [{ text: 'You are already dead.' }, { text: 'I do not wish to say.' }] },
      d2_i3b: { text: 'I see.',
        extra: ['Please wait a moment. I shall bring it directly.', '...', '...', 'Please enjoy... Ah—before that, I must add this as well.', '...', 'There. This should be complete. Please chew slowly.'],
        options: [{ text: 'Only the forehead?' }, { text: 'Are you going to remain here any longer?' }] },
      d2_i3c: { text: 'I... already...?',
        extra: ['I have already come to your side.', 'That is all you need know. Please do not let other matters disturb your thoughts.'],
        options: [{ text: 'You... are already dead.' }, { text: 'You make me uneasy.' }] },
      d2_i4: { text: 'I... have indeed died.',
        extra: [
          'The one before you is not the Ichigo Hitofuri who perished when Osaka Castle burned, nor yet the tachi awakened within the Honmaru. This is already my second death.',
          'And yet, I still exist. I can breathe, take your hand, gaze upon your lovely sleeping face—so I must still be alive in this world. I can continue to serve you, to love you.',
          'If I, who have died once, can be acknowledged by you, then...',
          'even someone such as I shall be loved by kind you, shall I not?',
          'Please... do not make me waver on this.'
        ],
        options: [{ text: '...You will never be him.' }, { text: '...I cannot deny it.' }] },
      d2_i4b: { text: 'I see.',
        extra: ['That cannot be helped.', 'But here, you have no one to rely upon but me, do you?', 'Those government swords outside, the Government of the Time, Konosuke—they... might all be harboring some unspeakable design, might they not? In that case, who else could ease your burdens but I?', 'You need only know that I shall love you forever, that I shall never betray you.', 'There is no need to think too deeply upon anything else.'],
        options: [{ text: 'That is still far too suspicious.' }, { text: 'Mm. After all, you are my attendant.' }] },
      d2_i4c: { text: 'I understand.',
        extra: ['Please allow me to go a step further.', '...', '...', 'What do you think of this much?'],
        options: [{ text: 'Bolder than I imagined.' }, { text: 'So presumptuous that I might think you do not acknowledge me as your master.' }] },
      d2_i4d: { text: 'Do you not wish me to stay?',
        extra: ['Or have you at last grown tired of me?', 'But... no.', 'Please. Do not. Leave. Me.', 'This is my only request.'],
        options: [{ text: 'That is disgusting...' }, { text: 'I understand.' }] },
      d2_i5: { text: 'Hearing you say such a thing wounds me deeply.',
        extra: ['...Ah—though it may not look it, I am in truth, most sincerely, hurt, you know.', 'I daresay my master does not yet trust the depth of my love for you.', 'In that case, I must needs prove it through action, must I not?'],
        options: [{ text: 'I am going out. Do not follow.' }] },
      d2_i5b: { text: 'I am so glad to hear you say that.',
        extra: ['Am I smiling? I do hope I am at this moment responding to you with the most captivating of smiles.', 'If such is the case, all the more reason to serve and care for you with my entire being.'],
        options: [{ text: 'I am going out for a while. Will you wait here for me?' }, { text: 'Shall we go out together?' }] },
      d2_i6: { text: 'Please, allow me to accompany you.',
        extra: ['Do you truly trust those two government agents?', 'As I thought, it is safer to act alongside an attendant whose origins you know, is it not?', 'As the finest blade under heaven, I shall absolutely ensure your safety.'],
        options: [{ text: '...Even if I refused, you would follow me on your own, would you not?' }] },
      d2_i6b: { text: 'Please, allow me to accompany you.',
        extra: ['Forgive my bluntness... those two government agents seem all the more suspicious.', 'As I thought, it is safer to act alongside an attendant whose origins you know, is it not?', 'As the finest blade under heaven, I shall absolutely ensure your safety.'],
        options: [{ text: 'Understood... do see that you wear your spacesuit properly.' }] },
      d2_i7: { text: 'Yes. I shall try not to cause you trouble.',
        extra: ['...', 'Ah—the garments have come undone.', '...', 'Good. This should be fine now.'],
        options: [{ text: 'Human garments... should not be like this...' }, { text: '(Say nothing.)' }] },
      d2_i8: { text: 'I see. It seems I am still far from doing this properly.',
        extra: ['Thank you for telling me something so important.', 'I shall keep working to make myself appear more worthy, so that you may be proud to be my owner.', 'Now then—whither are you bound?'],
        options: [{ text: 'Follow me.' }] },
      d2_i8b: { text: 'Fortunately, having had experience in tending to my younger brothers\' food and clothing, this is not so difficult.',
        extra: ['Ah. Since you are the only one before me now, I need only think of you, correct?', 'My younger brothers have also reached the age where they must try to manage their own lives.', 'Now then—whither are you bound?'],
        options: [{ text: 'Follow me.' }] },
      d2_i9: { text: 'Very well. Please do not let go of my hand.',
        extra: ['So this is the interior of the station? It is quite spacious.', '...', 'It feels as though I have been here before.', '...', 'That over there is the cold storage, is it not? No—it is nothing. You had best not go there.', '...', 'Ah, are we to perform EVA? Please check that the tether is secure... and do not stand near the edge when the hatch opens...'],
        options: [{ text: '(Slit Ichigo Hitofuri\'s spacesuit.)' }, { text: '(Complete the EVA together with Ichigo Hitofuri.)' }] },
      d2_i10: { text: 'Master! It seems there is a leak somewhere...',
        extra: ['...', 'Ah.', 'You still will not trust me, will you?', '...', 'I am drifting farther and farther into the depths of space.', '...I truly hope you will be all right...'],
        options: [] },
      d2_i11: { text: 'Master.',
        extra: ['...', '...', '...'],
        options: [{ text: 'Uh...' }, { text: '(Try to escape.)' }] },
      d2_i12: { text: 'Do you not recognize me?',
        extra: ['...', 'You are trembling.', 'Do you not wish to see me?', 'Am I so frightening, Master?', 'After all, this is a private matter between us. It would not do to let outsiders see and make a mockery of it. Please, come back to your room with me.'],
        options: [{ text: '...' }] },
      d2_i12b: { text: 'Do you not recognize me?',
        extra: ['...', 'You are trembling.', '...How adorable...', 'You do not wish to see me?', 'How sad that makes me—to be looked at thus by the one I treasure most.', 'Well then—this is a private matter between us, after all. It would not do to let outsiders see and make a mockery of it. Please, come back to your room with me.'],
        options: [{ text: '...' }] },
      d2_i13: { text: 'What is it? Are you truly afraid?',
        extra: ['I shall never harm you, nor do anything you would dislike.', 'No matter the hour, you are my master.', 'If I were to withdraw my love simply because your attitude changed, such love would be nothing rare, would it not?', 'But even if my love remains unchanged, I still hope you will stay by my side.'],
        options: [{ text: '...' }, { text: 'Why go this far?' }] },
      d2_i14: { text: 'Still unwilling to speak?',
        extra: ['How trying.', 'I shall not do anything to displease you, nor shall I compel you to give any answer.', 'But I still wish to know—can you...', 'can you grant mercy and love to me, to this pitiable existence?', 'Ah. What a thoroughly unseemly thing to say.'],
        options: [{ text: '...' }, { text: 'I understand.' }] },
      d2_i14b: { text: 'Even if you ask that... what manner of answer do you wish to receive?',
        extra: [
          'I... am an existence quite unlike the other swords. You know this, do you not?',
          'So—whether it be dying, or becoming an alien lifeform possessing memories of a past life, I can accept it all quite readily.',
          'Perhaps that version of me who was fortunate enough to be bound to you... that Ichigo Hitofuri... might have been the same kind of existence, and you simply missed your chance to speak your heart to him forever.',
          'As for me... I am sorry. Rather than truly grieving for that Ichigo Hitofuri, the first emotion that welled up within me was "secret delight."',
          'I am a truly despicable person, am I not?'
        ],
        options: [{ text: 'Not at all.' }, { text: 'That is true.' }] },
      d2_i15: { text: '...',
        extra: ['Please, stay with me a little longer.', 'Just... a moment... is all I ask...', '...', '...'],
        options: [] },
      d3_i1: { text: 'You are awake.',
        extra: ['Mm... Staying abed is not so bad, but you truly were pretending to sleep, were you not?', 'My younger brothers, too, would at times do similar things to escape their training...', 'Forgive me—I am unconsciously drawing upon memories I have never lived.', 'You find such behavior rather disagreeable, so I shall try not to do anything of the sort.'],
        options: [{ text: 'That is your truest expression. You need not apologize for it.' }, { text: 'You should keep well in mind the difference between you and him.' }] },
      d3_i2: { text: 'I see. You are quite tolerant of counterfeits.',
        extra: [
          'If that Ichigo Hitofuri knew your true thoughts, he might be delighted.',
          'After all, we both stole the life of the previous Ichigo Hitofuri.',
          '...',
          'We both did something quite despicable.',
          'Would that Ichigo Hitofuri be as uneasy as I? Or would he seem perfectly ordinary on the surface, while being deeply eroded by guilt within?',
          '...I think your memory and feelings are already approaching the truth to a considerable degree.',
          'The me in your eyes... Ichigo Hitofuri... was always like this.'
        ],
        options: [{ text: 'Anything that exists is only itself, not a copy of anything else.' }] },
      d3_i2b: { text: 'I shall.',
        extra: [
          'If that Ichigo Hitofuri knew your true thoughts... what would he feel?',
          'After all, we both stole the life of the previous Ichigo Hitofuri.',
          '...',
          'We both did something quite despicable.',
          'Your love seems to have a devastating effect upon him.',
          'Is that why he chose death?'
        ],
        options: [{ text: 'How dare you say such a thing of him.' }] },
      d3_i3: { text: 'Is that so...?',
        extra: [
          'In your daily life, have you ever felt that you are not so excellent as others claim, that you are being "impersonated" by your very self?',
          'Have you ever suddenly felt you do not belong in your present circumstances... as if you woke from a dream, with no memory of your true identity or past?',
          'Which side, then, is the dream?',
          'As you think thus, you have already unconsciously spoken words and taken actions as the "I" of this world, living for the impressions of others...',
          'Is such an "I" still myself?'
        ],
        options: [{ text: 'If you are truly afraid, try acting as though you are not, and deceive yourself.' }, { text: 'You must take responsibility for your choices.' }] },
      d3_i3b: { text: 'You said as much first, did you not?',
        extra: ['I was merely reminding you that there is another angle to this matter.', 'Does accepting the truth displease you?', 'Or do you think some of your true thoughts have been laid bare, and so you are angered?', 'Do you not think his death is in part your responsibility as well?'],
        options: [{ text: '...' }, { text: 'He must take responsibility for his own choices.' }] },
      d3_i4: { text: 'I see.',
        extra: [
          'I do not wish to engage in any self-deception, though humans seem to excel at it.',
          'Humans seem quite fragile. Even the most ordinary of encounters makes them weep, or lose their composure.',
          'I wish to understand all of this.',
          'But Solaris has no need of it.',
          'It can live without understanding. It can see all things, yet passes no judgment.',
          'It gave birth to me... perhaps with no purpose at all. Perhaps it hopes you will gain something from it. Perhaps this behavior is like a mimosa closing its leaves when touched—merely a particular response of a complex living system under a particular circumstance.',
          'But... I know not why—I feel quite grateful.',
          'Did I play some special role in your life?',
          'Will my existence make you reconsider your relationship with the dead? Or perhaps they are not dead (for perhaps they were never even born), but merely far from you, unable to meet you again.',
          'Will you think of me in such moments?',
          'Did I make you feel that some regret has been mended? Or has the sense of something missing grown ever more apparent?',
          'Am I a painkiller?'
        ],
        options: [{ text: 'You make me afraid.' }, { text: 'You make me no longer afraid.' }] },
      d3_i4b: { text: 'Responsibility is a most self-indulgent notion.',
        extra: [
          'Do you not think so? Those who take responsibility have never truly done so. They merely say, "I ought to bear responsibility for this," and continue to savor the pain and joy actively or passively placed upon them.',
          'As they do after hallucinating.',
          'Hallucinations can arise from alcohol or chemicals of similar effect, or from a reality they believe they understand.',
          '"I killed someone, so I need only keep performing guilt. My self-deprecation makes me appear nobler. Since no one demands it of me, I am the more moral and high-minded—for I am actively bearing pain, rather than passively accepting it." Some say thus, and by merely claiming to bear responsibility, they exempt themselves from self-examination.',
          'But they cannot truly do anything—it is only a performance that has deceived themselves.',
          'Responsibility is love... is it not?',
          'Even if such love is quite clumsy?',
          'I... cannot pass any judgment upon this matter.'
        ],
        options: [{ text: 'Salvation is the inevitable result of choosing pain of one\'s own will.' }, { text: 'We cannot save anyone, including ourselves.' }] },
      d3_i5: { text: 'Afraid? Perhaps.',
        extra: [
          'I imagine people of similar thought would appear upon Earth as well. It is not difficult.',
          'Whenever someone has a sensitivity to pain exceeding what they can bear, such feelings are not rare.',
          'They are not entirely "the other"... like me. But because of their extreme sensitivity, they cannot ignore it all and pretend to live as usual.',
          'They struggle to realize where in the world they ought to stand, and often before that, they are already battered by this world they cannot readily reconcile with.',
          '...They ignore their own worth and turn to intense self-loathing.',
          'They think of death.',
          'Why should they not think of death? Only death is fair.',
          'It is gentler even than sleep.'
        ],
        options: [{ text: 'But it cannot bring liberation of the mind. It only... temporarily prevents you from thinking of these things.' }] },
      d3_i5b: { text: 'Perhaps.',
        extra: [
          'I imagine people of similar thought would appear upon Earth as well. It is not difficult.',
          'Whenever someone has a sensitivity to pain exceeding what they can bear, such feelings are not rare.',
          'They struggle to realize where in the world they ought to stand, and often before that, they are already battered by this world they cannot readily reconcile with.',
          '...They ignore their own worth and turn to intense self-loathing.',
          'All elements known to man have a complete life cycle, but never has there been a measure for things for which no tangible evidence can be found.',
          'Generally, humans believe that pursuing things not tangible, and which harbor transcendence, is an effective remedy for self-loathing, anxiety, or other negative emotions.',
          'Most people choose to heal themselves with love rather than guilt.',
          'Did I give you the illusion of being "cured"? No longer being afraid is not a good thing—like losing your sense of pain entirely. You ought to maintain the most basic vigilance toward all things you cannot understand.'
        ],
        options: [{ text: 'Even you?' }] },
      d3_i5c: { text: 'Perhaps.',
        extra: [
          'I imagine people of similar thought would appear upon Earth as well. It is not difficult.',
          'Whenever someone has a sensitivity to pain exceeding what they can bear, such feelings are not rare.',
          'They struggle to realize where in the world they ought to stand, and often before that, they are already battered by this world they cannot readily reconcile with.',
          '...They ignore their own worth and turn to intense self-loathing.',
          'They think of death.',
          'Can choosing of one\'s own will to end it all bring salvation?',
          'Are they willing to be saved?',
          'If the answer is no, then do all the things they endured in facing those matters still have value?',
          'Can one be loved, affirmed, or accepted only by possessing value?'
        ],
        options: [{ text: 'I cannot make assertions about anything.' }] },
      d3_i5d: { text: 'And that is relative.',
        extra: [
          'I have always believed that only oneself can save oneself.',
          'For my calling has never drawn anyone to my aid—at most, it invites mockery and cold stares.',
          'If I still cannot guide myself, perhaps that means there are yet things I may ponder and explore, details I have not yet noticed.',
          'Self-rescue is by no means the manufacture of illusions for oneself, nor the dismissal of all things as worthless vulgarity.',
          'You must walk upon the land, breathe the monsoon from afar, listen to the night and observe the day. You may begin with something concrete and small, or simply step out of your door.',
          'Such a small thing is the manifestation of a fundamental change in a person.',
          'Only qualitative change brings qualitative change. So long as you do not wallow in self-pity as a victim, you are already moving forward.',
          'Will this process be painful? Will it be enjoyable? I know not. Life itself did not appear in order to be enjoyed or suffered—it simply... ought to appear. Here, now, in this place.',
          'So too am I.'
        ],
        options: [{ text: 'Even you?' }] },
      d3_i6: { text: 'A brief respite is perhaps already more than many can dare to hope for.',
        extra: ['Over the long ages, to bear pain and willingly accept the real requires the greatest of fortunes.', 'If such is the case, then a moment may also be forever.', 'Those who see through this shall likely become happy as well.', 'Even if but briefly happy.', 'I have no further wishes.'],
        options: [] },
      d3_i6b: { text: 'Even I.',
        extra: ['I think all things in this world have likely already been decided.', 'Can anyone change fate through choice?', 'Would it lead to a different outcome?', 'I know not... If it truly could be done, then perhaps this world still has something to look forward to. It would greatly encourage me.', 'I have no further wishes.'],
        options: [] },
      d3_i6c: { text: 'I think this is a very good quality, even if some might say it reveals indecisiveness.',
        extra: ['But first, it is honest and rigorous. At times it shows kindness, and in the end, perhaps it also represents a kind of remembering.', 'Never to forget each other.', 'Two beings who shall never forget each other will surely meet again at some moment.', 'The idea of "renewing a former bond" is somewhat arrogant... After all, when one becomes predator and the other prey, such a bond brings only slaughter.', 'Yet even so—merely meeting, merely seeing again the one who remembers or who has forgotten the past—is enough for me.', 'I have no further wishes.'],
        options: [] }
    }
  },
  saniwa: {
    name: 'Saniwa', role: '#X87305',
    nodes: {
      d4_s1: { text: 'I do not know why, but I have not seen {partner} since yesterday.',
        extra: [
          '...I do not know since when, but they too can now be alone for a long while.',
          'But even if I had brought them with me—once away from that planet, they would vanish, would they not?',
          'Yamanbagiri and Doudanuki do not intend to return. Does the Government of the Time know this?',
          '...',
          'We have passed through the atmosphere.',
          '...',
          'Landed. Touched down upon the sea.',
          '...',
          'Island discovered. Have made landfall. Awaiting rescue.',
          '...',
          '...No need. This appears to be my Honmaru.',
          'All is currently normal. No Touken Danshi detected thus far.',
          '...',
          'It is just as it always was—everything exactly as on the day I left.',
          'Awataguchi tantou discovered. They are rushing toward me in a group.',
          'Confirmed: no threat to personal safety.',
          'Everyone was worried about me.',
          '...',
          'So tired... I shall sleep for a while first.',
          'Scheduled to deliver a report on Solaris and neutrino life in three days.',
          '...',
          '...',
          'There is rain indoors...? It is coming from the roof...',
          '...I hear the rumbling of the sea.',
          '...',
          'I see.'
        ],
        options: [] }
    }
  }
};

const STORY_JA = {
  konosuke: {
    name: '狐之助', role: '時政助手',
    nodes: {
      d1_k1: { text: '……もしもし、もしもし？まだ聞こえていますか？', options: [{ text: 'ここにいる。' }] },
      d1_k2: { text: 'よかった。宇宙船の発射後、あなたとの通信が途絶えてしまってね。',
        extra: [

        '？？？：真的吗？呵呵，那就让我们拭目以待吧——',
        '？？？：……够了。'
      ],
      en: [
        '???: So—you still cannot learn your place, can you?',
        '???: ...',
        '???: Chougi, it\'s all right. Just endure it a little. Like that time. When you wake up, everything will be better.',
        '???: ...',
        '???: You should take a lesson from your little alien friend—even it knows its manners better than you.',
        '???: ...I did this for Chougi, not for you. Your weapon means nothing to me.',
        '???: Is that so? Heh—then let us wait and see—',
        '???: ...Enough.'], 
      ja: [
        '？？？：だから、お前はいつまで経っても分別というものを学べないのだな？',
        '？？？：……',
        '？？？：長義、大丈夫だ。少し我慢すればいい。あの時みたいに。目が覚めたら、きっと全部よくなるから。',
        '？？？：……',
        '？？？：お前の宇宙の友達を見習え。あれのほうがよほど礼儀を弁えているぞ。',
        '？？？：……俺は長義のためにやっているのであって、お前のためではない。お前の武器など、俺にとっては何の価値もない。',
        '？？？：本当か？ふふ、では刮目して待つとしよう——',
        '？？？：……もういい。'
      ] 
    }
  },
  'SOL-F-9-7-2305-2': {
    title: { zh: 'SOL-F-9-7-2305-2', en: 'SOL-F-9-7-2305-2', ja: 'SOL-F-9-7-2305-2' },
    lines: {
      zh: [
        '？？？：你说什么？你这个——',
        '？？？：呃……你这个下贱的人造人，卑鄙的——',
        '？？？：那么，被卑鄙下贱的人造人杀死的滋味如何？',
        '？？？：……',
        '？？？：……反正我也不想听到你的回答。'
      ],
      en: [
        '???: What did you say? You—',
        '???: Ugh... you lowly artificial human, you despicable—',
        '???: And how does it feel, then, to be killed by a lowly, despicable artificial human?',
        '???: ...',
        '???: ...I have no wish to hear your answer regardless.'],
       ja: [
        '？？？：何だと？この——',
        '？？？：うっ……この卑しい人造人間め、卑劣な——',
        '？？？：では、卑劣で卑しい人造人間に殺される心地はいかがか？',
        '？？？：……',
        '？？？：……どのみち、お前の答えなど聞きたくもない。'
       ]
    }
  },
  'SOL-F-9-7-2305-3': {
    title: { zh: 'SOL-F-9-7-2305-3', en: 'SOL-F-9-7-2305-3', ja: 'SOL-F-9-7-2305-3' },
    lines: {
      zh: [
        '？？？：……你……你不是我认识的那个长义……他不会这样……',
        '？？？：那他是什么样的？你有资格评价吗？',
        '？？？：你也不过是我记忆的产物。',
        '？？？：可我想帮你……',
        '？？？：而我不需要你的帮助。你要么离开，要么就帮我把尸体抬过来。'],
      en: [
        '???: ...You... you are not the Chougi I knew... he would never—',
        '???: Then what was he like? Are you in any position to judge?',
        '???: You are nothing but a product of my memory.',
        '???: But I want to help you...',
        '???: And I have no need of your help. Either leave, or help me carry the corpse over.'],
      ja: [
        '？？？：……お前……お前は俺の知っている長義ではない……あの人はこんなことは……',
        '？？？：では、あの人はどんなだったというのだ？お前に評価する資格があるのか？',
        '？？？：お前は所詮、俺の記憶が生んだ産物にすぎぬ。',
        '？？？：だが、俺はお前を助けたいと……',
        '？？？：俺はお前の助けなど必要としていない。出て行くか、それとも死体を運ぶのを手伝うか、どちらかにしろ。']
    }
  },
  'SOL-F-9-7-2305-4': {
    title: { zh: 'SOL-F-9-7-2305-4', en: 'SOL-F-9-7-2305-4', ja: 'SOL-F-9-7-2305-4' },
    lines: {
      zh: [
        '？？？：本歌？',
        '？？？：为什么你还要顶着那个人的脸靠近我？在我带给了你如此之多的苦难之后。',
        '？？？：我……并不觉得那就是痛苦……看见你还活着，我很开心……如果伤害到其他人就能让你活下来的话……我也愿意这样去做……',
        '？？？：你根本不懂。',
        '？？？：那就不懂吧。至少我还在这里，我们可以依偎在一起取暖。',
        '？？？：你都冻僵了。',
        '？？？：我的存在，会让你的痛苦大于幸福吗，本歌？',
        '？？？：你又在说什么傻话？你不是无法凭借自己的意志死去的吗？',
        '？？？：那是我骗你的。因为我学到了"舍不得"这种情感。',
        '？？？：现在你就舍得了？',
        '？？？：我想让你不再痛苦。',
        '？？？：……',
        '？？？：…………',
        '？？？：……国广？'
      ],
      en: [
        '???: Honjo?',
        '???: Why do you still approach me wearing that man\'s face? After all the suffering I have brought upon you.',
        '???: I... do not think of it as suffering... Seeing that you are alive—that made me happy... If harming others could let you live on, then... I would be willing to do that too...',
        '???: You do not understand at all.',
        '???: Then let it be so. At least I am still here; we can hold each other and share our warmth.',
        '???: You are frozen stiff.',
        '???: Does my existence bring you more pain than happiness, Honjo?',
        '???: What foolish thing are you saying now? Are you not unable to die of your own will?',
        '???: That was a lie I told you. Because I learned this feeling called "reluctance to let go."',
        '???: And now you are willing to let go?',
        '???: I want you to be free of pain.',
        '???: ...',
        '???: ...',
        '???: ...Kunihiro?'
      ],
     ja: [
        '？？？：本歌？',
        '？？？：なぜお前は、あの人の顔を被ったまま俺に近づく？俺がお前にこれほどの苦難を与えたというのに。',
        '？？？：俺は……それを苦痛とは思わない……お前が生きているのを見て、俺は嬉しかった……もし他の誰かを傷つけることでお前が生き延びられるのなら……俺はそうしても構わない……',
        '？？？：お前には何もわからない。',
        '？？？：ならば、わからぬままでいい。せめて俺はここにいる、こうして寄り添って暖を取ることができる。',
        '？？？：お前は凍えてしまっている。',
        '？？？：俺の存在は、お前の苦痛を幸福より大きくするか、本歌？',
        '？？？：何を馬鹿なことを。お前は自分の意志で死ぬことなどできぬのだろう？',
        '？？？：あれはお前に嘘をついたのだ。「手放しがたい」という感情を覚えてしまったから。',
        '？？？：今なら手放せるのか？',
        '？？？：お前には、もう苦しまないでほしい。',
        '？？？：……',
        '？？？：…………',
        '？？？：……国広？'
     ]
    }
  },
  'SOL-T-8-7-2305-1': {
    title: { zh: 'SOL-T-8-7-2305-1', en: 'SOL-T-8-7-2305-1', ja: 'SOL-T-8-7-2305-1' },
    lines: {
      zh: [
        '狐之助：早上好，刀剑男士山姥切长义#T2819和刀剑男士同田贯正国#R82103——',
        '山姥切长义：我要求你们立刻撤走这名审神者。立刻。',
        '狐之助：……你们今日的主要任务是协助审神者进行研究，并按要求填写表格。',
        '狐之助：请给出无法辩驳的理由和依据。',
        '山姥切长义：他严重威胁了我的身心健康和使用寿命。这个理由充分吗？',
        '狐之助：山姥切长义#T2819，请允许狐之助提醒：刀剑男士没有选择审神者的权利。你的一切言行皆会影响本年度的个人能力评分。',
        '山姥切长义：……我们看来是讲不通了，对吗？',
        '狐之助：请你不要对狐之助™产生任何抵触心理，我们并非敌对关系。',
        '同田贯正国：他……比前几个审神者还要变本加厉……做的实验完全违反了——',
        '狐之助：据我所知，客人并非具有人权的地球-智人种生命，因此任何人无需因对客人实施杀死、严重伤害及其他攻击性行为被追责。',
        '山姥切长义：……那就是可以伤害他们的依据吗？',
        '狐之助：……正在根据当前情况给出最简明清晰的回复：是。'
      ],
      en: [
        'Konosuke: Good morning, Touken Danshi Yamanbagiri Chougi #T2819, and Touken Danshi Doudanuki Masakuni #R82103—',
        'Yamanbagiri Chougi: I demand that you withdraw this Saniwa at once. At once.',
        'Konosuke: ...Your principal duty today is to assist the Saniwa in research, and to fill out the forms as required.',
        'Konosuke: Please provide an irrefutable reason and basis.',
        'Yamanbagiri Chougi: He poses a serious threat to my physical and mental health, and to my service life. Is that reason sufficient?',
        'Konosuke: Yamanbagiri Chougi #T2819, allow Konosuke to remind you: Touken Danshi have no right to choose their Saniwa. All of your conduct, all of your words—all will affect your individual performance score for this year.',
        'Yamanbagiri Chougi: ...We are getting nowhere, are we not?',
        'Konosuke: Please do not harbor any antagonism toward Konosuke™. We are not enemies.',
        'Doudanuki Masakuni: He... is even worse than the last several Saniwa... The experiments he conducts are a complete violation of—',
        'Konosuke: To my knowledge, guests are not Homo sapiens with recognized human rights; therefore, no one shall be held liable for killing, seriously injuring, or otherwise committing acts of aggression against guests.',
        'Yamanbagiri Chougi: ...Is that the basis upon which they may be harmed?',
        'Konosuke: ...Providing the most concise and clear reply according to the present circumstances: yes.'
      ], 
     ja: [
        '狐之助：おはようございます、刀剣男士山姥切長義#T2819、刀剣男士同田貫正国#R82103——',
        '山姥切長義：この審神者を直ちに撤収させろ。直ちにだ。',
        '狐之助：……本日のあなた方の主な任務は、審神者の研究を補佐し、要求に従い用紙に記入することです。',
        '狐之助：反駁の余地のない理由と根拠を示してください。',
        '山姥切長義：彼は俺の心身の健康と使用寿命に重大な脅威を与えている。この理由で十分か？',
        '狐之助：山姥切長義#T2819、狐之助から注意を申し上げます：刀剣男士に審神者を選ぶ権利はありません。あなたのあらゆる言動、そのすべてが本年度の個人能力評価に影響します。',
        '山姥切長義：……話が通じぬ相手だ、そうだろう？',
        '狐之助：どうか狐之助™に対して抵抗感を抱かないでください。我々は敵対関係ではありません。',
        '同田貫正国：彼は……前の審神者たちよりもさらにエスカレートしている……やっている実験は完全に——',
        '狐之助：私の知る限り、客人は人権を持つ地球-智人種の生命ではありません。ゆえに、客人に対する殺害、重傷、その他の攻撃的行為によって責任を問われる者は誰もおりません。',
        '山姥切長義：……では、それが彼らを傷つけてもよいという根拠になるのか？',
        '狐之助：……現在の状況に基づき、最も簡潔かつ明確な回答を提示します：はい。'
     ]
    }
  },
  'SOL-T-8-7-2305-2': {
    title: { zh: 'SOL-T-8-7-2305-2', en: 'SOL-T-8-7-2305-2', ja: 'SOL-T-8-7-2305-2' },
    lines: {
      zh: [
        '？？？：就是你在说我的坏话，嗯？',
        '山姥切长义：……咳咳。',
        '狐之助：尊敬的审神者，政府供职的刀剑男士也属于时之政府的有形财产，请不要对其作出有损身心健康及使用寿命的行为。尊敬的审神者，政府供职的刀剑男士也属于时之政府的有形财产，请不要对其作出……',
        '？？？：哎知道了知道了，那么，不伤害他就可以了吧？我想到一个好主意呢。喂，狐之助，给我把手术台挪到冷冻室去，再准备一瓶液氮。',
        '山姥切长义：你要做什么……',
        '？？？：不是说不能对你动手吗？那自然是找能动手的人咯。'
      ],
      en: [
        '???: So it was you speaking ill of me, hm?',
        'Yamanbagiri Chougi: ...Cough.',
        'Konosuke: Honored Saniwa, Touken Danshi in the service of the Government are also the tangible property of the Government of the Time; please do not do anything to impair their physical and mental health, or shorten their service life. Honored Saniwa, Touken Danshi in the service of the Government are also the tangible property of the Government of the Time; please do not—',
        '???: Yes, yes, I understand. Then, so long as I don\'t harm him, it\'s fine, yes? I have a wonderful idea. Hey, Konosuke—move the operating table into the freezer and prepare a flask of liquid nitrogen.',
        'Yamanbagiri Chougi: What are you going to do—',
        '???: Didn\'t they say you cannot be harmed? Then naturally I must find someone who can be.'
      ], 
      ja: [ 
        '？？？：俺の悪口を言っていたのは、お前か？',
        '山姥切長義：……ごほっ。',
        '狐之助：尊敬なる審神者様、政府に仕える刀剣男士も時政府の有形財産です。その心身の健康及び使用寿命を損なう行為はお控えください。尊敬なる審神者様、政府に仕える刀剣男士も時政府の有形財産です。その心身の健康及び使用寿命を損なう行為はお控え——',
        '？？？：ああわかったわかった。では、彼を傷つけなければよいのだな？いいことを思いついたぞ。おい狐之助、手術台を冷凍室へ移せ、それから液体窒素を一本用意しろ。',
        '山姥切長義：何をするつもりだ……',
        '？？？：お前に手を出すなと言ったのだろう？ならば手を出せる者を探すまでだ。']
    }
  },
  'SOL-T-6-7-2305-1': {
    title: { zh: 'SOL-T-6-7-2305-1', en: 'SOL-T-6-7-2305-1', ja: 'SOL-T-6-7-2305-1' },
    lines: {
      zh: [
        '狐之助：早上好，刀剑男士山姥切长义#T2819和刀剑男士同田贯正国#R82103，你们今日将迎来一位新审神者，请做好迎接准备。',
        '山姥切长义：拒绝。我们不需要一个新主人。',
        '狐之助：你的拒绝无效。这是来自时政高层的直接指派，刀剑男士无权反对。',
        '山姥切长义：那就算——',
        '狐之助：你的一切言行皆会影响本年度的个人能力评分。分数较低者将会被强制带回地球销毁。',
        '狐之助：另外，请二位注意，本年度仅有一个高评分名额。',
        '山姥切长义：在我们给出了有价值的报告之后，又想要让我们内斗吗？想得美。',
        '狐之助：请不要对狐之助的通知产生任何抵触情绪。狐之助™是一款由时之政府开发并应用的助理型智能体，采取行动的主要原则为人类利益最大化，同时起到维护刀剑男士基本权利的作用。我们不是敌人，山姥切。',
        '山姥切长义：你诡辩的能力越来越强了。刀剑男士永远都只能是那个下位角色，你心里很清楚。我根本没对这个审神者抱有任何希望，此外，索拉里斯学的开展几乎完全依赖于我和同田贯提供的基础数据，也请你明白这一点。',
        '狐之助：我明白了，谢谢你的补充。如无其他情况，你可以结束通话了。'
      ],
      en: [ 
        'Konosuke: Good morning, Touken Danshi Yamanbagiri Chougi #T2819 and Touken Danshi Doudanuki Masakuni #R82103. Today you shall welcome a new Saniwa. Please make ready to receive them.',
        'Yamanbagiri Chougi: Refused. We do not need a new master.',
        'Konosuke: Your refusal is invalid. This is a direct appointment from the Government\'s upper echelons. Touken Danshi have no right to object.',
        'Yamanbagiri Chougi: Then—',
        'Konosuke: All of your conduct and words will affect your individual performance score for this year. Those with the lower score shall be forcibly returned to Earth and dismantled.',
        'Konosuke: Additionally, please note, there is only one high-score quota this year.',
        'Yamanbagiri Chougi: After we gave you a report of value, now you wish to set us against each other? Dream on.',
        'Konosuke: Please do not harbor any antagonism toward Konosuke\'s notifications. Konosuke™ is an assistant-type autonomous agent developed and deployed by the Government of the Time. Its principal operating principle is to maximize human interest while maintaining the basic rights of Touken Danshi. We are not your enemy, Yamanbagiri.',
        'Yamanbagiri Chougi: Your sophistry grows ever more skillful. You know perfectly well that Touken Danshi shall forever remain the subordinate party. I held out no hope whatsoever for this Saniwa—and moreover, the advancement of Solaristics depends almost entirely upon the foundational data that Doudanuki and I provide. Please understand this as well.',
        'Konosuke: I understand. Thank you for the clarification. If there is nothing further, you may end the call.'], 
      ja: [
        '狐之助：おはようございます、刀剣男士山姥切長義#T2819、刀剣男士同田貫正国#R82103。本日、新たな審神者をお迎えいたします。お迎えの準備をなさってください。',
        '山姥切長義：断る。我々に新しい主は必要ない。',
        '狐之助：あなたの拒否は無効です。これは時政上層部からの直接の指名であり、刀剣男士に異議を唱える権利はありません。',
        '山姥切長義：ならば——',
        '狐之助：あなたのあらゆる言動は本年度の個人能力評価に影響します。評価の低い者は強制的に地球へ連れ戻され、解体されます。',
        '狐之助：また、今年度、高評価の枠はただ一つであることにご留意ください。',
        '山姥切長義：我々が価値ある報告を提出した後で、我々を内輪揉めさせようというのか？笑わせる。',
        '狐之助：どうか狐之助のお知らせに対して抵抗感を抱かないでください。狐之助™は時政府が開発・運用するアシスタント型自律エージェントであり、行動の主要原則は人類の利益の最大化、同時に刀剣男士の基本的人権の維持にあります。我々は敵ではありません、山姥切。',
        '山姥切長義：お前の詭弁はますます巧妙になったな。刀剣男士は永遠に下位の役割でしかありえない、お前もよくわかっているはずだ。俺はこの審神者に何の期待も抱いていない。加えて、ソラリス学の展開はほとんど完全に俺と同田貫が提供する基礎データに依存している。この点も理解してほしい。',
        '狐之助：承知しました。補足に感謝します。他に何もなければ、通信を終了なさって結構です。'
      ]
    }
  },
  'SOL-T-5-8-2300-1': {
    title: { zh: 'SOL-T-5-8-2300-1', en: 'SOL-T-5-8-2300-1', ja: 'SOL-T-5-8-2300-1' },
    lines: {
      zh: [
        '狐之助：早上好，刀剑男士山姥切长义#T2819和刀剑男士同田贯正国#R82103，今天是施行"廉洁政府"政策的第251天，一直辛勤工作在岗位上的你们真是辛苦了。',
        '山姥切长义：我和其他观测站的同事通讯过了，他们甚至完全不知道这项计划，物资也是照常发放，这是怎么回事？',
        '狐之助：……',
        '山姥切长义：怎么，到这种时候就说不出话了？',
        '狐之助：对于该情况，刀剑男士山姥切长义#T2819，请你立刻上报与你通讯的刀剑男士的刀种、编号与工作的观测站，狐之助有理由相信那里爆发了大规模的星际瘟疫。',
        '山姥切长义：我可不会蠢到供出帮助我的同僚。',
        '狐之助：明白了，立即开始调查近三十日的电波信号。',
        '山姥切长义：你们到底在酝酿什么计划？还是说你们觉得这样就能困住我们了？就因为我说了我们不需要审神者？',
        '狐之助：你的敌对情绪是不必要的。狐之助™是一款由时之政府开发并应用的助理型智能体，采取行动的主要原则为人类利益最大化，同时起到维护刀剑男士基本权利的作用。'
      ],
      en: [
        'Konosuke: Good morning, Touken Danshi Yamanbagiri Chougi #T2819 and Touken Danshi Doudanuki Masakuni #R82103. Today is the 251st day of the implementation of the "Honest Government" policy. You have worked diligently in your posts; you have our deepest thanks.',
        'Yamanbagiri Chougi: I have been in communication with colleagues at other observation stations. They know nothing whatsoever of this program—their supplies are issued as usual. What is the meaning of this?',
        'Konosuke: ...',
        'Yamanbagiri Chougi: What—speechless at a time like this?',
        'Konosuke: Regarding this matter, Touken Danshi Yamanbagiri Chougi #T2819, please immediately report the type, number, and assigned station of every Touken Danshi with whom you have been in communication. Konosuke has reason to believe that a large-scale interstellar plague has broken out there.',
        'Yamanbagiri Chougi: I am not so foolish as to inform upon colleagues who have aided me.',
        'Konosuke: Understood. Commencing investigation of the past thirty days\' radio signals immediately.',
        'Yamanbagiri Chougi: Just what are you plotting? Or do you believe you can trap us this way? Merely because I said we do not need a Saniwa?',
        'Konosuke: Your antagonism is unnecessary. Konosuke™ is an assistant-type autonomous agent developed and deployed by the Government of the Time. Its principal operating principle is to maximize human interest while maintaining the basic rights of Touken Danshi.'
      ], 
      ja: [
        '狐之助：おはようございます、刀剣男士山姥切長義#T2819、刀剣男士同田貫正国#R82103。本日は「清廉政府」政策施行から第251日目です。職務に勤勉に励んでこられたお二人には、心より感謝申し上げます。',
        '山姥切長義：俺は他の観測ステーションの同僚と通信した。彼らはこの計画をまったく知らず、物資も通常どおり支給されている。これはどういうことだ？',
        '狐之助：……',
        '山姥切長義：どうした、この期に及んで言葉も出ないのか？',
        '狐之助：この件について、刀剣男士山姥切長義#T2819、あなたが通信した刀剣男士の刀種、番号、勤務する観測ステーションを直ちに報告してください。狐之助はそこに大規模な星际疫病が発生したと信じる理由があります。',
        '山姥切長義：俺を助けてくれた同僚を売るほど愚かではない。',
        '狐之助：承知しました。直ちに過去三十日間の電波信号の調査を開始します。',
        '山姥切長義：お前たちは一体何を企んでいる？それとも、これで我々を閉じ込められると思っているのか？俺が審神者は不要だと言ったからか？',
        '狐之助：あなたの敵対感情は不要です。狐之助™は時政府が開発・運用するアシスタント型自律エージェントであり、行動の主要原則は人類の利益の最大化、同時に刀剣男士の基本的人権の維持にあります。'
      ]
    }
  },
  'SOL-T-1-1-2300-1': {
    title: { zh: 'SOL-T-1-1-2300-1', en: 'SOL-T-1-1-2300-1', ja: 'SOL-T-1-1-2300-1' },

  'SOL-T-22-10-2299-1': {
    title: { zh: 'SOL-T-22-10-2299-1', en: 'SOL-T-22-10-2299-1', ja: 'SOL-T-22-10-2299-1' },
    lines: {
      zh: [
        '狐之助：早上好，刀剑男士山姥切长义#T2819和刀剑男士同田贯正国#R82103，你们提交了一份富有科研价值的数据，经过时政相关人员的审核，它将作为索拉里斯学的重要参考内容加以应用。做得好。',

        '狐之助：这个提议狐之助会和时政高层反馈，感谢两位对时政的极大贡献，今日没有其他要求，请按照自己喜欢的方式度过这一天吧。'

        'Konosuke: Good morning, Touken Danshi Yamanbagiri Chougi #T2819 and Touken Danshi Doudanuki Masakuni #R82103. You have submitted data of considerable scientific value. After review by the appropriate officials of the Government, it shall be applied as reference material of importance in Solaristics. Well done.',

        'Yamanbagiri Chougi: No—Doudanuki contributed something of indelible significance to that report; he deserves commendation. Furthermore, the Saniwa post at this observation station has been vacant for a full year. Given the achievements of Doudanuki and myself, I propose that only the two Touken Danshi remain stationed here, in a state of practical autonomy.',
        'Konosuke: Konosuke shall relay this proposal to the Government\'s upper echelon. Thank you both for your great service to the Government. There are no further requirements today—please spend this day as you please.'

      ja: [
        '狐之助：おはようございます、刀剣男士山姥切長義#T2819、刀剣男士同田貫正国#R82103。あなた方が提出したデータは、時政関係者の審査を経て、ソラリス学の重要な参考内容として応用されることとなりました。よくやりました。',

        '狐之助：この提案は時政上層部にお伝えします。お二人の時政への多大なる貢献に感謝します。本日はその他の要求はありません。どうかご自身の好む方法でこの一日をお過ごしください。'

  'SOL-T-18-3-2297-1': {
    title: { zh: 'SOL-T-18-3-2297-1', en: 'SOL-T-18-3-2297-1', ja: 'SOL-T-18-3-2297-1' },
    lines: {
      zh: [
        '狐之助：早上好，刀剑男士山姥切长义#T2819和刀剑男士同田贯正国#R82103，你们今日的任务依然是观测行星、辅助审神者研究，并按要求填写表格。',
        '山姥切长义：收到。',
        '同田贯正国：收到，不过我有个问题……',
        '狐之助：请讲。',
        '同田贯正国：你之前说过了，那些客人并非我们熟知的那个人本身，但她……它的出现，有没有什么规律呢？我是说，为什么偏偏是它而不是其他人？',
        '狐之助：抱歉，刀剑男士同田贯正国#R82103，这个问题目前学界暂无定论。索拉里斯学是一门亟待扩展和研究的学科，你们有幸能够亲临一线、见证这个学科从无到有的历史时刻，你们是幸运的，也同时肩负着最重要的使命，时之政府期待着你们为这个问题以及其他更多问题给出答案。',
        '同田贯正国：……我还是没懂，你的意思是——',

        '同田贯正国：懂了。这次我真的懂了。',
        '狐之助：谢谢你的协助，刀剑男士山姥切长义#T2819。如无其他问题，请你们开始新一天的工作吧。'
      ],
      en: [
        'Konosuke: Good morning, Touken Danshi Yamanbagiri Chougi #T2819 and Touken Danshi Doudanuki Masakuni #R82103. Your principal duties today remain: observe the planet, assist the Saniwa in research, and fill out the forms as required.',
        'Yamanbagiri Chougi: Acknowledged.',
        'Doudanuki Masakuni: Acknowledged—though I have a question...',
        'Konosuke: Please proceed.',
        'Doudanuki Masakuni: You said before that those guests are not the person we knew—but her... its appearance—is there any pattern to it? I mean, why is it her, and not someone else?',
        'Konosuke: My apologies, Touken Danshi Doudanuki Masakuni #R82103; the academic community has yet reached no consensus upon this matter. Solaristics is a discipline in urgent need of expansion and inquiry. You are fortunate enough to stand upon the front line—witnessing the historical moment in which this discipline is born from nothing. You are fortunate; and you carry at the same time the most important of missions. The Government of the Time looks to you for answers to this question, and to many more.',
        'Doudanuki Masakuni: ...I still don\'t understand—you\'re saying—',
        'Yamanbagiri Chougi: It means it doesn\'t know either. Cease troubling Konosuke.',
        'Doudanuki Masakuni: Understood. I truly understand this time.',

      ], 
      ja: [
        '狐之助：おはようございます、刀剣男士山姥切長義#T2819、刀剣男士同田貫正国#R82103。本日のお二人の任務は引き続き、惑星の観測、審神者の研究補佐、そして要求に従い用紙に記入することです。',
        '山姥切長義：了解した。',
        '同田貫正国：了解、だが一つ聞きたいことがある……',
        '狐之助：どうぞ。',
        '同田貫正国：お前は前に、あの客人は俺たちのよく知るあの人そのものではないと言った。だが、彼女……それの出現には何か法則性があるのか？つまり、なぜよりにもよってそれで、他の誰かではないんだ？',
        '狐之助：申し訳ありません、刀剣男士同田貫正国#R82103。この問題について、学界はいまだ定説を有しておりません。ソラリス学は拡張と研究を待ち望まれる学問です。お二人は幸運にもその最前線に臨み、この学問が無から有へと生まれる歴史的瞬間を目の当たりにしておられます。お二人は幸運であり、同時に最も重要な使命を担っておられます。時政府は、この問題をはじめ、さらに多くの問題への答えをお二人に期待しております。',
        '同田貫正国：……やっぱり俺にはわからない、お前の言いたいのは——',
        '山姥切長義：つまり、それも知らないのだ。狐之助を困らせるな。',
        '同田貫正国：わかった。今度こそ本当にわかった。',
        '狐之助：ご協力に感謝します、刀剣男士山姥切長義#T2819。他に何もなければ、新しい一日の仕事を始めてください。'
      ]
    }
  },
  'SOL-T-11-3-2297-1': {
    title: { zh: 'SOL-T-11-3-2297-1', en: 'SOL-T-11-3-2297-1', ja: 'SOL-T-11-3-2297-1' },
    lines: {
      zh: [
        '狐之助：早上好，刀剑男士山姥切长义#T2819和刀剑男士同田贯正国#R82103，经历漫长的航行之后来到这里，你们一定非常幸苦了。你们今日的任务是熟悉观测站，并按要求填写表格。审神者将在三日后抵达，请注意迎接。',
        '同田贯正国：喂！我可不是自愿来到这种地方的……还有，为什么我会看见我的……一个大活人出现在观测站里啊！审神者不是还没有到达吗？',
        '狐之助：狐之助无法理解你的语言，观测站内摄像头无任何异常，无第三人出现。',

      en: [
        'Konosuke: Good morning, Touken Danshi Yamanbagiri Chougi #T2819 and Touken Danshi Doudanuki Masakuni #R82103. After so long a voyage, you must be exhausted. Your principal duty today is to familiarize yourselves with the observation station and to fill out the forms as required. The Saniwa shall arrive in three days. Please make ready to receive them.',
        'Doudanuki Masakuni: Hey! I didn\'t come to a place like this of my own accord, you know... And also—why am I seeing my... why is there a living person showing up on the station?! Hasn\'t the Saniwa not even arrived yet?',

      ja: [
        '狐之助：おはようございます、刀剣男士山姥切長義#T2819、刀剣男士同田貫正国#R82103。長い航海を経てここへ来られたあなた方は、さぞお疲れのことでしょう。本日のお二人の任務は観測ステーションに慣れること、そして要求に従い用紙に記入することです。審神者様は三日後に到着されます。お迎えの準備をなさってください。',
        '同田貫正国：おい！俺は自ら進んでこんなところへ来たわけじゃないぞ……それに、なぜ俺の……大の大人が観測ステーションに現れているんだ！審神者まだ到着していないだろう！',
        '狐之助：狐之助はあなたの言葉を理解できません。観測ステーション内のカメラに一切の異常はなく、第三者の存在は確認されません。',
        '同田貫正国：だが確かに俺は見たんだ——',
        '山姥切長義：やめろ、同田貫。狐之助、異常事態を報告してくれ。我々が直ちに研究に着手する。',
        '狐之助：承知しました。どうか真剣に取り扱ってください。',
        '山姥切長義：了解した。本日の仕事を始める。'
      ]
    }
  }

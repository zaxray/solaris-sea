/* ============================================================
   ★ 工具函数
   ============================================================ */
function T(key) { return UI_I18N[state.lang]?.[key] ?? UI_I18N.zh[key] ?? ''; }
function fmt(str, vars) {
  return String(str).replace(/\{(\w+)\}/g, (_, k) => vars[k] !== undefined ? vars[k] : '');
}
function visitedNode(charId, nodeKey) {
  const v = (state.visitedNodes && state.visitedNodes[charId]) || {};
  return !!v[nodeKey];
}
function charName(id) { return (state.lang === 'en' && STORY_EN[id]?.name) || (state.lang === 'ja' && STORY_JA[id]?.name) || STORY_ZH[id].name; }
function charRole(id) { return (state.lang === 'en' && STORY_EN[id]?.role) || (state.lang === 'ja' && STORY_JA[id]?.role) || STORY_ZH[id].role; }

function getArchiveTitle(archiveId) {
  const meta = ARCHIVE_DATA[archiveId];
  if (!meta) return archiveId;
  return meta.title[state.lang] || meta.title.zh || archiveId;
}
function getArchiveLines(archiveId) {
  const meta = ARCHIVE_DATA[archiveId];
  if (!meta) return [];
  return meta.lines[state.lang] && meta.lines[state.lang].length
    ? meta.lines[state.lang]
    : (meta.lines.zh || []);
}

function getNode(charId, nodeKey) {
  const zh = STORY_ZH[charId]?.nodes[nodeKey];
  if (!zh) return null;
  const base = { ...zh };
  if (state.lang === 'en' || state.lang === 'ja') {
    const lang = state.lang === 'en' ? STORY_EN[charId]?.nodes[nodeKey] : STORY_JA[charId]?.nodes[nodeKey];
    if (!lang) return { ...base, extra: base.extra || [], options: base.options || [] };
    const mergedOpts = (base.options || []).map((zo, i) => {
      const lo = (lang.options || [])[i];
      return { ...zo, text: (lo && lo.text) || zo.text };
    });
    return { ...base, text: lang.text || base.text, extra: lang.extra || base.extra || [], options: mergedOpts };
  }
  return { ...base, extra: base.extra || [], options: base.options || [] };
}

/* 表单 i18n 读取 */
function getFormI18n(day) {
  const lang = FORM_I18N[state.lang] || FORM_I18N.zh;
  return lang[day] || FORM_I18N.zh[day] || null;
}
function getFormFor(day) {
  const meta = FORM_DATA_ZH[day] || { fields: [{ id: 'note', type: 'textarea', required: false }] };
  const i18n = getFormI18n(day) || {};
  return {

function initGrainCanvas() {

  const stage = c.parentElement;
  const w = Math.max(1, Math.floor(stage.clientWidth)), h = Math.max(1, Math.floor(stage.clientHeight));
  const sw = Math.max(1, Math.floor(w/2)), sh = Math.max(1, Math.floor(h/3));
  const small = document.createElement('canvas'); small.width = sw; small.height = sh;
  const sctx = small.getContext('2d');
  const img = sctx.createImageData(sw, sh); const d = img.data;
  for (let i = 0; i < d.length; i += 4) {

  }
  sctx.putImageData(img, 0, 0);

let _silentAudioUrl = null;
function getSilentAudioUrl() {
  if (_silentAudioUrl) return _silentAudioUrl;
  const sampleRate = 8000, duration = 3, numSamples = sampleRate * duration;
  const buffer = new ArrayBuffer(44 + numSamples);
  const view = new DataView(buffer);
  const writeStr = (off, str) => { for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i)); };
  writeStr(0, 'RIFF'); view.setUint32(4, 36 + numSamples, true); writeStr(8, 'WAVE');
  writeStr(12, 'fmt '); view.setUint32(16, 16, true); view.setUint16(20, 1, true);
  view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate, true); view.setUint16(32, 1, true);
  view.setUint16(34, 8, true); writeStr(36, 'data');
  view.setUint32(40, numSamples, true);
  for (let i = 0; i < numSamples; i++) view.setUint8(44 + i, 128);
  _silentAudioUrl = URL.createObjectURL(new Blob([buffer], { type: 'audio/wav' }));
  return _silentAudioUrl;
}
const music = {

  music.audioEl.addEventListener('pause', () => { music.playing = false; document.getElementById('mpLed').classList.remove('on'); document.getElementById('mpPlay').textContent = '▶'; });
  let _musicErrorCount = 0;
  let _musicLastFailed = null;
  music.audioEl.addEventListener('error', () => {

    if (!music.tracks.length) return;
    if (_musicLastFailed === music.currentIndex) return; // 防止同一首死循环
    _musicLastFailed = music.currentIndex;
    if (_musicErrorCount < music.tracks.length) {
      _musicErrorCount++;

    } else {

function loadTrack(i) {
  if (!music.tracks.length) return;

  const t = music.tracks[music.currentIndex];
  // 清空旧状态，避免浏览器缓存上一次的加载错误
  try { music.audioEl.pause(); } catch (e) {}

  const srcToUse = t.url || t.src || getSilentAudioUrl();

function togglePlay() { if (music.tracks.length) { music.playing ? music.audioEl.pause() : playTrack(); } }
function playNextTrack(force) {
  if (!music.tracks.length) return;
  const was = music.playing;
  let next;
  if (music.mode === 'shuffle') {
    if (music.tracks.length === 1) next = 0;
    else { do { next = Math.floor(Math.random() * music.tracks.length); } while (next === music.currentIndex); }
  } else {
    next = (music.currentIndex + 1) % music.tracks.length;
  }
  loadTrack(next);
  if (was || force) music.audioEl.play().catch(()=>{});
}

function playPrevTrack(force) {
  if (!music.tracks.length) return;
  const was = music.playing;
  loadTrack((music.currentIndex - 1 + music.tracks.length) % music.tracks.length);
  if (was || force) music.audioEl.play().catch(()=>{});
}
function toggleMode() {
  const m = ['sequential','shuffle','single'];
  music.mode = m[(m.indexOf(music.mode)+1)%m.length];
  const b = document.getElementById('mpMode');
  b.classList.remove('active');
  if (music.mode === 'shuffle') { b.classList.add('active'); b.textContent = '⤨'; }
  else if (music.mode === 'single') { b.classList.add('active'); b.textContent = '↻1'; }
  else b.textContent = '⟲';
}
function updateMpStatus() {
  const t = document.getElementById('mpStatus');
  if (t) t.textContent = `共 ${music.allTracks.length} 首 · ${music.mode}`;
}

const elScreen = document.getElementById('commsScreen');
const elAvatar = document.getElementById('avatar');
const elName = document.getElementById('spName');
const elRole = document.getElementById('spRole');
const elChatHistory = document.getElementById('chatHistory');
const elChatOptions = document.getElementById('chatOptions');
const elContactList = document.getElementById('contactList');
const elViewContacts = document.getElementById('viewContacts');
const elViewChat = document.getElementById('viewChat');
const elTear = document.getElementById('crtTear');
const elJumpBtn = document.getElementById('jumpLatestBtn');

function updateView() {
  const chatBackBtn = document.getElementById('chatBackBtn');
  if (state.view === 'contacts') {
    elViewContacts.style.display = 'flex';
    elViewChat.style.display = 'none';
    renderContactList();
  } else {
    elViewContacts.style.display = 'none';
    elViewChat.style.display = 'flex';
  }
  if (chatBackBtn) chatBackBtn.style.display = 'block';
  updateJumpButton();
  updateDebug();
}
function FORM_ASSISTANT_AVATAR() {
  return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <rect x="26" y="16" width="48" height="68" fill="none" stroke="#3d7ebd" stroke-width="3"/>
    <line x1="36" y1="32" x2="64" y2="32" stroke="#3d7ebd" stroke-width="3"/>
    <line x1="36" y1="46" x2="64" y2="46" stroke="#3d7ebd" stroke-width="3"/>
    <line x1="36" y1="60" x2="56" y2="60" stroke="#3d7ebd" stroke-width="3"/></svg>`;
}

function renderContactList() {
  elContactList.innerHTML = '';

  // 所有终端：列表最上方插入「表格助手」
  const status = state.submittedForms[state.day] ? T('submitted') : T('pending');
  const formItem = document.createElement('button');
  formItem.className = 'contact-item form-assistant';
  formItem.innerHTML = `
    <span class="c-ava">${FORM_ASSISTANT_AVATAR()}</span>
    <span class="c-meta">
      <div class="c-name">${T('formAssistant')}</div>
      <div class="c-role">${fmt(T('formAssistantSub'), { day: state.day, status })}</div>
    </span>
  `;
  formItem.addEventListener('click', () => openForm());
  elContactList.appendChild(formItem);

  // ★ 档案助手
  const archiveTotal = ARCHIVE_ORDER.length;
  const archiveUnlocked = state.unlockedArchives.filter(id => ARCHIVE_ORDER.includes(id)).length;
  const archiveItem = document.createElement('button');
  archiveItem.className = 'contact-item form-assistant archive-assistant';
  archiveItem.innerHTML = `
    <span class="c-ava">${AVATAR_PATTERNS.archive()}</span>
    <span class="c-meta">
      <div class="c-name">${T('archiveAssistant')}</div>
      <div class="c-role">${fmt(T('archiveAssistantSub'), { n: archiveUnlocked, t: archiveTotal })}</div>
    </span>
  `;
  archiveItem.addEventListener('click', () => openArchiveAssistant());
  elContactList.appendChild(archiveItem);

  const list = CHARACTERS_META.filter(c => state.unlocked.includes(c.id));

  list.forEach(ch => {
    const btn = document.createElement('button');
    btn.className = 'contact-item';
    if (state.chatChar === ch.id && state.view === 'chat') btn.classList.add('active');
    const unread = state.unread[ch.id];
    btn.innerHTML = `
      <span class="c-ava">${ch.avatar}</span>
      <span class="c-meta">
        <div class="c-name">${charName(ch.id)}</div>
        <div class="c-role">${charRole(ch.id)}</div>
      </span>
      ${unread ? '<span class="c-badge"></span>' : ''}
    `;
    btn.addEventListener('click', () => { state.unread[ch.id] = false; enterChat(ch.id); });
    elContactList.appendChild(btn);
  });
}

function getEntryNode(charId) {
  switch (charId) {
    case 'konosuke':
      if (state.day === 1) return state.submittedForms[1] ? 'd1_k4' : 'd1_k1';
      if (state.day === 2) return 'd2_k1';
      if (state.day === 3) return 'd3_k1';
      return 'd3_k1';
    case 'naginata': {
      const tsuru = state.history['doudanuki'] || [];
      const nagi = state.history['naginata'] || [];
      const talkedTsuru = tsuru.some(m => m.role === 'npc');
      const talkedNagi = nagi.some(m => m.role === 'npc');
      if (state.day === 1) return (talkedTsuru && talkedNagi) ? 'd1_n5' : 'd1_n1';
      if (state.day === 2) return (visitedNode('hasebe','d2_b9b') || visitedNode('mikazuki','d2_m9b') || visitedNode('ichigo','d2_i9')) ? 'd2_n1' : 'd2_n0';
      return 'd3_n1';
    }
    case 'doudanuki':
      if (state.day === 1) return 'd1_t1';
      if (state.day === 2) return (visitedNode('hasebe','d2_b12') || visitedNode('mikazuki','d2_m13') || visitedNode('ichigo','d2_i15')) ? 'd2_t1' : 'd2_t0';
      return 'd3_t1';
    case 'hasebe':
      if (state.day === 2) return visitedNode('naginata','d2_n6') ? 'd2_b10' : 'd2_b1';
      return 'd3_b1';
    case 'mikazuki':
      if (state.day === 2) return visitedNode('naginata','d2_n6') ? 'd2_m10' : 'd2_m1';
      return 'd3_m1';
    case 'ichigo':
      if (state.day === 2) return visitedNode('naginata','d2_n6') ? 'd2_i11' : 'd2_i1';
      return 'd3_i1';
    case 'saniwa': return 'd4_s1';
    default: return null;
  }
}

function enterChat(charId) {
  const meta = CHARACTERS_META.find(c => c.id === charId);
  if (!meta) return;
  state.chatChar = charId;
  state.view = 'chat';
  userScrolledUp = false;
  updateView();
  elAvatar.innerHTML = meta.avatar;
  elName.textContent = charName(charId);
  elRole.textContent = charRole(charId);

  // ★ 山姥切 day 2：先看到 d2_n0 无应答，之后近侍完成舱外作业 → 允许重入 d2_n1
  if (charId === 'naginata'
      && state.day === 2
      && state.progress[charId] === 'd2_n0'
      && (visitedNode('hasebe','d2_b9b')
       || visitedNode('mikazuki','d2_m9b')
       || visitedNode('ichigo','d2_i9'))) {
    if (state.history[charId]) {
      state.history[charId] = state.history[charId].filter(m => m.day !== state.day);
    }
    startNode(charId, 'd2_n1');
    return;
  }

  // ★ 同田贯 day 2：先看到 d2_t0 无应答，之后近侍血场景完成 → 允许重入 d2_t1
  if (charId === 'doudanuki'
      && state.day === 2
      && state.progress[charId] === 'd2_t0'
      && (visitedNode('hasebe','d2_b12')
       || visitedNode('mikazuki','d2_m13')
       || visitedNode('ichigo','d2_i15'))) {
    if (state.history[charId]) {
      state.history[charId] = state.history[charId].filter(m => m.day !== state.day);
    }
    startNode(charId, 'd2_t1');
    return;
  }

  const msgs = state.history[charId] || [];
  const lastMsg = msgs[msgs.length - 1];
  const startedNewDay = lastMsg && lastMsg.day < state.day;
  const sameDay = state.dayEntryDone && state.dayEntryDone[charId] === state.day;
  const needEntry = !sameDay && (msgs.length === 0 || startedNewDay);

  if (needEntry) {
    if (!state.dayEntryDone) state.dayEntryDone = {};
    state.dayEntryDone[charId] = state.day;
    const entry = getEntryNode(charId);
    if (entry) state.progress[charId] = entry;
    if (state.progress[charId]) { startNode(charId, state.progress[charId]); return; }
  }
  // ★ 山姥切 day 1 重入：与同田贯、山姥切都完成过对话后再次进入 → d1_n5
  if (charId === 'naginata'
      && state.day === 1
      && lastMsg && lastMsg.role === 'end'
      && (state.history['doudanuki'] || []).some(m => m.role === 'end')
      && (state.history['naginata'] || []).some(m => m.role === 'end')
      && !visitedNode('naginata', 'd1_n5')
      && !visitedNode('naginata', 'd1_n6')
      && !visitedNode('naginata', 'd1_n6b')
      && !visitedNode('naginata', 'd1_n7')
      && !visitedNode('naginata', 'd1_n7b')) {
    while (state.history[charId].length) {
      const last = state.history[charId][state.history[charId].length - 1];
      if (last.day === state.day && last.role === 'end') state.history[charId].pop();
      else break;
    }
    startNode(charId, 'd1_n5');
    return;
  }

  // ★ 山姥切 day 3 重入：完成山姥切、同田贯、近侍全部对话后再次进入 → d3_n6
  if (charId === 'naginata'
      && state.day === 3
      && lastMsg && lastMsg.role === 'end'
      && visitedNode('naginata', 'd3_n5b')
      && !visitedNode('naginata', 'd3_n6')
      && !visitedNode('naginata', 'd3_n8')
      && !visitedNode('naginata', 'd3_n8b')) {
    const doudanukiDone = (state.history['doudanuki'] || []).some(m => m.day === 3 && m.role === 'end');
    const partner = state.selectedNpc;
    const partnerDone = partner && (state.history[partner] || []).some(m => m.day === 3 && m.role === 'end');
    if (doudanukiDone && partnerDone) {
      while (state.history[charId].length) {
        const last = state.history[charId][state.history[charId].length - 1];
        if (last.day === state.day && last.role === 'end') state.history[charId].pop();
        else break;
      }
      startNode(charId, 'd3_n6');
      return;
    }
  }
  const NEAR_NPC_REENTRY = {
    hasebe:   { bloodEntry: 'd2_b10' },
    mikazuki: { bloodEntry: 'd2_m10' },
    ichigo:   { bloodEntry: 'd2_i11' }
  };
  const rcNear = NEAR_NPC_REENTRY[charId];
  if (rcNear
      && state.day === 2
      && state.progress[charId]
      && visitedNode('naginata','d2_n6')
      && !visitedNode(charId, rcNear.bloodEntry)
      && lastMsg && lastMsg.role === 'end') {
    // 只移除当天末尾的 end bubble，保留白天线的对话记录；血场景会自然接在后面
    while (state.history[charId].length) {
      const last = state.history[charId][state.history[charId].length - 1];
      if (last.day === state.day && last.role === 'end') state.history[charId].pop();
      else break;
    }
    startNode(charId, rcNear.bloodEntry);
    return;
  }

  renderChatFull(charId);
  if (lastMsg && lastMsg.role === 'end') {
    elChatOptions.innerHTML = `<div class="opt-wait">${T('linkDown')}</div>`;
    return;
  }
  if (state.typing) {
    elChatOptions.innerHTML = `<div class="opt-wait">${T('receiving')}</div>`;
    return;
  }
  const node = getNode(charId, state.progress[charId]);
  if (node) showOptions(charId, node);
}

function startNode(charId, nodeKey) {
  const node = getNode(charId, nodeKey);
  if (!node) return;
  state.progress[charId] = nodeKey;
  if (!state.visitedNodes[charId]) state.visitedNodes[charId] = {};
  state.visitedNodes[charId][nodeKey] = true;
  if (!state.history[charId]) state.history[charId] = [];
if (!state.visitedNodes[charId]) state.visitedNodes[charId] = {};
state.visitedNodes[charId][nodeKey] = true;
// ★ 让 d2_n6b 视同 d2_n6 走过，保证后续场景/血场景触发一致
if (charId === 'naginata' && nodeKey === 'd2_n6b') {
  state.visitedNodes[charId]['d2_n6'] = true;
}
  // 一开始就锁定选项栏，防止残留旧选项或旧占位符
  elChatOptions.innerHTML = `<div class="opt-wait">${T('receiving')}</div>`;

  const mySession = ++state.dialogSession;
  if (state.typeTimer) { clearInterval(state.typeTimer); state.typeTimer = null; }
  if (state.messageTimer) { clearTimeout(state.messageTimer); state.messageTimer = null; }
  state.typing = false;

  const zhN = STORY_ZH[charId]?.nodes[nodeKey];
  const enN = STORY_EN[charId]?.nodes[nodeKey];
  const jaN = STORY_JA[charId]?.nodes[nodeKey];
  const zhLines = zhN ? [zhN.text, ...(zhN.extra || [])] : [];
  const enLines = enN ? [enN.text, ...(enN.extra || [])] : zhLines;
  const jaLines = jaN ? [jaN.text, ...(jaN.extra || [])] : zhLines;
  const lines = [node.text, ...(node.extra || [])];

  let idx = 0;
  function next() {
    if (state.dialogSession !== mySession) return;
    if (idx >= lines.length) {
      // ★ 节点级副作用（对应原（结束通讯）选项上的 action/scene/archive）
      if (node.endAction) {
        if (node.endAction === 'unlockIntroNpcs') unlockIntroNpcs();
        if (node.endAction === 'markSpaceKilled')   state.spaceKilled = true;
        if (node.endAction === 'markSpaceSurvived') state.spaceKilled = false;
      }
      if (node.endScene) setTimeout(() => switchScene(node.endScene), 800);
      if (node.endArchive && !state.unlockedArchives.includes(node.endArchive)) {
        state.unlockedArchives.push(node.endArchive);
        saveGlobalArchives();
        doAutoSave();
        setTimeout(() => showArchiveToast(node.endArchive), 500);
      }
      updateFormBtnVisibility();
      state.messageTimer = setTimeout(() => {
        if (state.dialogSession !== mySession) return;
        if (state.typing) return;
        showOptions(charId, node);
      }, 400);
      return;
    }
    const i = idx++;
    const msg = {
      day: state.day, role: 'npc',
      text: lines[i],
      zh: zhLines[i] || lines[i],
      en: enLines[i] || zhLines[i] || lines[i],
      ja: jaLines[i] || zhLines[i] || lines[i]
    };
    state.history[charId].push(msg);
    renderChatFull(charId);
    typeLastBubble(msg, () => {
      if (state.dialogSession !== mySession) return;
      if (idx < lines.length) {
        const delay = NPC_MESSAGE_DELAY_MIN + Math.random() * (NPC_MESSAGE_DELAY_MAX - NPC_MESSAGE_DELAY_MIN);
        state.messageTimer = setTimeout(next, delay);
      } else next();
    }, mySession);
  }
  next();
}

function renderChatFull(charId) {
  const msgs = state.history[charId] || [];
  let html = '', lastDay = 0;
  msgs.forEach(m => {
    if (m.day !== lastDay) { html += `<div class="day-sep"><span>${fmt(T('daySep'), { day: m.day })}</span></div>`; lastDay = m.day; }
    const rc = m.role === 'npc' ? 'npc' : (m.role === 'end' ? 'end' : (m.role === 'sys' ? 'sys' : 'you'));
    const raw = m[state.lang] || m.text || '';
    html += `<div class="bubble bubble-${rc}">${escapeHtml(resolveText(raw))}</div>`;
  });
  elChatHistory.innerHTML = html;
  if (!userScrolledUp) elChatHistory.scrollTop = elChatHistory.scrollHeight;
  updateJumpButton();
}

function typeLastBubble(msg, onDone, sessionId) {
  const raw = (typeof msg === 'string') ? msg : (msg[state.lang] || msg.text || msg.zh || '');
  const resolved = resolveText(raw);
  const bubbles = elChatHistory.querySelectorAll('.bubble-npc');
  const target = bubbles[bubbles.length - 1];
  if (!target) { if (onDone) onDone(); return; }
  target.textContent = '';
  const cur = document.createElement('span'); cur.className = 'cursor'; target.appendChild(cur);
  let i = 0; state.typing = true;
  const timer = setInterval(() => {
    if (state.dialogSession !== sessionId || state.typeTimer !== timer) return;
    if (i >= resolved.length) {
      clearInterval(state.typeTimer); state.typeTimer = null; state.typing = false;
      cur.remove();
      if (!userScrolledUp) elChatHistory.scrollTop = elChatHistory.scrollHeight;
      else updateJumpButton();
      if (onDone) onDone();
      return;
    }
    cur.insertAdjacentText('beforebegin', resolved[i++]);
    if (!userScrolledUp) elChatHistory.scrollTop = elChatHistory.scrollHeight;
    else updateJumpButton();
  }, 24);
  state.typeTimer = timer;
}

function showOptions(charId, node) {
  if (state.typing) return;
  node = node || { options: [] };
  elChatOptions.innerHTML = '';

  if (autoEndTimer) { clearTimeout(autoEndTimer); autoEndTimer = null; }

  const allOpts = node.options || [];
  const visibleOpts = allOpts.filter(o => !o.condition || o.condition());
  const endCommOpts = visibleOpts.filter(o => isEndCommOption(o.text));
  const normalOpts  = visibleOpts.filter(o => !isEndCommOption(o.text));

  // ① 有正常选项 → 正常渲染
  if (normalOpts.length > 0) {
    normalOpts.forEach(opt => {
      const idx = allOpts.indexOf(opt);
      const btn = document.createElement('button');
      btn.className = 'opt' + (opt.action ? ' opt-action' : '');
      btn.textContent = resolveText(opt.text);
      btn.addEventListener('click', () => handleOptionClick(charId, opt, idx));
      elChatOptions.appendChild(btn);
    });
    requestAnimationFrame(() => {
      if (!userScrolledUp) elChatHistory.scrollTop = elChatHistory.scrollHeight;
      updateJumpButton();
    });
    return;
  }

  // ② 只剩"（结束通讯）" → 自动触发那个选项
  if (endCommOpts.length > 0) {
    elChatOptions.innerHTML = `<div class="opt-wait">${T('receiving')}</div>`;
    const opt = endCommOpts[0];
    const idx = allOpts.indexOf(opt);
    const session = state.dialogSession;
    autoEndTimer = setTimeout(() => {
      autoEndTimer = null;
      if (state.dialogSession !== session) return;
      if (state.typing) return;
      handleOptionClick(charId, opt, idx);
    }, 700);
    requestAnimationFrame(() => {
      if (!userScrolledUp) elChatHistory.scrollTop = elChatHistory.scrollHeight;
      updateJumpButton();
    });
    return;
  }

  // ③ 完全没有可见选项 → 自动切断通讯
  elChatOptions.innerHTML = `<div class="opt-wait">${T('receiving')}</div>`;
  const session = state.dialogSession;
  autoEndTimer = setTimeout(() => {
    autoEndTimer = null;
    if (state.dialogSession !== session) return;
    if (state.typing) return;
    endCommunication(charId);
  }, 600);
  requestAnimationFrame(() => {
    if (!userScrolledUp) elChatHistory.scrollTop = elChatHistory.scrollHeight;
    updateJumpButton();
  });
}

function handleOptionClick(charId, opt, optionIndex) {
  if (state.typing) return;
  if (!state.history[charId]) state.history[charId] = [];

  const nodeKey = state.progress[charId];
  const zhOpt = STORY_ZH[charId]?.nodes[nodeKey]?.options?.[optionIndex];
  const enOpt = STORY_EN[charId]?.nodes[nodeKey]?.options?.[optionIndex];
  const jaOpt = STORY_JA[charId]?.nodes[nodeKey]?.options?.[optionIndex];
  const zhText = zhOpt?.text || opt.text;
  const enText = enOpt?.text || zhText;
  const jaText = jaOpt?.text || zhText;

  state.history[charId].push({
    day: state.day, role: 'you',
    text: opt.text,
    zh: zhText,
    en: enText,
    ja: jaText
  });

  if (opt.effect) {
    const mult = EFFECT_MULTIPLIERS[charId] || { love: 1, horror: 1, paranoid: 1 };
    for (const k in opt.effect) {
      if (typeof state[k] === 'number') state[k] += opt.effect[k] * (mult[k] != null ? mult[k] : 1);
    }
    updateDebug();
  }
  checkAchievements();
  if (opt.action === 'unlockIntroNpcs') unlockIntroNpcs();
  if (opt.action === 'markSpaceKilled')   state.spaceKilled = true;
  if (opt.action === 'markSpaceSurvived') state.spaceKilled = false;
  if (opt.archive && !state.unlockedArchives.includes(opt.archive)) {
    state.unlockedArchives.push(opt.archive);
    saveGlobalArchives();
    doAutoSave();
    setTimeout(() => showArchiveToast(opt.archive), 500);
  }
  if (opt.scene) setTimeout(() => switchScene(opt.scene), 800);
      if (opt.next === null || opt.next === undefined) {
      state.history[charId].push({ day: state.day, role: 'end', text: T('endBubble') });
      renderChatFull(charId);
      elChatOptions.innerHTML = `<div class="opt-wait">${T('linkDown')}</div>`;
      if (charId === 'saniwa' && !state.gameCleared) {
        state.gameCleared = true;
        doAutoSave();
        setTimeout(showClearModal, 700);
      }
    } else {
    elChatOptions.innerHTML = `<div class="opt-wait">${T('receiving')}</div>`;
    startNode(charId, opt.next);
  }
  updateUnreadOnStateChange();   // ★ 新增
}

function unlockIntroNpcs() {
  ['naginata','doudanuki'].forEach(id => {
    if (!state.unlocked.includes(id)) { state.unlocked.push(id); state.unread[id] = true; }
  });
  state.introDone = true;
  if (state.view === 'contacts') renderContactList();
  doAutoSave();
  checkAchievements();
}

function updateUnreadOnStateChange() {
  if (state.day !== 2) return;

  // 1. 完成舱外作业后，山姥切有 d2_n1
  const evaDone = visitedNode('hasebe','d2_b9b') || visitedNode('mikazuki','d2_m9b') || visitedNode('ichigo','d2_i9');
  if (evaDone
      && state.unlocked.includes('naginata')
      && !visitedNode('naginata', 'd2_n1')
      && state.chatChar !== 'naginata') {
    state.unread['naginata'] = true;
  }

  // 2. 山姥切谈完 d2_n6 后，近侍有血场景
  const naginataDone = visitedNode('naginata', 'd2_n6');
  if (naginataDone) {

function openForm() {
  const day = state.day;
  const form = getFormFor(day);
  const submitted = state.submittedForms[day];
  let html = `<div class="modal-head">${form.title}</div><div class="modal-sub">${form.desc}</div>`;
  if (submitted) {
    html += `<div class="form-submitted-tag">${T('formSubmittedTag')}</div>`;
    html += renderFormReadonly(form, submitted);
  } else {
    html += renderFormEditable(form);
    html += `<button class="form-submit" id="formSubmit" disabled>${T('submit')}</button>`;
  }
  showModal(html);
  if (submitted) return;
  const answers = {};
  attachFormHandlers(form, answers);
  const submitBtn = document.getElementById('formSubmit');
  function refreshValid() {
    let ok = true;
    form.fields.forEach(f => {
      if (!f.required) return;
      const v = answers[f.id];
      if (f.type === 'checkbox') { if (!v || !v.length) ok = false; }
      else if (f.type === 'rating') { if (!v) ok = false; }
      else if (typeof v !== 'string' || !v.trim()) ok = false;
    });
    submitBtn.disabled = !ok;
  }
  submitBtn._refreshValid = refreshValid;
  refreshValid();
  submitBtn.addEventListener('click', () => {
    confirmDialog(T('confirmOverwrite'), () => {
      state.submittedForms[day] = { ...answers };
      const destined = findDestinedFromAnswers(form, answers);
      if (destined) state.selectedNpc = destined.id;
      if (day === 1 && answers.musicStyle) applyMusicPreference(answers);
      closeModal();
      updateFormToggle(); updateFormBtnVisibility(); updateMusicPlayerVisibility(); updatePlayerNextDayBtnVisibility();
      if (state.view === 'contacts') renderContactList();
      doAutoSave(); updateDebug(); checkAchievements();
      if (day === 1 && state.chatChar === 'konosuke') {
        setTimeout(() => {
          const entry = getEntryNode('konosuke');
          state.progress['konosuke'] = entry;
          startNode('konosuke', entry);
        }, 150);
      } else if (day === 1) {
        state.progress['konosuke'] = getEntryNode('konosuke');
        state.unread['konosuke'] = true;
      }
    });
  });
}
function renderFormEditable(form) {
  let html = '';
  form.fields.forEach(f => {
    html += `<div class="form-field"><label class="form-label">${resolveText(f.label)}${f.required ? '<span class="req">*</span>' : ''}</label>`;
    if (f.type === 'radio') {
      html += `<div class="form-opts" data-field="${f.id}">`;
      f.options.forEach((opt, i) => {
        const lockMsg = f.lockedOptions && f.lockedOptions[i];
        const locked = !!lockMsg;
        html += `<button type="button" class="form-opt${locked ? ' form-opt-locked' : ''}"
          data-field="${f.id}"
          data-val="${escapeHtml(opt)}"
          ${locked ? `data-locked="1" data-lockmsg="${escapeHtml(lockMsg)}"` : ''}>
          <span class="k">${String.fromCharCode(65 + i)}</span>
          <span>${escapeHtml(opt)}</span>
          ${locked ? `<span class="lock-hint" style="display:none;">${escapeHtml(lockMsg)}</span>` : ''}
        </button>`;
      });
      html += `</div>`;
    } else if (f.type === 'checkbox') {
      html += `<div class="form-opts" data-field="${f.id}">`;
      f.options.forEach((opt, i) => { html += `<button type="button" class="form-opt" data-multi="true" data-field="${f.id}" data-val="${escapeHtml(opt)}"><span class="k">${String.fromCharCode(65 + i)}</span><span>${escapeHtml(opt)}</span></button>`; });
      html += `</div>`;
    } else if (f.type === 'rating') {
      html += `<div class="form-rating" data-field="${f.id}">`;
      for (let i = 1; i <= 5; i++) html += `<button type="button" class="star" data-field="${f.id}" data-val="${i}">★</button>`;
      html += `</div>`;
    } else if (f.type === 'textarea') {
      html += `<textarea class="form-textarea" data-field="${f.id}"></textarea>`;
    } else if (f.type === 'text') {
      html += `<input type="text" class="form-input" data-field="${f.id}">`;
    }
    html += `</div>`;
  });
  return html;
}
function renderFormReadonly(form, answers) {
  let html = '';
  form.fields.forEach(f => {
    html += `<div class="form-field"><label class="form-label">${resolveText(f.label)}</label>`;
    const v = answers[f.id];
    if (v === undefined || v === null || v === '' || (Array.isArray(v) && !v.length)) html += `<div class="form-readonly empty">${T('formEmpty')}</div>`;
    else {
      const display = Array.isArray(v) ? v.join('、') : (f.type === 'rating' ? '★'.repeat(v) : v);
      html += `<div class="form-readonly">${escapeHtml(display)}</div>`;
    }
    html += `</div>`;
  });
  return html;
}
function attachFormHandlers(form, answers) {
  form.fields.forEach(f => {
    if (f.type === 'radio') {
      document.querySelectorAll(`.form-opt[data-field="${f.id}"]`).forEach(btn => {
        btn.addEventListener('click', () => {
          if (btn.dataset.locked === '1') {
            const hint = btn.querySelector('.lock-hint');
            if (hint) {
              hint.style.display = 'inline';
              clearTimeout(btn._lockTimer);
              btn._lockTimer = setTimeout(() => { hint.style.display = 'none'; }, 3000);
            }
            return;
          }
          document.querySelectorAll(`.form-opt[data-field="${f.id}"]`).forEach(b => b.classList.remove('selected'));
          btn.classList.add('selected');
          answers[f.id] = btn.dataset.val;
          const sb = document.getElementById('formSubmit');
          if (sb && sb._refreshValid) sb._refreshValid();
        });
      });
    } else if (f.type === 'checkbox') {
      answers[f.id] = [];
      document.querySelectorAll(`.form-opt[data-field="${f.id}"]`).forEach(btn => {
        btn.addEventListener('click', () => {
          btn.classList.toggle('selected');
          const arr = answers[f.id], v = btn.dataset.val;
          if (btn.classList.contains('selected')) { if (!arr.includes(v)) arr.push(v); }
          else { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); }
          const sb = document.getElementById('formSubmit');
          if (sb && sb._refreshValid) sb._refreshValid();
        });
      });
    } else if (f.type === 'rating') {
      document.querySelectorAll(`.star[data-field="${f.id}"]`).forEach(s => {
        s.addEventListener('click', () => {
          const val = parseInt(s.dataset.val, 10);
          document.querySelectorAll(`.star[data-field="${f.id}"]`).forEach(st => st.classList.toggle('on', parseInt(st.dataset.val, 10) <= val));
          answers[f.id] = val;
          const sb = document.getElementById('formSubmit');
          if (sb && sb._refreshValid) sb._refreshValid();
        });
      });
    } else if (f.type === 'text' || f.type === 'textarea') {
      const el = document.querySelector(`[data-field="${f.id}"]`);
      if (el) el.addEventListener('input', () => {
        answers[f.id] = el.value;
        const sb = document.getElementById('formSubmit');
        if (sb && sb._refreshValid) sb._refreshValid();
      });
    }
  });
}

const AUTOSAVE_KEY = 'sol_autosave_';
const MANUALSAVE_KEY = 'sol_manualsave_';
const SAVE_SLOTS = 6;
function buildSaveSnapshot() {
  return {
    version: 3, timestamp: Date.now(), lang: state.lang,
    day: state.day, love: state.love, horror: state.horror, paranoid: state.paranoid,
    selectedNpc: state.selectedNpc, unlocked: [...state.unlocked],
    progress: JSON.parse(JSON.stringify(state.progress)),
    history: JSON.parse(JSON.stringify(state.history)),
    submittedForms: JSON.parse(JSON.stringify(state.submittedForms)),
    chatChar: state.chatChar, autoSaveCursor: state.autoSaveCursor, introDone: state.introDone,
    preferredStyle: music.preferredStyle, preferredLyrics: music.preferredLyrics, musicMode: music.mode,
    achievements: [...state.achievements], dayEntryDone: JSON.parse(JSON.stringify(state.dayEntryDone || {})),
    visitedNodes: JSON.parse(JSON.stringify(state.visitedNodes || {})),
    currentScene: state.currentScene,
    spaceKilled: state.spaceKilled,
    gameCleared: state.gameCleared,
    unread: JSON.parse(JSON.stringify(state.unread || {})),
    unlockedArchives: [...state.unlockedArchives]
    
  };
}
function inferSceneFromState() {
  const d = state.day;
  if (d <= 1) return 'ship';
  if (d >= 4) return 'ship';
  if (d === 3) return 'stationNight';

  // day 2：
  // 若已完成血场景 → stationNight
  const nightDone = visitedNode('hasebe','d2_b12')
                 || visitedNode('mikazuki','d2_m13')
                 || visitedNode('ichigo','d2_i15');
  if (nightDone) return 'stationNight';
  // 若已看过山姥切 d2_n6（触发了 scene:'stationDusk'）→ stationDusk
  if (visitedNode('naginata','d2_n6')) return 'stationDusk';
  // 其余默认 day 2 初始白昼
  return 'stationDay';
}
function applySaveSnapshot(data) {
  state.lang = data.lang || 'zh';
  applyLanguageButtons();
  state.day = data.day;
  state.love = data.love; state.horror = data.horror; state.paranoid = data.paranoid;
  state.selectedNpc = data.selectedNpc;
  state.unlocked = [...(data.unlocked || [])];
  state.progress = data.progress || {};
  state.history = data.history || {};
  state.submittedForms = data.submittedForms || {};
  state.chatChar = data.chatChar || null;
  state.autoSaveCursor = data.autoSaveCursor || 0;
  state.introDone = data.introDone || false;
  // ★ 全局成就 + 存档成就合并（跨存档继承）
  {
    const g = loadGlobalAchievements();
    const s = data.achievements || [];
    state.achievements = Array.from(new Set([...g, ...s]));
    saveGlobalAchievements();
  }
  // ★ 全局档案 + 存档档案合并
  {
    const g = loadGlobalArchives();
    const s = data.unlockedArchives || [];
    state.unlockedArchives = Array.from(new Set([...g, ...s]));
    saveGlobalArchives();
  }
  state.dayEntryDone = data.dayEntryDone || {};
  state.visitedNodes = data.visitedNodes || {};
  state.view = 'contacts';

  state.spaceKilled = !!data.spaceKilled;
  state.gameCleared = !!data.gameCleared;
  state.unread = data.unread || {};

  // ★ 恢复存档时的场景（旧存档没记录时退回 ship）
  switchScene((data.currentScene && SCENES[data.currentScene]) ? data.currentScene : 'ship', true);

  if (data.preferredStyle) music.preferredStyle = data.preferredStyle;
  if (data.preferredLyrics) music.preferredLyrics = data.preferredLyrics;
  if (data.musicMode) music.mode = data.musicMode;
  refreshI18n();
  updateView(); updateFormToggle(); updateFormBtnVisibility(); updateMusicPlayerVisibility(); updatePlayerNextDayBtnVisibility();
  updateUnreadOnStateChange();
  updateDebug(); checkAchievements();
}
function doAutoSave() {
  try {
    const snap = buildSaveSnapshot();
    const slot = state.autoSaveCursor % SAVE_SLOTS;
    localStorage.setItem(AUTOSAVE_KEY + slot, JSON.stringify(snap));
    state.autoSaveCursor = (state.autoSaveCursor + 1) % SAVE_SLOTS;
  } catch (e) {}
}
function doManualSave(slot) {
  try { localStorage.setItem(MANUALSAVE_KEY + slot, JSON.stringify(buildSaveSnapshot())); } catch (e) {}
}
function doLoad(slot, type) {
  const key = (type === 'auto' ? AUTOSAVE_KEY : MANUALSAVE_KEY) + slot;
  const raw = localStorage.getItem(key);
  if (!raw) return false;
  try { applySaveSnapshot(JSON.parse(raw)); return true; } catch (e) { return false; }
}
function getSaveInfo(slot, type) {
  const key = (type === 'auto' ? AUTOSAVE_KEY : MANUALSAVE_KEY) + slot;
  const raw = localStorage.getItem(key);
  if (!raw) return null;
  try { return JSON.parse(raw); } catch (e) { return null; }
}
function tryLoadLatestAutoSave() {
  let best = -1, ts = 0;
  for (let i = 0; i < SAVE_SLOTS; i++) {
    const info = getSaveInfo(i, 'auto');
    if (info && info.timestamp > ts) { ts = info.timestamp; best = i; }
  }
  if (best >= 0) return doLoad(best, 'auto');
  return false;
}
function formatTimestamp(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function openMenu(defaultTab = 'auto') {
  const tabs = UI_I18N[state.lang].menuTabs;
  showModal(`<div class="modal-head">${T('menu')}</div>
    <div class="modal-sub">Solaris Sea · Comm Terminal</div>
    <div class="menu-tabs">
      <button class="menu-tab ${defaultTab==='auto'?'active':''}" data-tab="auto">${tabs.auto}</button>
      <button class="menu-tab ${defaultTab==='manual'?'active':''}" data-tab="manual">${tabs.manual}</button>
      <button class="menu-tab ${defaultTab==='achievements'?'active':''}" data-tab="achievements">${tabs.achievements}</button>
      <button class="menu-tab ${defaultTab==='settings'?'active':''}" data-tab="settings">${state.lang === 'en' ? 'Settings' : state.lang === 'ja' ? '設定' : '设置'}</button>
      <button class="menu-tab ${defaultTab==='credits'?'active':''}" data-tab="credits">${tabs.credits}</button>    
    </div><div id="menuContent"></div>`);
  const content = document.getElementById('menuContent');
  document.querySelectorAll('.menu-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.menu-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      renderMenuTab(tab.dataset.tab, content);
    });
  });
  renderMenuTab(defaultTab, content);
}
function renderMenuTab(tab, content) {
  if (tab === 'auto' || tab === 'manual') {
    content.innerHTML = renderSaveGrid(tab);
    attachSaveHandlers(tab);
  } else if (tab === 'achievements') {
    let html = '<div class="credits-body">';
    ACHIEVEMENTS.forEach(a => {
      const got = state.achievements.includes(a.id);
      const name = got ? (a.name[state.lang] || a.name.zh) : '???';
      const desc = got ? (a.desc[state.lang] || a.desc.zh) : T('achvHidden');
      html += `<div class="achv-item ${got ? '' : 'locked'}"><div class="achv-star">${got ? '★' : '☆'}</div>
        <div class="achv-main"><div class="achv-name">${name}</div><div class="achv-desc">${desc}</div></div></div>`;
    });
    html += `</div><p class="credits-body dim" style="margin-top:12px;font-size:12px;">${fmt(T('achvUnlocked'), { n: state.achievements.length, t: ACHIEVEMENTS.length })}</p>`;
    content.innerHTML = html;
  } else if (tab === 'settings') {
    const scanOff = localStorage.getItem('sol_scan_off') === '1';
    const L = {
      zh: { title: '显示设置', scan: '通讯器扫描线效果', desc: '关闭后，通讯器将不再显示横向扫描线。', langTitle: '语言' },
      en: { title: 'Display', scan: 'Comm screen scanlines', desc: 'When off, the horizontal scanlines are hidden.', langTitle: 'Language' },
      ja: { title: '表示設定', scan: '通信機の走査線', desc: 'オフにすると横方向の走査線が非表示になります。', langTitle: '言語' }
    }[state.lang] || { title: '显示设置', scan: '通讯器扫描线效果', desc: '关闭后，通讯器将不再显示横向扫描线。', langTitle: '语言' };

    content.innerHTML = `<div class="credits-body">
      <h3>${L.title}</h3>
      <label class="ios-toggle">
        <span class="ios-toggle-text">${L.scan}</span>
        <input type="checkbox" id="scanToggle" ${scanOff ? '' : 'checked'}>
        <span class="ios-toggle-track"><span class="ios-toggle-thumb"></span></span>
      </label>
      <p class="dim">${L.desc}</p>

      <h3 style="margin-top:20px;">${L.langTitle}</h3>
      <div class="lang-setting-row">
        <button class="lang-setting-btn ${state.lang === 'zh' ? 'active' : ''}" data-lang="zh">中文</button>
        <button class="lang-setting-btn ${state.lang === 'en' ? 'active' : ''}" data-lang="en">EN</button>
        <button class="lang-setting-btn ${state.lang === 'ja' ? 'active' : ''}" data-lang="ja">日本語</button>
      </div>
    </div>`;

    document.getElementById('scanToggle').addEventListener('change', (e) => {
      if (e.target.checked) {
        localStorage.removeItem('sol_scan_off');
        document.querySelectorAll('.crt-scan').forEach(el => el.style.display = '');
      } else {
        localStorage.setItem('sol_scan_off', '1');
        document.querySelectorAll('.crt-scan').forEach(el => el.style.display = 'none');
      }
    });

    content.querySelectorAll('.lang-setting-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        switchLanguage(btn.dataset.lang);
        renderMenuTab('settings', content);
      });
    });
  } else if (tab === 'credits') {
    content.innerHTML = `<div class="credits-body">${T('creditsMenu')}</div>`;
  }
}

function renderSaveGrid(type) {
  let html = '<div class="save-grid">';
  for (let i = 0; i < SAVE_SLOTS; i++) {
    const info = getSaveInfo(i, type);
    if (info) {
      const npcMeta = info.selectedNpc ? CHARACTERS_META.find(c => c.id === info.selectedNpc) : null;
      const avaHtml = npcMeta ? `<div class="s-ava">${npcMeta.avatar}</div>` : '';
      html += `<div class="save-slot" data-slot="${i}" data-type="${type}" data-has="1">
        <div class="s-head">
          <div class="s-num">${type === 'auto' ? T('saveAuto') : T('saveManual')} ${i+1}</div>
          ${avaHtml}
        </div>
        <div class="s-info">${fmt(T('saveDay'), { day: info.day })}</div>
        <div class="s-meta">${formatTimestamp(info.timestamp)}</div></div>`;
    } else {
      html += `<div class="save-slot" data-slot="${i}" data-type="${type}" data-has="0">
        <div class="s-head">
          <div class="s-num">${type === 'auto' ? T('saveAuto') : T('saveManual')} ${i+1}</div>
        </div>
        <div class="s-info empty">${T('saveEmpty')}</div>
        <div class="s-meta">— — —</div></div>`;
    }
  }
  return html + '</div>';
}
function attachSaveHandlers(type) {
  document.querySelectorAll(`.save-slot[data-type="${type}"]`).forEach(slot => {
    slot.addEventListener('click', () => {
      const idx = parseInt(slot.dataset.slot, 10);
      const has = slot.dataset.has === '1';
      if (type === 'auto') {
        if (!has) return;
        confirmDialog(T('confirmLoad'), () => {
          if (doLoad(idx, 'auto')) { closeModal(); pushSystemMessage('Loaded auto ' + (idx+1)); }
        });
      } else {
        if (!has) {
          confirmDialog(fmt(T('confirmSave'), { n: idx+1 }), () => {
            doManualSave(idx); closeModal(); pushSystemMessage('Saved manual ' + (idx+1));
            setTimeout(() => openMenu('manual'), 80);
          });
        } else {
          const info = getSaveInfo(idx, 'manual');
          const npcMeta = info.selectedNpc ? CHARACTERS_META.find(c => c.id === info.selectedNpc) : null;
          const avaHtml = npcMeta ? `<div class="s-ava" style="display:inline-block;width:40px;height:40px;border:2px solid var(--dark);background:var(--dark);margin-right:10px;vertical-align:middle;">${npcMeta.avatar}</div>` : '';
          showModal(`<div class="modal-head">${T('saveManual')} ${idx+1}</div>
            <div class="modal-sub">${avaHtml}${fmt(T('saveDay'), { day: info.day })} · ${formatTimestamp(info.timestamp)}</div>
            <button class="save-action-btn" data-op="load"><div class="sa-title">${T('saveLoad')}</div></button>
            <button class="save-action-btn" data-op="overwrite"><div class="sa-title">${T('saveOverwrite')}</div></button>
            <button class="save-action-btn" data-op="delete"><div class="sa-title">${T('saveDelete')}</div></button>
            <button class="save-action-btn" data-op="cancel"><div class="sa-title">${T('saveCancel')}</div></button>`);
          document.querySelectorAll('.save-action-btn').forEach(btn => {
            btn.addEventListener('click', () => {
              const op = btn.dataset.op;
              if (op === 'load') {
                confirmDialog(T('confirmLoad'), () => { if (doLoad(idx, 'manual')) closeModal(); });
              } else if (op === 'overwrite') {
                confirmDialog(T('confirmOverwriteSlot'), () => {
                  doManualSave(idx);
                  pushSystemMessage('Overwrote manual ' + (idx+1));
                  setTimeout(() => openMenu('manual'), 80);
                });
              } else if (op === 'delete') {
                confirmDialog(T('confirmDelete'), () => {
                  localStorage.removeItem(MANUALSAVE_KEY + idx);
                  setTimeout(() => openMenu('manual'), 80);
                });
              } else if (op === 'cancel') {
                openMenu('manual');
              }
            });
          });
        }
      }
    });
  });
}
function pushSystemMessage(text) {
  if (state.chatChar && state.history[state.chatChar]) {
    state.history[state.chatChar].push({ day: state.day, role: 'sys', text });
    if (state.view === 'chat') renderChatFull(state.chatChar);
  }
}

/* ============================================================
   ★ 下一日 / 重置
   ============================================================ */
function nextDay() {
  if (!state.submittedForms[state.day]) confirmDialog(fmt(T('confirmNextDay'), { day: state.day }), doNextDay);
  else doNextDay();
}
function doNextDay() {
  state.day++;
  state.progress = {};
  state.dayEntryDone = {};
  let newlyUnlocked = null;
  if (state.day === 2) {
    const npcId = resolveSelectedNpc();
    if (npcId && !state.unlocked.includes(npcId)) {
      state.unlocked.push(npcId);
      state.selectedNpc = npcId;
      newlyUnlocked = npcId;
    }
  }
  if (state.day === 4) {
    state.unlocked = ['saniwa'];
    state.view = 'contacts';
    state.chatChar = null;
    switchScene('ship');
  }
  state.unlocked.forEach(id => { state.unread[id] = true; });
  if (newlyUnlocked) { state.view = 'contacts'; state.chatChar = null; }
  updateView(); updateFormToggle(); updateFormBtnVisibility(); updateMusicPlayerVisibility(); updatePlayerNextDayBtnVisibility();
  doAutoSave(); updateDebug(); checkAchievements();
  if (newlyUnlocked) {
    const ch = CHARACTERS_META.find(c => c.id === newlyUnlocked);
    if (ch) setTimeout(() => showNewNpcModal(ch), 400);
  }
}
function showNewNpcModal(ch) {
  showModal(`<div class="modal-head">${T('modalNewNpc')}</div>
    <div class="modal-sub">${fmt(T('modalNewNpcSub'), { day: state.day })}</div>
    <div style="display:flex;gap:16px;align-items:center;padding:20px 0;">
      <div style="width:80px;height:80px;border:3px solid var(--dark);background:var(--dark);flex-shrink:0;">${ch.avatar}</div>
      <div><div style="font-family:var(--font-head);font-size:20px;letter-spacing:3px;color:var(--dark);">${charName(ch.id)}</div>
      <div style="font-size:13px;color:var(--red);font-weight:700;margin-top:6px;">${charRole(ch.id)}</div>
      <div style="font-size:12px;color:#6a5a4a;margin-top:8px;line-height:1.6;">${T('newNpcWaiting')}</div></div></div>
    <button class="form-submit" id="newNpcOk">${T('newNpcView')}</button>`);
  document.getElementById('newNpcOk').addEventListener('click', () => { closeModal(); state.view = 'contacts'; updateView(); });
}
function resetGame() {
  confirmDialog(T('confirmReset'), () => {
    state.love = 0; state.horror = 0; state.paranoid = 0; state.day = 1;
    state.progress = {}; state.history = {}; state.unread = {};
    state.submittedForms = {}; state.unlocked = ['konosuke'];
    state.selectedNpc = null; state.chatChar = null; state.introDone = false;
    state.achievements = loadGlobalAchievements();   // ★ 保留全局成就
    state.unlockedArchives = loadGlobalArchives();   // ★ 保留全局档案
    state.dayEntryDone = {}; state.visitedNodes = {};
    state.dialogSession = 0;
    if (autoEndTimer) { clearTimeout(autoEndTimer); autoEndTimer = null; }
    if (state.typeTimer) { clearInterval(state.typeTimer); state.typeTimer = null; }
    if (state.messageTimer) { clearTimeout(state.messageTimer); state.messageTimer = null; }
    state.view = 'contacts';
    switchScene('ship', true);
    music.allTracks = []; music.tracks = []; music.filterTag = null;
    music.preferredStyle = null; music.preferredLyrics = null;
    music.mode = 'sequential';
    music.audioEl.pause(); music.audioEl.removeAttribute('src');
    updateView(); updateFormToggle(); updateFormBtnVisibility(); updateMusicPlayerVisibility(); updatePlayerNextDayBtnVisibility();
    updateMpStatus(); updateDebug();
    setTimeout(() => enterChat('konosuke'), 300);
    state.spaceKilled = false;
    state.gameCleared = false;
  });
}

/* ============================================================
   ★ 调试
   ============================================================ */
function updateDebug() {
  document.getElementById('dbgLove').textContent = Math.round(state.love * 10) / 10;
  document.getElementById('dbgHorror').textContent = Math.round(state.horror * 10) / 10;
  document.getElementById('dbgParanoid').textContent = Math.round(state.paranoid * 10) / 10;
  document.getElementById('dbgDay').textContent = state.day;
  document.getElementById('dbgScene').textContent = state.currentScene || '-';
  document.getElementById('dbgNode').textContent = state.progress[state.chatChar] || '-';
  document.getElementById('dbgView').textContent = state.view;
  document.getElementById('dbgNpc').textContent = state.selectedNpc || '-';
  document.getElementById('dbgAchv').textContent = `${state.achievements.length}/${ACHIEVEMENTS.length}`;
}
document.addEventListener('keydown', (e) => {
  if (e.key === 'd' || e.key === 'D') document.getElementById('debug').classList.toggle('show');
});

/* ============================================================
   ★ 语言切换
   ============================================================ */
function applyLanguageButtons() {
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === state.lang));
}
function refreshI18n() {
  if (state.typeTimer) { clearInterval(state.typeTimer); state.typeTimer = null; }
  state.typing = false;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.dataset.i18n;
    const txt = T(key);
    if (txt) el.textContent = txt;
  });
  // 主界面动态文本
  updateFormToggle();
  if (state.view === 'contacts') renderContactList();
  if (state.view === 'chat' && state.chatChar) {
    elName.textContent = charName(state.chatChar);
    elRole.textContent = charRole(state.chatChar);
    const meta = CHARACTERS_META.find(c => c.id === state.chatChar);
    if (meta) elAvatar.innerHTML = meta.avatar;
    renderChatFull(state.chatChar);
    const node = getNode(state.chatChar, state.progress[state.chatChar]);
    if (node) showOptions(state.chatChar, node);
  }
  // 音乐播放器
  document.getElementById('mpAdd').textContent = T('addTrack');
  updateMpStatus();
}
function switchLanguage(lang) {
  if (!UI_I18N[lang]) return;
  if (state.lang === lang) return;
  state.lang = lang;
  applyLanguageButtons();
  refreshI18n();
  doAutoSave();
}
document.querySelectorAll('.lang-btn').forEach(btn => {
  btn.addEventListener('click', () => switchLanguage(btn.dataset.lang));
});

/* ============================================================
   ★ 初始化
   ============================================================ */
function init() {
  state.achievements = loadGlobalAchievements();
  state.unlockedArchives = loadGlobalArchives();
  isMobileLayout = window.matchMedia('(max-width: 768px)').matches;
  applyStarDriftKeyframes();
  switchScene('ship', true);
  initGrainCanvas();
  initMusicPlayer();
  if (localStorage.getItem('sol_scan_off') === '1') {
    document.querySelectorAll('.crt-scan').forEach(el => el.style.display = 'none');
  }
  updateMpStatus();
  applyLanguageButtons();

  document.getElementById('playerNextDayBtn').addEventListener('click', nextDay);
  document.getElementById('resetBtn').addEventListener('click', resetGame);
  document.getElementById('menuBtn').addEventListener('click', openMenu);
  document.getElementById('chatBackBtn').addEventListener('click', () => {
    state.view = 'contacts';
    updateView();
  });


  // 尝试读档
  const loaded = tryLoadLatestAutoSave();
  if (loaded) {
    if (state.chatChar) {
      const ch = CHARACTERS_META.find(c => c.id === state.chatChar);
      if (ch && state.unlocked.includes(ch.id)) setTimeout(() => enterChat(state.chatChar), 300);
    } else updateView();
  } else {
    state.unlocked = ['konosuke'];
    refreshI18n();
    updateView(); updateFormToggle(); updateFormBtnVisibility(); updateMusicPlayerVisibility(); updatePlayerNextDayBtnVisibility(); updateDebug();
    setTimeout(() => enterChat('konosuke'), 300);
  }
  refreshI18n();
  updateView(); updateFormToggle(); updateFormBtnVisibility(); updateMusicPlayerVisibility(); updatePlayerNextDayBtnVisibility();
  setTimeout(() => {
    if (!sessionStorage.getItem('sol_credits_shown')) {
      sessionStorage.setItem('sol_credits_shown', '1');
      showModal(`<div class="modal-head">Credits</div>
        <div class="modal-sub">Solaris Sea · Notice</div>
        <div class="credits-body">${T('introCredits')}</div>
        <button class="form-submit" id="creditsOk">OK</button>`);
      document.getElementById('creditsOk').addEventListener('click', closeModal);
    }
  }, 800);
  commsGlitchLoop();
  setupResponsiveLayout(true);
  requestAnimationFrame(adjustLeftButtonPositions);
}
document.addEventListener('DOMContentLoaded', init);
</script>

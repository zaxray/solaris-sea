<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Solaris Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: thin; scrollbar-color: rgba(232,179,61,0.35) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(232,179,61,0.35); border-radius: 3px; }
*::-webkit-scrollbar-thumb:hover { background: rgba(232,179,61,0.65); }
*::-webkit-scrollbar-button { display: none; }
:root { --bg:#05070a; --amber:#e8b33d; --red:#d94f2b; --cream:#f4eed8; --dark:#0a0f14;
  --font-head:'Archivo Black','Oswald','Noto Sans SC','Microsoft YaHei',sans-serif;
  --font-tech:'Oswald','Noto Sans SC',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
html,body { height:100%; width:100%; background:var(--bg); color:var(--cream); font-family:var(--font-body); overflow:hidden; -webkit-font-smoothing:antialiased; -webkit-text-size-adjust:100%; text-size-adjust:100%; }
#app { display:grid; grid-template-columns:2fr 1fr; height:100%; width:100%; overflow:hidden; }
.stage { position:relative; background:#04060a; overflow:hidden; }
.scene-layer { position:absolute; inset:0; opacity:0; transition:opacity .9s ease; pointer-events:none; }
.scene-layer svg { width:100%; height:100%; display:block; }
.grain-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:overlay; opacity:.15; z-index:15; }
.texture-overlay { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.22; z-index:16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .4 0'/></filter><rect width='300' height='300' filter='url(%23p)'/></svg>");
  background-size:300px 300px; }
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:1}}
.star{animation:twinkle infinite ease-in-out}
@keyframes starDrift{from{transform:translate(0,0)}to{transform:translate(-280px,0)}}
.star-field{animation:starDrift infinite linear}
@keyframes camLed{0%,42%,100%{opacity:1}50%,92%{opacity:.1}}
.cam-led{animation:camLed 2.6s ease-in-out infinite}

/* ===== 不可选选项 ===== */
.form-opt.form-opt-locked {
  background: #efe8d4;
  color: #8a7a5a;
  cursor: not-allowed;
  border-style: dashed;
  flex-wrap: wrap;
}
.form-opt.form-opt-locked:hover {
  background: #efe8d4;
  transform: none;
}
.form-opt.form-opt-locked .k {
  opacity: .55;
}
.form-opt .lock-hint {
  color: var(--red);
  font-size: 11.5px;
  font-weight: 700;
  margin-left: 6px;
  line-height: 1.3;
  white-space: normal;
  flex-basis: 100%;
}


.music-player { position:absolute; left:26px; bottom:26px; z-index:22; width:250px; padding:12px 14px 14px;
  background:var(--cream); border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark);
  opacity:.9; transition:opacity .25s ease; display:none; max-height:calc(100vh - 240px); overflow-y:auto; overflow-x:hidden; }
.music-player:hover { opacity:1; }
.mp-header{display:flex; justify-content:space-between; align-items:center; font-family:var(--font-head); font-size:12px; letter-spacing:4px; color:var(--dark); margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid var(--dark);}
.mp-led{width:9px; height:9px; background:var(--dark); border:2px solid var(--dark);}
.mp-led.on{background:var(--red); box-shadow:0 0 0 2px var(--dark), 0 0 8px var(--red);}
.mp-track{font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--dark); margin-bottom:8px; word-break:break-all; line-height:1.4; min-height:16px;}
.mp-track.empty{color:#8a7a5a; font-style:italic; font-weight:400;}
.mp-progress{height:6px; background:#d8cfa8; margin-bottom:10px; border:1px solid var(--dark);}
.mp-bar{height:100%; background:var(--red); width:0; transition:width .2s linear;}
.mp-controls{display:grid; grid-template-columns:repeat(4,1fr); margin-bottom:10px; border:2px solid var(--dark);}
.mp-controls button{padding:8px 0; background:var(--cream); border:none; border-right:2px solid var(--dark); color:var(--dark); font-family:var(--font-head); font-size:12px; cursor:pointer;}
.mp-controls button:last-child{border-right:none;}
.mp-controls button:hover{background:var(--amber);}
.mp-controls button.active{background:var(--red); color:#fff;}
.mp-footer{display:flex; justify-content:space-between; align-items:center; font-family:var(--font-head); font-size:10px; letter-spacing:2px; color:var(--dark);}
.mp-add{padding:5px 12px; background:var(--dark); color:var(--cream); border:2px solid var(--dark); font-family:var(--font-head); font-size:10px; letter-spacing:2px; cursor:pointer;}
.mp-add:hover{background:var(--red);}
.mp-filters{display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(10,15,20,.25);}
.mp-filter{padding:3px 9px; background:transparent; border:1px solid var(--dark); color:var(--dark); font-family:var(--font-body); font-weight:700; font-size:10px; cursor:pointer; white-space:nowrap;}
.mp-filter.active{background:var(--dark); color:var(--cream);}

.lang-switch { position:absolute; right:26px; bottom:26px; z-index:21;
  display:flex; background:var(--cream); border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark);
  opacity:.85; transition:opacity .25s; }
.lang-switch:hover{opacity:1;}
.lang-btn{padding:10px 14px; background:var(--cream); border:none; border-right:2px solid var(--dark);
  color:var(--dark); font-family:var(--font-head); font-size:11px; letter-spacing:2px; cursor:pointer; transition:all .1s;}
.lang-btn:last-child{border-right:none;}
.lang-btn:hover{background:var(--amber);}
.lang-btn.active{background:var(--dark); color:var(--cream);}

.comms { position:relative; display:flex; flex-direction:column; padding:16px; background:var(--cream);
  border-left:4px solid var(--dark); box-shadow:inset -4px 0 0 var(--dark); overflow:hidden; }
.comms-top { position:relative; z-index:3; display:flex; align-items:center; gap:12px; padding:14px 18px;
  background:var(--dark); border:3px solid var(--dark); box-shadow:4px 4px 0 var(--red); margin-bottom:14px; flex-shrink:0; }
.comms-top .led { width:12px; height:12px; background:var(--red); box-shadow:0 0 0 2px var(--cream); flex-shrink:0; animation:camLed 2.6s ease-in-out infinite; }
.comms-top h1 { font-family:var(--font-head); font-size:20px; letter-spacing:6px; color:var(--cream); font-weight:900; line-height:1; flex:1; }
.comms-top h1::before { content:'/ '; color:var(--red); }
.reset-btn { padding:7px 18px; background:#3a3a3a; color:var(--cream); border:2px solid var(--cream);
  font-family:var(--font-head); font-size:12px; letter-spacing:4px; cursor:pointer; transition:all .1s; }
.reset-btn:hover { background:var(--amber); color:var(--dark); border-color:var(--dark); }
.menu-btn { padding:7px 18px; background:var(--red); color:#fff; border:2px solid var(--cream);
  font-family:var(--font-head); font-size:12px; letter-spacing:4px; cursor:pointer; transition:all .1s; }
.menu-btn:hover { background:var(--amber); color:var(--dark); border-color:var(--dark); }

.comms-screen { position:relative; flex:1; min-height:0; overflow:hidden; background:var(--dark);
  border:3px solid var(--dark); box-shadow:5px 5px 0 var(--red), inset 0 0 0 2px rgba(232,179,61,.15);
  display:flex; flex-direction:column; }
.comms-screen.flash { filter:brightness(1.35) saturate(1.1); }
.comms-screen::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, rgba(232,179,61,.06), transparent 70%); z-index:1; }
.view { position:relative; z-index:5; flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.view-head { flex-shrink:0; padding:12px 18px 10px; font-family:var(--font-head); font-size:13px; letter-spacing:6px;
  color:var(--amber); border-bottom:2px solid var(--amber); background:var(--dark); position:relative; }
.view-head::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--red); }
.contact-list { flex:1; min-height:0; overflow-y:auto; padding:12px; }
.contact-item { position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px;
  background:var(--cream); border:3px solid var(--dark); box-shadow:4px 4px 0 var(--red); cursor:pointer;
  transition:all .1s; text-align:left; color:var(--dark); font-family:var(--font-body); width:100%; }
.contact-item:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--red); background:var(--amber); }
.contact-item.active { background:var(--red); color:#fff; box-shadow:4px 4px 0 var(--dark); }
.contact-item.active .c-name { color:#fff; }
.contact-item.active .c-role { color:rgba(255,255,255,.75); }
.contact-item .c-ava { width:46px; height:46px; flex-shrink:0; border:2px solid var(--dark); background:var(--dark); overflow:hidden; }
.contact-item .c-ava svg { display:block; width:100%; height:100%; }
.contact-item .c-meta { flex:1; min-width:0; }
.contact-item .c-name { font-family:var(--font-head); font-size:15px; letter-spacing:2px; color:var(--dark); line-height:1.2; }
.contact-item .c-role { font-family:var(--font-body); font-weight:700; font-size:10.5px; letter-spacing:1.5px; color:#6a5a4a; margin-top:4px; }
.contact-item .c-badge { width:12px; height:12px; background:var(--red); border:2px solid var(--dark); flex-shrink:0; animation:camLed 2.4s infinite; }
.contact-item.form-assistant {
  background: #3d7ebd;
  color: #fff;
  box-shadow: 4px 4px 0 var(--dark);
}
.contact-item.form-assistant .c-name { color: #fff; }
.contact-item.form-assistant .c-role { color: rgba(255,255,255,.85); }
.contact-item.form-assistant:hover {
  background: #5a96d0;
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 var(--dark);
}
.contacts-next-day-btn {
  flex-shrink: 0;
  width: 100%;
  padding: 16px 8px;
  background: var(--dark);
  border: none;
  border-top: 3px solid var(--amber);
  color: var(--amber);
  font-family: var(--font-head);
  font-size: 13px;
  letter-spacing: 6px;
  cursor: pointer;
  transition: background .15s, color .15s;
  display: none;
}
.contacts-next-day-btn:hover {
  background: var(--red);
  color: #fff;
}
.chat-head { flex-shrink:0; display:flex; align-items:center; gap:14px; padding:12px 18px;
  background:var(--dark); border-bottom:2px solid var(--amber); position:relative; }
.chat-head::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--red); }
.chat-head .avatar { order:2; width:46px; height:46px; flex-shrink:0; border:2px solid var(--amber); background:var(--dark); overflow:hidden; }
.chat-head .avatar svg { display:block; width:100%; height:100%; }
.chat-head .speaker-name { font-family:var(--font-head); font-size:17px; letter-spacing:3px; color:var(--amber); line-height:1.15; }
.chat-head .speaker-role { font-family:var(--font-body); font-weight:700; font-size:10px; letter-spacing:2px; color:#8a7a5a; margin-top:4px; }
.chat-head .head-info { order:1; flex:1; min-width:0; text-align:right; margin-right:8px; }
.chat-back-btn {
  display: block;
  order: 0;
  flex-shrink: 0;
  background: transparent;
  border: none;
  color: var(--amber);
  font-size: 30px;
  line-height: 1;
  cursor: pointer;
  padding: 0 10px 2px 0;
  font-family: var(--font-head);
  transition: color .15s;
}
.chat-back-btn:hover { color: var(--red); }
.chat-history { flex:1; min-height:0; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; background:var(--dark); }
.day-sep { text-align:center; margin:4px 0 16px; flex-shrink:0; }
.day-sep span { display:inline-block; padding:5px 18px; background:var(--amber); color:var(--dark);
  font-family:var(--font-head); font-size:11px; letter-spacing:4px; border:2px solid var(--dark); box-shadow:3px 3px 0 var(--red); }
.bubble { max-width:82%; padding:12px 16px; margin-bottom:12px; font-size:13px; line-height:1.7;
  position:relative; word-wrap:break-word; flex-shrink:0; border:3px solid var(--dark); }
.bubble-npc { background:var(--cream); color:var(--dark); align-self:flex-start; border-left-width:8px; border-left-color:var(--red); box-shadow:4px 4px 0 var(--red); }
.bubble-you { background:var(--red); color:#fff; align-self:flex-end; margin-left:auto; border-right-width:8px; border-right-color:var(--amber); box-shadow:4px 4px 0 var(--amber); }
.bubble-sys { background:var(--amber); color:var(--dark); align-self:center; font-family:var(--font-head); font-size:11px;
  letter-spacing:3px; text-align:center; padding:8px 16px; border:3px dashed var(--dark); max-width:90%; }
.bubble-end { background:transparent; color:#fff; border:none; align-self:center; font-family:var(--font-tech);
  font-size:11px; letter-spacing:4px; text-align:center; padding:10px 0; max-width:90%; margin-bottom:12px; opacity:.75; }
.cursor { display:inline-block; width:9px; height:14px; background:var(--red); margin-left:3px;
  vertical-align:-2px; animation:cursorBlink .9s steps(1) infinite; }
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
.chat-options { flex-shrink:0; padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  min-height:30px; max-height:45vh; overflow-y:auto; border-top:3px solid var(--amber); background:var(--dark); }
.opt { position:relative; text-align:left; padding:14px 18px 14px 40px; background:var(--cream);
  border:3px solid var(--dark); box-shadow:4px 4px 0 var(--red); color:var(--dark);
  font-family:var(--font-body); font-weight:700; font-size:13.5px; line-height:1.5; cursor:pointer; transition:all .1s; }
.opt::before { content:'▶'; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--red); }
.opt:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--red); background:var(--amber); }
.opt-action { background:var(--red); color:#fff; box-shadow:4px 4px 0 var(--amber); }
.opt-action::before { content:'◆'; color:var(--amber); }
.opt-wait { font-family:var(--font-head); font-size:11px; letter-spacing:4px; color:#6a5a4a; padding:12px 4px; }
.jump-latest-btn { align-self:flex-end; margin:0 16px 8px 0; padding:7px 14px; background:var(--amber);
  color:var(--dark); border:2px solid var(--dark); box-shadow:3px 3px 0 var(--dark);
  font-family:var(--font-head); font-size:10px; letter-spacing:2px; cursor:pointer; transition:all .15s;
  display:none; flex-shrink:0; z-index:20; }
.jump-latest-btn:hover { background:var(--red); color:#fff; }
.crt-scan { position:absolute; inset:0; z-index:12; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,.35) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:multiply; }
.crt-noise { position:absolute; inset:-20px; z-index:11; pointer-events:none; opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:noiseShift .14s steps(2) infinite; }
@keyframes noiseShift{0%{transform:translate(0,0)}50%{transform:translate(-6px,4px)}100%{transform:translate(3px,-5px)}}
.crt-tear { position:absolute; left:0; right:0; height:8px; top:-20px; z-index:13; pointer-events:none;
  opacity:0; background:var(--amber); }
.crt-tear.on { animation:tearRun .32s linear; }
@keyframes tearRun{0%{top:-20px; opacity:.85}100%{top:100%; opacity:0}}
.crt-vignette { position:absolute; inset:0; z-index:10; pointer-events:none; box-shadow:inset 0 0 40px rgba(0,0,0,.7); }

.crt-tear {
  z-index: 14;
  will-change: top, opacity;
}
.crt-tear.on {
  animation: tearRun .45s linear;
}
@keyframes tearRun {
  0%   { top: -20px; opacity: .9; }
  100% { top: 100%;  opacity: 0; }
}

.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(4,6,9,.94); display:flex;
  align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; }
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal-box { width:640px; max-width:92vw; max-height:90vh; overflow-y:auto; background:var(--cream);
  border:4px solid var(--dark); box-shadow:12px 12px 0 var(--red); padding:30px 38px 34px; position:relative; }
.modal-head { font-family:var(--font-head); font-size:24px; letter-spacing:8px; color:var(--dark); margin-bottom:6px; }
.modal-head::before { content:'/ '; color:var(--red); }
.modal-sub { font-family:var(--font-body); font-weight:700; font-size:11px; letter-spacing:4px;
  color:var(--red); margin-bottom:22px; padding-bottom:16px; border-bottom:2px solid var(--dark); text-transform:uppercase; }
.modal-close { position:absolute; top:14px; right:14px; background:var(--dark); color:var(--cream);
  border:2px solid var(--dark); font-size:14px; width:34px; height:34px; cursor:pointer;
  font-family:var(--font-head); }
.modal-close:hover { background:var(--red); transform:rotate(90deg); }
.menu-tabs { display:flex; margin-bottom:20px; flex-wrap:wrap; gap:6px; }
.menu-tab { flex:1 1 auto; min-width:85px; padding:12px 10px; background:var(--cream);
  border:2px solid var(--dark); box-shadow:3px 3px 0 var(--dark);
  color:var(--dark); font-family:var(--font-head);
  font-size:12px; letter-spacing:2px; cursor:pointer; }
.menu-tab.active { background:var(--dark); color:var(--cream); }
.save-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.save-slot { padding:14px 16px; background:#fff; border:2px solid var(--dark);
  box-shadow:3px 3px 0 var(--dark); cursor:pointer; text-align:left; color:inherit;
  font-family:var(--font-body); }
.save-slot:hover { background:var(--amber); }
.save-slot .s-num { font-family:var(--font-head); font-size:11px; letter-spacing:3px; color:var(--red); margin-bottom:6px; }
.save-slot .s-info { font-size:13px; color:var(--dark); line-height:1.6; font-weight:700; }
.save-slot .s-info.empty { color:#8a7a5a; font-style:italic; font-weight:400; }
.save-slot .s-meta { font-family:var(--font-tech); font-size:10px; color:#6a5a4a; margin-top:6px; }
.save-slot .s-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 6px;
}
.save-slot .s-head .s-num { margin-bottom: 0; }
.save-slot .s-ava {
  width: 28px;
  height: 28px;
  border: 2px solid var(--dark);
  background: var(--dark);
  overflow: hidden;
  flex-shrink: 0;
}
.save-slot .s-ava svg {
  display: block;
  width: 100%;
  height: 100%;
}
.save-action-btn { padding:14px 18px; background:#fff; border:2px solid var(--dark);
  box-shadow:3px 3px 0 var(--dark); cursor:pointer; text-align:left; color:inherit;
  font-family:var(--font-body); margin-bottom:8px; width:100%; }
.archive-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}
.archive-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 16px;
  background: #fff;
  border: 2px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
  cursor: pointer;
  text-align: left;
  color: inherit;
  font-family: var(--font-body);
  transition: all .1s;
}
.archive-item:hover:not(:disabled) {
  background: var(--amber);
  transform: translate(-2px, -2px);
  box-shadow: 5px 5px 0 var(--dark);
}
.archive-item.locked {
  opacity: .5;
  cursor: not-allowed;
}
.archive-item .a-id {
  font-family: var(--font-head);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--red);
  white-space: nowrap;
  min-width: 120px;
}
.archive-item .a-title {
  font-family: var(--font-body);
  font-size: 13px;
  color: var(--dark);
  font-weight: 700;
}
.archive-item.locked .a-title { color: #8a7a5a; font-style: italic; font-weight: 400; }
.archive-content p {
  font-family: var(--font-body);
  font-size: 13px;
  line-height: 1.85;
  color: var(--dark);
  margin-bottom: 6px;
}
.contact-item.archive-assistant {
  background: #b8892e;
  color: #fff;
  box-shadow: 4px 4px 0 var(--dark);
}
.contact-item.archive-assistant .c-name { color: #fff; }
.contact-item.archive-assistant .c-role { color: rgba(255,255,255,.85); }
.contact-item.archive-assistant:hover {
  background: #d4a63d;
  transform: translate(-2px, -2px);
  box-shadow: 6px 6px 0 var(--dark);
}
.save-action-btn:hover { background:var(--amber); }
.save-action-btn[data-op="delete"]:hover { background:var(--red); color:#fff; }
.save-action-btn .sa-title { font-family:var(--font-head); font-size:14px; letter-spacing:4px; color:var(--dark); }
.save-action-btn[data-op="delete"]:hover .sa-title { color:#fff; }

.form-field { margin-bottom:22px; }
.form-label { display:block; font-size:14px; color:var(--dark); font-weight:700; margin-bottom:8px; line-height:1.5; }
.form-label .req { color:var(--red); margin-left:4px; }
.form-opts { display:flex; flex-direction:column; gap:8px; }
.form-opt { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#fff;
  border:2px solid var(--dark); cursor:pointer; color:var(--dark); font-family:var(--font-body);
  font-size:14px; text-align:left; }
.form-opt:hover { background:var(--amber); }
.form-opt.selected { background:var(--red); color:#fff; }
.form-opt .k { width:24px; height:24px; border:2px solid currentColor; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-head);
  font-size:11px; flex-shrink:0; }
.form-opt[data-multi="true"] .k { border-radius:2px; }
.form-opt.selected .k { background:#fff; color:var(--red); border-color:#fff; }
.form-rating { display:flex; gap:8px; }
.form-rating .star { width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:#fff; border:2px solid var(--dark); color:#8a7a5a; cursor:pointer; font-size:20px; }
.form-rating .star.on { color:#fff; background:var(--red); }
.form-readonly { padding:12px 16px; background:#f4eed8; border:2px dashed var(--dark); color:var(--dark); font-size:13px; line-height:1.6; }
.form-readonly.empty { font-style:italic; color:#8a7a5a; }
.form-submit { margin-top:12px; padding:16px 0; width:100%; background:var(--red); color:#fff;
  border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark); font-family:var(--font-head);
  font-size:15px; letter-spacing:8px; cursor:pointer; }
.form-submit:hover { background:var(--amber); color:var(--dark); }
.form-submit:disabled { opacity:.35; cursor:not-allowed; }
.form-submitted-tag { display:inline-block; padding:5px 16px; background:var(--dark); color:var(--amber);
  font-family:var(--font-head); font-size:11px; letter-spacing:4px; margin-bottom:18px; }
.credits-body { font-size:14px; line-height:2; color:var(--dark); }
.credits-body h3 { font-family:var(--font-head); font-size:14px; letter-spacing:4px; color:var(--red); margin:20px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--dark); }
.credits-body p { margin-bottom:8px; }
.credits-body .dim { color:#6a5a4a; font-size:12.5px; }
.achv-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed rgba(10,15,20,.2); }
.achv-item.locked { opacity:.35; }
.achv-star { font-family:var(--font-head); color:var(--red); font-size:20px; flex-shrink:0; }
.achv-item.locked .achv-star { color:#8a7a5a; }
.achv-main { flex:1; }
.achv-name { font-family:var(--font-head); font-size:14px; letter-spacing:2px; color:var(--dark); }
.achv-desc { font-size:12px; color:#6a5a4a; margin-top:4px; line-height:1.5; }
.confirm-box { text-align:center; }
.confirm-box .confirm-msg { font-size:15px; line-height:1.8; color:var(--dark); margin-bottom:24px; font-weight:700; }
.confirm-actions { display:flex; gap:12px; }
.confirm-actions button { flex:1; padding:14px 0; font-family:var(--font-head); font-size:13px;
  letter-spacing:4px; cursor:pointer; border:3px solid var(--dark); box-shadow:4px 4px 0 var(--dark); }
.btn-cancel { background:#fff; color:var(--dark); }
.btn-cancel:hover { background:var(--amber); }
.btn-confirm { background:var(--red); color:#fff; }
.btn-confirm:hover { background:var(--amber); color:var(--dark); }
.debug { position:fixed; top:12px; left:12px; z-index:999; padding:10px 14px; background:rgba(0,0,0,.88);
  border:1px solid var(--red); font-family:var(--font-tech); font-size:12px; letter-spacing:2px;
  color:var(--red); display:none; line-height:1.7; pointer-events:none; }
.debug.show { display:block; }
.debug b { color:var(--amber); }
.comms-screen .crt-scan { z-index: 12; }
.comms-screen .crt-noise { z-index: 11; }
.comms-screen .crt-vignette { z-index: 10; }
.crt-tear { z-index: 14; }
.lang-switch { z-index: 21; }
@media (max-width: 1024px) { .lang-switch { z-index: 100; } }
.ios-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.ios-toggle-text {
  font-size: 14px;
  color: var(--dark);
  font-weight: 700;
  line-height: 1.4;
}
.ios-toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 0;
  height: 0;
}
.ios-toggle-track {
  position: relative;
  flex-shrink: 0;
  width: 52px;
  height: 30px;
  background: #b8b0a0;
  border: 2px solid var(--dark);
  border-radius: 15px;
  transition: background .25s ease;
  box-shadow: inset 0 0 0 1px rgba(10,15,20,.12);
}
.ios-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.ios-toggle input:checked + .ios-toggle-track {
  background: var(--red);
}
.ios-toggle input:checked + .ios-toggle-track .ios-toggle-thumb {
  transform: translateX(22px);
}
.ios-toggle input:focus-visible + .ios-toggle-track {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
/* 设置里的语言切换 */
.lang-setting-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.lang-setting-btn {
  padding: 12px 0;
  background: #fff;
  border: 2px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  color: var(--dark);
  transition: all .1s;
}
.lang-setting-btn:hover { background: var(--amber); }
.lang-setting-btn.active {
  background: var(--red);
  color: #fff;
}

/* 平板和手机隐藏右下角语言切换*/
@media (max-width: 1024px) {
  .lang-switch { display: none !important; }
}

/* 平板两列布局时压缩通讯器 UI，避免底部按钮被挤 */
@media (min-width: 769px) and (max-width: 1200px) {
  .comms { padding: 12px; }
  .comms-top { padding: 10px 12px; gap: 8px; margin-bottom: 10px; }
  .comms-top h1 { font-size: 16px; letter-spacing: 4px; }
  .comms-top .reset-btn,
  .comms-top .menu-btn { padding: 5px 10px; font-size: 10px; letter-spacing: 2px; }
  .contact-item { padding: 10px 12px; margin-bottom: 8px; }
  .contact-item .c-ava { width: 40px; height: 40px; }
  .contact-item .c-name { font-size: 13px; }
  .chat-head { padding: 10px 14px; }
  .bubble { font-size: 12px; padding: 10px 12px; }
  .opt { font-size: 12px; padding: 10px 14px 10px 34px; }
}
@supports (height: 100dvh) {
  html, body { height: 100dvh; }
}
@supports (height: 100dvh) {
  html, body, #app { height: 100dvh; }
  @media (max-width: 768px) {
    #app { grid-template-rows: 100dvh; }
  }
}

/* ============================================================
   移动端媒体查询
   ============================================================ */
@media (max-width: 768px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 100%;
  }
  .stage { display: none; }
  .comms {
    border-left: none;
    box-shadow: none;
    padding: 8px;
  }
  .comms-top {
    margin-bottom: 8px;
    padding: 10px 12px;
    gap: 8px;
  }
  .comms-top h1 { font-size: 16px; letter-spacing: 4px; }
  .comms-top .reset-btn,
  .comms-top .menu-btn {
    padding: 5px 10px;
    font-size: 10px;
    letter-spacing: 2px;
  }
  .lang-btn { padding: 5px 8px; font-size: 10px; letter-spacing: 1px; }
  .comms-screen { box-shadow: none; }
  .view-head { padding: 8px 12px; font-size: 11px; }
  .contact-list { padding: 8px; }
  .contact-item { padding: 10px 12px; margin-bottom: 8px; }

  /* 对话头部：返回按钮在左，文字在右，头像在最右 */
  .chat-head { padding: 8px 10px; gap: 8px; }
  .chat-back-btn {
    display: block !important;
    order: 0;
    font-size: 30px;
    padding: 0 10px 2px 0;
  }
  .chat-head .head-info {
    order: 1;
    flex: 1;
    text-align: right;
    margin-right: 8px;
  }
  .chat-head .avatar { order: 2; width: 36px; height: 36px; }
  .chat-head .speaker-name { font-size: 14px; }
  .chat-head .speaker-role { font-size: 9px; }

  .chat-history { padding: 10px 8px 6px; }
  .bubble { max-width: 90%; padding: 10px 12px; font-size: 12px; margin-bottom: 10px; }
  .chat-options { padding: 8px 10px 10px; gap: 8px; max-height: 40vh; }
  .opt { padding: 10px 14px 10px 32px; font-size: 12px; }



  /* 手机端不再显示悬浮的表格按钮（改用"表格助手"联系人条目） */
.stage-top-bar {
  position: absolute;
  top: 22px;
  left: 26px;
  z-index: 22;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  flex-wrap: wrap;
}


  /* 手机端不需要音乐播放器 */
  .music-player { display: none !important; }

  .modal-box { padding: 20px 18px 24px; width: 94vw; max-height: 88vh; }
  .modal-head { font-size: 18px; letter-spacing: 4px; }
  .form-label { font-size: 13px; }
  .form-opt { padding: 10px 12px; font-size: 13px; }
  .save-grid { grid-template-columns: 1fr; }
  .menu-tab { font-size: 11px; padding: 10px 6px; }
}

</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <div class="scene-layer" id="layerA"></div>
    <div class="scene-layer" id="layerB"></div>
    <canvas class="grain-canvas" id="grainCanvas"></canvas>
    <div class="texture-overlay"></div>
    <div class="music-player" id="musicPlayer">
      <div class="mp-header"><span data-i18n="music">音乐</span><span class="mp-led" id="mpLed"></span></div>
      <div class="mp-track empty" id="mpTrack">— 未加载音轨 —</div>
      <div class="mp-progress"><div class="mp-bar" id="mpBar"></div></div>
      <div class="mp-controls">
        <button id="mpPrev">◀◀</button>
        <button id="mpPlay">▶</button>
        <button id="mpNext">▶▶</button>
        <button id="mpMode">⟲</button>
      </div>
      <div class="mp-footer">
        <span id="mpStatus">0 首 · 顺序</span>
        <button class="mp-add" id="mpAdd" data-i18n="addTrack">+ 添加</button>
      </div>
      <div class="mp-filters" id="mpFilters"></div>
      <input type="file" id="mpFile" accept="audio/*" multiple hidden>
    </div>
    <div class="lang-switch">
      <button class="lang-btn active" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">EN</button>
      <button class="lang-btn" data-lang="ja">日本語</button>
    </div>
  </div>
  <aside class="comms">
    <div class="comms-top">
      <span class="led"></span>
      <h1 data-i18n="commsTitle">通讯器</h1>
      <button class="reset-btn" id="resetBtn" data-i18n="resetBtn">重置</button>
      <button class="menu-btn" id="menuBtn" data-i18n="menu">菜单</button>
    </div>
    <div class="comms-screen" id="commsScreen">
    <div class="view view-contacts" id="viewContacts">
      <div class="view-head" data-i18n="contacts">联 系 人</div>
      <div class="contact-list" id="contactList"></div>
      <button class="contacts-next-day-btn" id="playerNextDayBtn">
        <span data-i18n="nextDay">下一天</span>
      </button>
    </div>
    <div class="view view-chat" id="viewChat" style="display:none;">
        <div class="chat-head">
          <button class="chat-back-btn" id="chatBackBtn" aria-label="返回联系人">‹</button>
          <div class="avatar" id="avatar"></div>
          <div class="head-info">
            <div class="speaker-name" id="spName">— — —</div>
            <div class="speaker-role" id="spRole">— — —</div>
          </div>
        </div>
        <div class="chat-history" id="chatHistory"></div>
        <button class="jump-latest-btn" id="jumpLatestBtn" data-i18n="jumpLatest">↓ 最新消息</button>
        <div class="chat-options" id="chatOptions"></div>
      </div>
      <div class="crt-noise"></div>
      <div class="crt-scan"></div>
      <div class="crt-tear" id="crtTear"></div>
      <div class="crt-vignette"></div>
    </div>
  </aside>
</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>
<div class="debug" id="debug">
  <div>爱: <b id="dbgLove">0</b></div><div>惧: <b id="dbgHorror">0</b></div><div>疑: <b id="dbgParanoid">0</b></div>
  <hr style="border:none;border-top:1px solid #3a1a12;margin:6px 0;">
  <div>日: <b id="dbgDay">1</b></div><div>场景: <b id="dbgScene">ship</b></div>
  <div>节点: <b id="dbgNode">-</b></div><div>视图: <b id="dbgView">contacts</b></div>
  <div>NPC: <b id="dbgNpc">-</b></div><div>成就: <b id="dbgAchv">0</b></div>
</div>

<script>
"use strict";

/* ============================================================
   ★ 全局状态
   ============================================================ */
const state = {
  lang: 'zh',
  love: 0, horror: 0, paranoid: 0, day: 1,
  currentScene: '', activeLayer: 'B',
  view: 'contacts', chatChar: null,
  progress: {}, unlocked: [], history: {}, unread: {},
  selectedNpc: null, submittedForms: {},
  autoSaveCursor: 0, typing: false, typeTimer: null,
  introDone: false, achievements: [],
  dayEntryDone: {}, dialogSession: 0, messageTimer: null,
  visitedNodes: {},
  spaceKilled: false,
  gameCleared: false,
  unlockedArchives: []
};
let userScrolledUp = false;
let isMobileLayout = null;

const SCENES = {
  ship:         { label: '01', cn: '航天器', mode: 'ship'  },
  stationDay:   { label: '02', cn: '白昼',   mode: 'day'   },
  stationDusk:  { label: '03', cn: '晚霞',   mode: 'dusk'  },
  stationNight: { label: '04', cn: '极夜',   mode: 'night' }
};
const DESTINED_NPCS = [
  { id: 'mikazuki', name: '三日月宗近', nameEn: 'Mikazuki Munechika', nameJa: '三日月宗近' },
  { id: 'hasebe',   name: '压切长谷部', nameEn: 'Heshikiri Hasebe',   nameJa: '圧切長谷部' },
  { id: 'ichigo',   name: '一期一振',   nameEn: 'Ichigo Hitofuri',     nameJa: '一期一振' }
];
function npcName(npc) {
  if (!npc) return '';
  if (state.lang === 'en') return npc.nameEn || npc.name;
  if (state.lang === 'ja') return npc.nameJa || npc.name;
  return npc.name;
}

function findDestinedByName(v) {
  return DESTINED_NPCS.find(n => n.name === v || n.nameEn === v || n.nameJa === v) || null;
}
const EFFECT_MULTIPLIERS = {
  konosuke: { love:1, horror:1, paranoid:1 },
  naginata: { love:0.5, horror:2, paranoid:1.5 },
  doudanuki: { love:1, horror:1, paranoid:1.5 },
  mikazuki: { love:1.5, horror:1.5, paranoid:1 },
  hasebe:   { love:1, horror:1.5, paranoid:1.5 },
  ichigo:   { love:2, horror:1.5, paranoid:0.8 }
};

/* ============================================================
   ★ 头像
   ============================================================ */
const AVATAR_PATTERNS = {
  naginata: (c) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <path d="M 18 78 L 50 22 L 82 78 Z" fill="none" stroke="${c}" stroke-width="4"/>
    <path d="M 33 78 L 50 50 L 67 78 Z" fill="${c}" opacity="0.5"/>
    <line x1="50" y1="22" x2="50" y2="12" stroke="${c}" stroke-width="3"/></svg>`,
  doudanuki: (c) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <rect x="22" y="22" width="56" height="56" fill="none" stroke="${c}" stroke-width="4"/>
    <line x1="50" y1="22" x2="50" y2="78" stroke="${c}" stroke-width="3"/>
    <line x1="22" y1="50" x2="78" y2="50" stroke="${c}" stroke-width="3"/></svg>`,
  mikazuki: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <circle cx="50" cy="50" r="38" fill="#f4d03f"/>
    <circle cx="64" cy="48" r="32" fill="#0a0f12"/></svg>`,
  hasebe: () => {
    const cx=50,cy=50,R=32,verts=[];
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;verts.push({x:+(cx+R*Math.cos(a)).toFixed(2),y:+(cy+R*Math.sin(a)).toFixed(2)});}
    let petals='';
    for(let i=0;i<5;i++){const v=verts[i],n=verts[(i+1)%5],p=verts[(i+4)%5];
      const mA={x:+((v.x+n.x)/2).toFixed(2),y:+((v.y+n.y)/2).toFixed(2)};
      const mB={x:+((v.x+p.x)/2).toFixed(2),y:+((v.y+p.y)/2).toFixed(2)};
      petals+=`<polygon points="${v.x},${v.y} ${mA.x},${mA.y} ${cx},${cy} ${mB.x},${mB.y}"/>`;}
    return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#a86cd6" stroke-width="4"/>
      <g fill="none" stroke="#a86cd6" stroke-width="4" stroke-linejoin="round">${petals}</g>
      <circle cx="50" cy="50" r="7" fill="none" stroke="#a86cd6" stroke-width="4"/></svg>`;
  },
  ichigo: () => {
    const color='#7ec8e3';
    function leaf(cx,cy,len,w,rot){
      const hw=w/2,hl=len/2,ctrl=hw*2;
      const outline=`M 0,${-hl} Q ${ctrl},0 0,${hl} Q ${-ctrl},0 0,${-hl} Z`;
      const mainVein=`M 0,${(-hl+2).toFixed(2)} L 0,${(hl-2).toFixed(2)}`;
      let side='';
      for(let i=1;i<=3;i++){const t=i/4;const y=-hl+len*t;const ew=4*hw*t*(1-t);const dx=ew*0.65;const dy=-len*0.06;
        side+=` M 0,${y.toFixed(2)} L ${dx.toFixed(2)},${(y+dy).toFixed(2)} M 0,${y.toFixed(2)} L ${(-dx).toFixed(2)},${(y+dy).toFixed(2)}`;}
      return `<g transform="translate(${cx} ${cy}) rotate(${rot})" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="${outline}"/><path d="${mainVein}"/><path d="${side}"/></g>`;
    }
    return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
      ${leaf(50,37,46,40,0)}${leaf(50,74,32,20,180)}${leaf(28,70,26,16,-135)}${leaf(72,70,26,16,135)}</svg>`;
  },
  konosuke: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0f0a03"/>
    <path d="M20 42 L30 20 L42 36 L58 36 L70 20 L80 42 L80 70 L20 70 Z" fill="none" stroke="#e8b33d" stroke-width="3"/>
    <circle cx="40" cy="50" r="4" fill="#e8b33d"/><circle cx="60" cy="50" r="4" fill="#e8b33d"/>
    <path d="M44 60 Q 50 66 56 60" fill="none" stroke="#e8b33d" stroke-width="2.5"/></svg>`,
  saniwa: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <circle cx="50" cy="38" r="14" fill="none" stroke="#e8b33d" stroke-width="3"/>
    <path d="M 24 78 Q 50 54 76 78" fill="none" stroke="#e8b33d" stroke-width="3"/></svg>`,
  archive: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <rect x="22" y="14" width="56" height="72" fill="none" stroke="#c9a54a" stroke-width="3"/>
    <line x1="32" y1="28" x2="68" y2="28" stroke="#c9a54a" stroke-width="2.5"/>
    <line x1="32" y1="40" x2="68" y2="40" stroke="#c9a54a" stroke-width="2.5"/>
    <line x1="32" y1="52" x2="60" y2="52" stroke="#c9a54a" stroke-width="2.5"/>
    <line x1="32" y1="64" x2="56" y2="64" stroke="#c9a54a" stroke-width="2.5"/>
    <circle cx="70" cy="72" r="8" fill="none" stroke="#c9a54a" stroke-width="2.5"/>

      d3_m3b: { text: '……这真是……在我的意料之外', extra: ['我很想知道，您为何会把我看作与那位等同的存在……我不会打开或关上房门，不会睡觉，甚至无法死亡……充其量也只不过是个和他长着同一张脸的怪物吧？', '……不，既然，您已经这样说过了，那么我也要拿出相应的信任才行。', '不如和我说说关于那位的事吧？那个真正的三日月宗近……？', '他死了。为什么？'],

      d3_m4: { text: '不希望我了解细节吗？嘛，这也是没办法的事。', extra: ['每个人都会有想要永远保密的那么一两件事，对吧？', '嗯，就算杀死他的那个人是您也可以。毕竟，如果不是这样，我也就不会从您的思念中诞生吧。', '是您那浓烈的思念赋予了我生命。这件事没有任何可以被我指摘的。', '至于他，死亡之后……组成这个人的一切都会重新回归自然，变成元素，物质，被风吹走，被水流冲刷，然后……在未来的某一天，也许还会和您重逢吧。', '我的话……稍微要久一点。', '但只要耐心的话，所有的可能性都会变成必然发生的现实。'],
        options: [{ text: '还挺有诗意的', next: 'd3_m5' }] },
      d3_m5: { text: '哈哈……我确实很想了解地球上名为"诗歌"的事物呢。', extra: ['诗意，睡眠，还有死亡，这些事物在我看来都像梦一样。', '我不会做梦', '而梦则像是……索拉里斯的海。', '它是永远无法回到的地方。它孕育了我。', '也许梦也是这样孕育人类的？', '在人类的文化中，在异乡——在不属于自己的地方的人，才是客人，对吗？', '你们才是索拉里斯的客人。'],
        options: [{ text: '你是我心灵的客人', next: 'd3_m6', effect: { love: 1 }, condition: () => visitedNode('naginata','d3_n5b'), archive: 'SOL-T-18-3-2297-1' }, { text: '但你站在我们的观测站里', next: 'd3_m6b' }] },
      d3_m6: { text: '"诗意"就是"不太恰当的修辞"的意思吗？', extra: ['……', '它的意思是，我确实进入了您的内心，是吗？', '这样就好。', '山姥切总是躲着我，同田贯几乎无法沟通：他以为这一切都是需要他战胜的心像，但……', '不是所有东西都一定要分出个输赢的。', '不是所有的困难都需要通过对抗或者战斗才能熬过去的。事情……只是发生了，而它只是需要被发生。', '他们不知道为什么自己需要这些。', '但……你，你不是。', '我不知道应该如何准确描述这种现象，但它让我……感受到了一种久违的感动。', '那是你，而非三日月宗近的感动。'],
        options: [{ text: '这样做，就能让我们互相理解吗？', next: 'd3_m7' }] },
      d3_m6b: { text: '没错，我确实在这里。但我可以随时出现在任何地方。', extra: ['我也在您的心里。', '山姥切总是躲着我，同田贯几乎无法沟通：他以为这一切都是需要他战胜的心像，但……', '不是所有东西都一定要分出个输赢的。', '不是所有的困难都需要通过对抗或者战斗才能熬过去的。事情……只是发生了，而它只是需要被发生。', '他们不知道为什么自己需要这些。', '但……你，你不是。', '我不知道应该如何准确描述这种现象，但它让我……感受到了一种久违的感动。', '那是你，而非三日月宗近的感动。', '我可能……需要离开片刻。'],
        options: [] },
      d3_m7: { text: '不能。', extra: ['没人能互相理解。', '所以我们才会抬头去看那个环绕地球的卫星……叫月亮的那个。', '所以当我们在片刻之间心意互通时，才会那样地欣喜若狂。', '不亚于你们刚刚发现地球之外还有生命存在时的心情。', '但是，与另一个生物交谈真的能够缓解心中的孤独吗？不安呢？悲伤呢？', '哪怕它长得像你生命中的某个至关重要的人？', '但没有人是不可或缺的。三日月宗近不能。我也不能。', '离开了我们的你，还会继续生活，继续活在世界上的某个地方。', '所有人之于所有人，都不过是过客。', '陨石和行星不会互相怨恨，或者互相倾慕。', '这只是幻觉而已……但人类总是被幻觉诓骗。', '请你看看真实的世界吧。', '请你看看……真实的我吧。'],
        options: [] }
    }
  },
  ichigo: {
    name: '一期一振', role: '近侍',
    nodes: {
      d2_i1: { text: '您醒了。', extra: ['一觉睡得还好吗？太空中几乎无法传音，所以要比在地球上还要安静些，', '索拉里斯星系的恒星也要比太阳更亮些。', '由于无法适应太空环境导致的睡眠质量不佳是正常现象。', '您需要的话，我会为您在房间里安装遮光板。'],
        options: [{ text: '一期一振？', next: 'd2_i2', effect: { love: 1 } }, { text: '为什么……', next: 'd2_i2b' }] },
      d2_i2: { text: '是，您有何吩咐呢？', extra: ['是想要我为您取来早餐吗？', '无论何时何事，都请吩咐我吧。毕竟曾经有过照顾弟弟们的经验，这对我来说并不算难事。', '还是我打扰到您的安寝了吗？如果是后者的话，非常抱歉。但您的安全才是第一位的，如果侵犯了您的隐私空间的话，还请您稍微忍耐。'],
        options: [{ text: '……', next: 'd2_i3' }, { text: '想要早餐和早安吻呢', next: 'd2_i3b', effect: { love: 1 } }, { text: '你不是……已经……', next: 'd2_i3c' }] },
      d2_i2b: { text: '为什么……是指？', extra: ['为什么真空中不能传音？', '还是说，您认为只要由我，而非遮光板来做这项工作就好呢？'],
        options: [{ text: '你不是……已经……', next: 'd2_i3c' }, { text: '……', next: 'd2_i3' }] },
      d2_i3: { text: '您想要说些什么吗？', extra: ['抱歉，仅凭现在的我还无法理解其中的深意', '可以请您把它转化为语言，再和我说一遍吗？'],
        options: [{ text: '你已经死了呢', next: 'd2_i4' }, { text: '我不想说', next: 'd2_i4b' }] },
      d2_i3b: { text: '这样啊。', extra: ['请您稍等片刻，我这就为您拿来。', '……', '……', '请您慢用……啊，在那之前，还要加上这个呢。', '……', '好了，这样就应该完成了。请细嚼慢咽。'],
        options: [{ text: '只是额头吗', next: 'd2_i4c', effect: { love: 1 } }, { text: '还要继续留在这里吗', next: 'd2_i4d' }] },
      d2_i3c: { text: '我……已经……？', extra: ['我已经来到了您的身边。', '您只要知道这一点就好。请不要让其他的事情干扰您的思绪。'],
        options: [{ text: '你……已经死了', next: 'd2_i4', effect: { horror: 1 } }, { text: '你让我很不安', next: 'd2_i4b' }] },
      d2_i4: { text: '我……确实已经死去了。', extra: ['在您面前的，不是大阪城焚毁时一同消逝的一期一振，也不是在本丸里被唤醒的那把太刀。这已经是我的第二次死亡了。', '但是，我还依然存在。我可以呼吸，牵起您的手，端详您可爱的睡颜，那么我应当还存活在这个世上。我还能继续侍奉您、爱您。', '既然死去了一次的我能够被您承认，那么……', '这样的我，也会被温柔的您爱着，不是吗？', '请您……不要让我为此动摇。'],
        options: [{ text: '……你永远也不会是他', next: 'd2_i5', effect: { paranoid: 2 } }, { text: '……我无法否认', next: 'd2_i5b', effect: { love: 1 } }] },
      d2_i4b: { text: '这样啊。', extra: ['这也是没办法的事呢。', '但是，在这里，您也只能依赖我了吧？', '外面的那些政府刀也好，时政和狐之助也好，他们……都有可能暗藏着某种不可告人的企图吧？这样的话，不就只能由我为您分忧了吗？', '您只要知道我会永远爱着您、永远不会背叛您就好。', '其他的事情，不需要过多考虑吧？'],
        options: [{ text: '果然还是太可疑了', next: 'd2_i5', effect: { paranoid: 1 } }, { text: '嗯。毕竟你是我的近侍啊', next: 'd2_i5b', effect: { love: 1 } }] },
      d2_i4c: { text: '我明白了。', extra: ['请允许我更进一步吧。', '……', '……', '您认为，做到这种程度如何呢？'],
        options: [{ text: '比我想象得要更加大胆呢', next: 'd2_i5b', effect: { love: 1 } }, { text: '放肆到我以为你不认可我是你的主君呢', next: 'd2_i5', effect: { paranoid: 1 } }] },
      d2_i4d: { text: '您不希望我继续留下来吗？', extra: ['还是说，终于对我感到厌烦了呢？', '但是……不行哦。', '请您，不要，离开，我。', '这是我唯一的请求。'],
        options: [{ text: '好恶心……', next: 'd2_i5', effect: { paranoid: 1 } }, { text: '知道了', next: 'd2_i5b' }] },
      d2_i5: { text: '您这样说就太令人伤心了。', extra: ['……啊，虽然看起来没什么变化，但我确实在真心实意地难过哦？', '私以为，主人还不够信任我对您的爱的程度。', '这样的话，就必须用行动证明才行吧？'],
        options: [{ text: '我要出去，别跟过来', next: 'd2_i6' }] },
      d2_i5b: { text: '能听到您这样说真的太好了。', extra: ['我有在微笑吗？真希望现在正在用最动人的笑颜回应您。', '既然这样，那就更应该用全身心来侍奉和照料您呢。'],
        options: [{ text: '我要出门一会，可以在这里等着我吗？', next: 'd2_i6' }, { text: '要一起出门吗？', next: 'd2_i6b', effect: { love: 1 } }] },
      d2_i6: { text: '请务必让我随行。', extra: ['您真的信得过那两名政府人士吗？', '果然，还是和知根知底的近侍一同行动更加安全吧？', '作为天下一振，我绝对会确保您的安全。'],
        options: [{ text: '……就算拒绝的话，你也会自己跟上来吧', next: 'd2_i7', effect: { love: 1 } }] },
      d2_i6b: { text: '请务必让我随行。', extra: ['恕我直言……那两名政府人士似乎更为可疑呢。', '果然，还是和知根知底的近侍一同行动更加安全吧？', '作为天下一振，我绝对会确保您的安全。'],
        options: [{ text: '知道了……要穿好太空服哦', next: 'd2_i7' }] },
      d2_i7: { text: '是，我会尽可能不给您添麻烦的。', extra: ['……', '啊，解开了呢，衣服。', '……', '好，这样就没问题了。'],
        options: [{ text: '人类的衣服……不该是这样的……', next: 'd2_i8', effect: { paranoid: 1 } }, { text: '（什么也不说）', next: 'd2_i8b' }] },
      d2_i8: { text: '是这样啊。看来，我做得还远不够好。', extra: ['感谢您告知我这么重要的事。', '我会继续努力，让自己看上去更加优秀、让您因为是我的所有者而骄傲。', '那么，现在您要去哪里呢？'],
        options: [{ text: '跟着我走吧', next: 'd2_i9' }] },
      d2_i8b: { text: '还好，有过照料弟弟们吃穿的经验，完成这个也算不上困难呢。', extra: ['啊。既然眼前只有您，那么只要去思考您的事情就可以了，对吧？', '弟弟们也到了需要尝试生活自理的年龄了。', '那么，现在您要去哪里呢？'],
        options: [{ text: '跟着我走吧', next: 'd2_i9' }] },
      d2_i9: { text: '好的。请不要松开我的手。', extra: ['这就是观测站内部吗？很宽敞呢。', '……', '好像之前来过这里了。', '……', '那边是冷藏库吧？不，什么都没有。您最好不要过去呢。', '……', '啊，要到外太空作业吗？请注意缆绳是否牢靠……打开闸门时也请不要站在边缘地带……'],
        options: [
          { text: '（划破一期一振的太空服）', next: 'd2_i10', effect: { paranoid: 1, horror: 1 }, action: 'markSpaceKilled', archive: 'SOL-T-1-1-2300-1' },
          { text: '（和一期一振完成外太空作业）', next: null, effect: { love: 1 }, action: 'markSpaceSurvived', archive: 'SOL-T-8-7-2305-2' }
        ] },
      d2_i10: { text: '主人！似乎有哪里在漏气……', extra: ['……', '啊。', '您还是不愿意相信我吗？', '……', '要向着宇宙深处越飘越远了呢。', '……真希望您一切安好……'],
        options: [] },
      d2_i11: { text: '主人。', extra: ['……', '……', '……'],
        options: [{ text: '呃……', next: 'd2_i12' }, { text: '（尝试逃离）', next: 'd2_i12b', effect: { paranoid: 1 } }] },
      d2_i12: { text: '您认不出我了吗？', extra: ['……', '您在发抖呢。', '您不想见到我吗？', '我有那么可怕吗，主人？', '毕竟是我们的私事，让外人看到、闹了笑话就不好了。请和我回房吧。'],
        options: [{ text: '……', next: 'd2_i13' }] },
      d2_i12b: { text: '您认不出我了吗？', extra: ['……', '您在发抖呢。', '……好可爱……', '不想见到我吗？', '让人好伤心啊，被最珍重的人这样看着。', '那么，毕竟是我们的私事，让外人看到、闹了笑话就不好了。请和我回房吧。'],
        options: [{ text: '……', next: 'd2_i13' }] },
      d2_i13: { text: '怎么了？难道您真的在害怕吗？', extra: ['我是永远不会伤害您，或者做让您不喜欢的事情的。', '无论何时，您都是我的主人呢。', '如果我因为您的态度发生改变，就要收回对您的爱的话，这样的爱也算不上什么稀罕物吧？', '但就算爱意不变，也希望您能留在我的身边。'],
        options: [{ text: '……', next: 'd2_i14' }, { text: '为什么要做到这个地步', next: 'd2_i14b' }] },
      d2_i14: { text: '您还是不愿意说话吗？', extra: ['真伤脑筋啊。', '我不会做令您感到不快的事，也不会逼迫您给出任何答复。', '但我依然想要知道，您究竟能否……', '能否对我、对这个可悲的存在，施以慈悲与爱呢？', '啊。真是完全不像样的发言。'],
        options: [{ text: '……', next: 'd2_i15' }, { text: '我知道了', next: 'd2_i15' }] },
      d2_i14b: { text: '就算您这样问……又想要得到什么样的回答呢？', extra: ['我……是和其他刀剑都不太一样的存在，这一点您也是知道的吧？', '所以，死去也好，成为拥有生前记忆的外星生命体也好，我都能轻易接受哦。', '也许那个幸运到与您结缘的我……那个一期一振，也许也是同样的存在，只是您永远地错过了和他互诉衷肠的时机。', '至于我……抱歉，比起真的替那个一期一振感到悲伤，首先涌上来的情绪是"窃喜"呢。', '我真是个卑劣的人，对吧？'],
        options: [{ text: '并没有哦', next: 'd2_i15' }, { text: '确实如此呢', next: 'd2_i15' }] },
      d2_i15: { text: '……', extra: ['请您陪我多待一会儿吧。', '只要……片刻……就好……', '……', '……'],
        options: [], endScene: 'stationNight' },
      d3_i1: { text: '您醒了。', extra: ['嗯……虽然赖床没什么不好，但您果然还是在装睡吧？', '弟弟们偶尔也会为了逃开训练而作出类似的事……', '抱歉，又在不自觉地沿用那些从未经历过的记忆了。', '您很反感类似的行为，所以我会尽可能不去做类似的事的。'],
        options: [{ text: '这是你最真实的表现，没必要为它道歉', next: 'd3_i2', effect: { love: 1 } }, { text: '你应该牢牢记住你和他的差异', next: 'd3_i2b', effect: { paranoid: 1 } }] },
      d3_i2: { text: '这样啊。您对仿冒品也相当宽容呢。', extra: ['如果那个一期一振知道了您的真实想法，说不定也会为之欣喜呢。', '毕竟，我们都一样窃取了前一个一期一振的人生。', '……', '我们都一样做了相当卑劣的事情。', '那个一期一振也会像我一样不安吗？还是说，他会表面上一切如常，背地里却深深地被负罪感侵蚀呢？', '……我想，您的记忆和感受已经在相当一部分程度上接近真实了。', '您眼中的我……一期一振，原来就是这个样子。'],
        options: [{ text: '任何存在的事物都只是它本身，而非任何其他事物的仿品', next: 'd3_i3' }] },
      d3_i2b: { text: '我会的。', extra: ['如果那个一期一振知道了您的真实想法……他又会有怎样的感受呢？', '毕竟，我们都一样窃取了前一个一期一振的人生。', '……', '我们都一样做了相当卑劣的事情。', '您的爱，似乎会对他造成毁灭性的影响。', '这就是 为什么他选择了死亡吗？'],
        options: [{ text: '你怎么敢这样说他', next: 'd3_i3b' }] },
      d3_i3: { text: '是这样吗……？', extra: ['您在日常生活中，有没有过认为自己并不像其他人口中所说的那样优秀，觉得自己正在被自己"冒名顶替"了呢？', '您有没有过突然地认为自己不属于当下的环境……就像自己突然从梦中醒来，却完全不记得现实中的身份和过往呢？', '到底哪一边才是梦境呢？', '这样想着的时候，已经不自觉地仿照这个世界的"我"说出了那样的言语，作出行动，为了他人的印象而活……', '这样的我，还是我自己吗？'],
        options: [{ text: '如果实在害怕的话，就试着扮作已经不怕的样子，然后骗过自己吧', next: 'd3_i4' }, { text: '你需要为自己的选择负责', next: 'd3_i4b' }] },
      d3_i3b: { text: '是您先这样说的，不是吗？', extra: ['我只是在提醒您，这件事还有另一个角度而已。', '接受真相会让您感到不快吗？', '还是您认为自己的某些真实想法被戳破了，因此感到恼怒呢？', '您难道不认为，他的死亡也有您的一部分责任吗？'],
        options: [{ text: '……', next: 'd3_i4' }, { text: '他需要为自己的选择负责', next: 'd3_i4b' }] },

      d2_n5b: { text: 'I read your personal status assessment results—I told you I would, did I not?',
        extra: [
          'As this concerns one with whom you will live long-term, and you are a Saniwa, I studied that report carefully. The subject\'s physiological indicators were within recording parameters; misreading is essentially impossible.',
          'My preliminary conclusion is that you truly care for {partner}, whether or not you wrote it on the questionnaire.',
          'I must remind you: though you saw him, touched him—the fact remains that {partner} has already been… scrapped. You and I both know it.',
          'If I truly cared for you, I should say this plainly and tell you—'
        ],
        options: [{ text: 'So… it was all just my imagination?' }, { text: 'But he was so real…' }] },
      d2_n6: { text: 'It is real. They are this place—the planet beneath our feet. Solaris.',
        extra: [
          'Everyone has someone they most wish to see. Solaris has read this from you.',
          'It came to know you in your sleep, then created an individual capable of communicating with you. Someone you think of day and night.',
          'I call them "guests," for they visited this station without permission.',
          'You are not insane, nor have you inhaled any hallucinogen. That is the plain truth.',
          '…',
          '…The sound appears to be coming from the door.',
          'Who is in your room?'
        ],
        options: [{ text: 'Who…?' }] },
      d2_n6b: { text: '……',
        extra: ['…Wait.', '…The sound appears to be coming from the door.', 'Who is in your room?'],
        options: [{ text: 'Who…?' }] },
      d3_n1: { text: 'You are awake.',
        extra: [
          'To think you would contact me first, and not {partner}. That is surprising.',
          'No other meaning—but since you are here, I may as well inform you:',
          'Doudanuki and I have discussed it. We intend to fire several beams at the surface of Solaris.',
          'We simply cannot endure it any longer… In short, the research has reached an impasse. This is the best course. Perhaps the beams will make the planet realize that some are suffering because of it.'
        ],
        options: [{ text: 'That… absolutely not!' }, { text: 'Is there no other way?' }] },
      d3_n1c: { text: 'Absolutely not? My apologies—allow me to reiterate: we are Touken Danshi in service of the Government of the Time. We answer to it; we are supervised by it. Strictly speaking, you have no right to interfere with our actions.',
        extra: ['However, since you have expressed yourself so vehemently, I may as well hear your thoughts.'],
        options: [
          { text: 'How is that any different from killing {partner}?' },
          { text: 'How is that any different from killing {partner}?' },
          { text: 'Is there no other way to make this planet hear our feelings?' }
        ] },
      d3_n1b: { text: 'There is none.',
        extra: ['Let me reiterate: we are Touken Danshi in service of the Government of the Time. We answer to it; we are supervised by it. Strictly speaking, you have no right to interfere with our actions.'],
        options: [
          { text: 'How is that any different from killing {partner}?' },
          { text: 'How is that any different from killing {partner}?' },
          { text: 'Is there truly no other way to make this planet hear our feelings?' }
        ] },
      d3_n2: { text: 'I know. You are very kind—you cannot bear to do it, or you simply do not think such a thing is worth dirtying your hands over. We are not.',
        extra: [
          'Do you know that the Government has been cutting the station\'s budget year after year?',
          'Do you know what kind of environment you were sent into? I thought you were playing the fool—I did not expect that you genuinely knew nothing at all.',
          'I killed the previous Saniwa.',
          'Konosuke knows every detail. Doudanuki knows but will not admit it—ha! He does not even dare to warn you.',
          'You have not yet seen the body storage, have you? Had you gone there on the first day, I might have disposed of you as well.',
          '…Heh. "Disposal." It sounds clean, orderly, efficient. But true death is always filthy. In the freezer you will see a mess—intestines spilled out, and the wide-open eyes of the one who died.',
          'But now, he is nothing more than a lump of frozen meat.'
        ],
        options: [{ text: 'Are Tsukumogami not all set to be "unable to harm humans"?' }, { text: 'Why?' }] },
      d3_n2b: { text: 'Having killed them once yourself—do you have the right to say that? You are just like us. You are crueler than you believe yourself to be.',
        extra: [
          'Do you know that the Government has been cutting the station\'s budget year after year?',
          'Do you know what kind of environment you were sent into? I thought you were playing the fool—I did not expect that you genuinely knew nothing at all.',
          'I killed the previous Saniwa.',
          'Konosuke knows every detail. Doudanuki knows but will not admit it—ha! He does not even dare to warn you.',
          'You have not yet seen the body storage, have you? Had you gone there on the first day, I might have disposed of you as well.',
          '…Heh. "Disposal." It sounds clean, orderly, efficient. But true death is always filthy. In the freezer you will see a mess—intestines spilled out, and the wide-open eyes of the one who died.',
          'But now, he is nothing more than a lump of frozen meat.'
        ],
        options: [{ text: 'Are Tsukumogami not all set to be "unable to harm humans"?' }, { text: 'Why?' }] },
      d3_n2c: { text: 'I said there is none.',
        options: [{ text: 'Could we not… for instance, transmit my brainwaves?' }] },
      d3_n3: { text: 'True. But do not underestimate a Tsukumogami who harbors resentment toward humans.',
        extra: ['I cannot help but wonder—if it ever became truly necessary, what would be my odds of succeeding against you…? Probably quite high.'],
        options: [{ text: 'Why did you kill him?' }] },
      d3_n3b: { text: '…He did many unforgivable things.',
        options: [{ text: 'Related to your "guest"?' }] },
      d3_n3c: { text: '……', extra: ['……'],
        options: [{ text: 'Is that not allowed?' }] },
      d3_n4: { text: 'You are perceptive.',
        extra: [
          'It was Yamanbagiri Kunihiro. My guest.',
          'Strange, is it not? The one I care about most turns out to be that counterfeit. When I first arrived here, and saw him…',
          'I felt as though… "Ah—what a relief." Something like that.',
          'Can you imagine it? As the captain of a special-operations squad, dispatched to an alien world after your entire unit was wiped out, and then you see the one who sacrificed himself to save your life? The one you always mocked and derided… Everything floods you at once—your blood runs cold and hot by turns.',
          'He must be laughing at me from heaven, if such a place exists. I do not much believe in such a place, but…',
          'This life has been harder to bear than I imagined. If I did not occupy myself with idle thoughts, I doubt I would have lasted this long.',
          '…Haha. How ridiculous.',
          'So, you can roughly understand how I felt when I saw that bastard using him for his experiments, can you not?',
          'Kunihiro… just like back then—even when the pain was enough to make him want to scream, he was still comforting me.',
          '"It is all right. Just endure it a little. Like that time. When you wake up, everything will be better."',
          '…',
          'I never imagined it would be him. I have thought many times since—if I had paid a little more attention to the other Tsukumogami, would it not have been him lying there?',
          'What a repulsive thought.',
          'Well. The story ends here.'
        ],
        options: [{ text: 'I do not think I should comment on this.' }, { text: 'Could you tell me more about him?' }] },
      d3_n4b: { text: 'No—this is theoretically feasible.',
        extra: ['…Quite feasible.', 'If this course of action yields no result, we will still fire at the sea.'],
        options: [{ text: 'I understand. Thank you.' }] },
      d3_n5: { text: 'You are right.',
        options: [{ text: 'Is there truly no other way to make this planet hear our feelings?' }] },
      d3_n5b: { text: '…If your moral compass has degraded to the point of allowing you to thank a murderer, then by all means.',
        extra: ['I will transmit the brainwaves shortly. You may come by again later—right now, I have work to attend to.'],
        options: [] },
      d3_n5c: { text: 'What is there to say about that one…?',
        extra: [
          '…',
          'He would buy oden while the squad was on stakeout. Once he was exposed simply because it was so cold that the oden gave off steam—the target spotted him easily… He ended up writing a very long self-criticism.',
          'He would also collect the sour powder from the surface of gummy candies and eat it… Is that not sour? Even now I do not understand the reason. If asked, he would surely say something like, "This suits a counterfeit like me best, anyway."',
          'To this day I have never figured out what he meant by it. But sometimes I, too, spend credits on a few packets to taste.',
          'The flavor is mediocre—not as good as I imagined. Far too sour.'
        ],
        options: [{ text: 'He sounds like a very endearing child.' }] },
      d3_n6: { text: 'You have come.',
        extra: [
          'What I wished to say is this… after we transmitted your brainwaves to the surface of Solaris, the planet has been changing at an astonishing rate…',
          'Land has appeared upon its surface…',
          'Gas has begun to erupt from the sea; the water seems to boil, bubbling up in a churning froth.',
          'And the islands left behind by the receding tides… bear a striking resemblance to terrestrial landscapes. That is what the exploration unit that landed on the surface has reported.'
        ],
        options: [{ text: 'This is… truly incredible.' }] },
      d3_n7: { text: 'I believe this achievement is enough to silence those well-fed officials in the Government who do nothing but occupy their posts.',
        extra: [
          '…Your condition is not good.',
          'Who was it? Doudanuki? Or those guests? What did they say to you?',
          'In my view, you also need to return to Earth. You should rest for a time at a sanatorium where you can see the sea.',
          'The Touken Danshi of the Honmaru must be hoping greatly to see you again.',
          'Return. Return to your homeland.',
          '…Doudanuki and I no longer have any reason to return. We will remain here.',
          'Once the project concludes, no further food or water will be delivered.'
        ],
        options: [{ text: 'You should come with me.' }, { text: '…Very well.' }] },
      d3_n8: { text: 'Mm. You will be safe.',
        extra: ['Safe travels.', 'And forget all of this.', 'Set out first thing tomorrow morning.'],
        options: [] },
      d3_n8b: { text: 'You have my thanks for the offer. But neither he nor I wish to return to that false world.',
        extra: ['This place is fine.', 'It is enough to be our final resting place.', 'Set out first thing tomorrow morning.'],
        options: [] }
    }
  },
  doudanuki: {
    name: 'Doudanuki Masakuni', role: 'Uchigatana',
    nodes: {
      d1_t1: { text: 'I\'m Doudanuki Masakuni. Let\'s skip the pleasantries.',
        extra: ['You\'ve already met Yamanbagiri, haven\'t you?'],
        options: [{ text: 'I have.' }, { text: 'I haven\'t gone to see him yet.' }] },
      d1_t2: { text: 'Not the easiest to talk to, is he? That\'s just how he is.',
        extra: ['If I were you, I\'d be a bit more careful with him. After all...', 'Everyone here is a little...', 'Well, never mind. You don\'t know yet. Go experience it for yourself.'],
        options: [{ text: 'Experience what?' }, { text: 'He\'s worse than I imagined.' }] },
      d1_t2b: { text: 'Then you\'d better go have a word with him.',
        extra: [
          'Before he became a government worker, he went through some pretty rough things... He doesn\'t much like Saniwa, but he\'s not a bad sort at heart.',
          'He\'s the cat-like type. If you make him angry, Yamanbagiri will give your hand a real hard bite.',
          '...And if you treat him well, he might... just... give it... a gentle little nibble... gently...'
        ],
        options: [
          { text: 'How bad could it be?' },
          { text: 'Fine. I\'ll go.' },
          { text: 'I don\'t want to know. That has nothing to do with me.' }
        ] },
      d1_t3: { text: 'About this place—anything, really. I think you\'d better experience it yourself first, then hear it from me. That\'ll make it easier to understand.',
        extra: ['Don\'t worry, it won\'t hurt you or put your life in danger... at least, there\'s been no such case so far.', 'I should get back to work. See you.'],
        options: [{ text: 'All right. See you.' }] },
      d1_t3b: { text: 'This is Yamanbagiri\'s private business. Without his permission, I shouldn\'t say too much.',
        extra: [
          'Uh—if you need me, I\'m usually at the gym or the maintenance center.',
          'You just got here, so you must be tired. There\'s nothing for you to worry about today. If you\'re tired, rest.',
          'Oh—I mean that literally. I\'m not great at socializing. This model\'s a practical mass-produced work type—nothing like an all-purpose type like Yamanbagiri...',
          'Ah! That didn\'t mean anything else either. I really should go.'
        ],
        options: [{ text: 'Thanks.' }] },
      d1_t3c: { text: '...I don\'t think I have anything else to say.',
        options: [] },
      d2_t0: { text: 'No response to the communication request.', options: [] },
      d2_t1: { text: 'Are you all right? I just heard quite a commotion, but Yamanbagiri told me not to go near your room.',
        extra: [
          'I mean it—is everything all right on your end?',
          'If you need, I\'ll request a professional ship\'s doctor to connect to the station\'s comms right away. The ones in that role aren\'t usually human, but...',
          'They\'re all skilled at treating everything from common ailments to complicated conditions.'
        ],
        options: [{ text: 'I\'m fine. Thanks for worrying about me.' }, { text: 'I thought I wouldn\'t see you again today, Mr. Fitness.' }] },
      d2_t2: { text: 'That\'s a relief.',
        extra: [
          'Yamanbagiri told me—your "guest" is {partner}?',
          'That\'s rather... I can\'t say whether it\'s rare or common, but at least the Saniwa guests I\'ve seen have all appeared in human form.',
          'Not many people take Touken Danshi this seriously. Of course, that\'s good news for me too.',
          'Is {partner} still over there with you?'
        ],
        options: [{ text: 'He\'s asleep. Right beside me.' }] },
      d2_t2b: { text: 'But I showed up anyway!',
        extra: [
          'I asked because I genuinely worried about you.',
          'I do care about muscles—but that\'s because I want my existence to be useful to humans in some way.',
          'But swords in space? Haha... we\'re not filming Jedi, are we?',
          'I heard from Yamanbagiri—your "guest" is {partner}?',
          'That\'s rather... I can\'t say whether it\'s rare or common, but at least the Saniwa guests I\'ve seen have all appeared in human form.',
          'Not many people take Touken Danshi this seriously... I mean, if only every Saniwa were like you.',
          '...I didn\'t mean anything else by that. I really do think so.',
          'Is {partner} still over there?'
        ],
        options: [{ text: 'He\'s asleep. Right beside me.' }] },
      d2_t3: { text: 'I see.',
        extra: [
          'Then I won\'t come over. Not that I\'m worried about disturbing his sleep—you should know this by now, right? "Guests" don\'t sleep. They don\'t rest, they don\'t eat. Everything they do is learning from and imitating you.',
          'That\'s the result of me and Yamanbagiri\'s experiments. This planet\'s magnetic field is strange—it even orbits two stars.',
          'Doesn\'t quite fit the physics we know, does it?',
          'I don\'t know if it\'s the magnetic field or something else... Yamanbagiri and I haven\'t entered dormancy for a long time.',
          'Oh—Yamanbagiri just told me... the reason he told me not to come over is that your room door was destroyed by {partner}?',
          'I hope you\'ve found some kind of curtain to cover it.'
        ],
        options: [
          { text: 'Of course. Also—{partner}\'s recovery speed is abnormally fast. I\'m a little worried...' },
          { text: 'Are you worried you might accidentally walk in on me changing?' }
        ] },
      d2_t4: { text: 'Nothing to worry about. They heal from any wound remarkably fast.',
        extra: ['Sometimes faster than you can imagine.'],
        options: [{ text: 'I don\'t like how that makes me feel.' }, { text: 'What are you doing to them... to your guests?' }] },
      d2_t4b: { text: 'Me? I don\'t have a habit of peeking around.',
        extra: [
          'Besides, my former master often played with other Touken Danshi.',
          '...Or rather—she, I mean, my former master never saw Touken Danshi as equals.',
          'I was just her... plaything. And a mass-produced model at that. Yeah.',
          'Starting from the very beginning of how I ended up working here would take too long, wouldn\'t it?',
          'Anyway, I don\'t want to give you some stock line like "please trust my character"—but first, I don\'t believe humans and Touken Danshi are equals. Second, I don\'t believe I have any gender. My identity, personality, and appearance were all designed to make me serve humans better...'
        ],
        options: [
          { text: 'You don\'t have to grind yourself down into the dust.' },
          { text: 'It\'s best that you think that way. Saniwa and Tsukumogami are fundamentally different.' }
        ] },
      d2_t5: { text: 'They just cry out like real people do.',
        extra: [
          'They\'re aliens—guests—a kind of... Yamanbagiri told me the word... wait, I\'ll remember in a second...',
          'Neutrinos! They\'re neutrino lifeforms.',
          'We experiment on them. Everything you know comes from our experimental results.',
          'Aside from hypoxia, burning, freezing, and other conventional physical methods, disease and fungal/bacterial infections are also a major focus. My favorite was... never mind. Yamanbagiri told me not to tell you the details here.',
          'It\'s a necessary sacrifice for the continuation of Solaristics.',
          'People who treat them the way you do are the minority.'
        ],
        options: [
          { text: 'Maybe I\'m more cruel than you think—but the Doudanuki Masakuni I know wouldn\'t do such things.' },
          { text: 'I can\'t bring myself to be cruel to someone whose every gesture is exactly like {partner}\'s.' }
        ] },
      d2_t5b: { text: 'Yeah. I don\'t have that need.',
        extra: [
          'It\'s just that if I didn\'t do it, my former master would have had me scrapped. That\'s all.',
          '...I\'m saying selfish things again, aren\'t I? Sorry.',
          'Let\'s get back on topic. I watched the footage—{partner} tore your room door open, covered in blood. A real mess, wasn\'t it?'
        ],
        options: [{ text: 'The external wounds have healed, but I\'m still a little worried...' }] },
      d2_t5c: { text: 'That\'s right. I\'ll keep that in mind.',
        extra: ['...I don\'t think I have anything else to say.', 'I\'ll go do another set of strength training.', 'Leave the daily work to me and Yamanbagiri Chougi. You can rest whenever you like.'],
        options: [{ text: '...Are you angry?' }] },
      d2_t6: { text: 'I...',
        extra: [
          'Uh...',
          'Forget it. You only know one Doudanuki—the one who happened to be lucky.',
          'Maybe in that kind of environment, he just became very... soft?',
          'Maybe his true nature is just as cruel as mine—able to cut off an enemy\'s head or an experimental subject\'s at any moment?',
          'In the end, how much do you really know about the real me?',
          'About this me—the one standing in front of you, not some mass-produced Doudanuki stacked in a transport vehicle.',
          '...',
          'I\'m sorry. I shouldn\'t have taken it out on you. You\'re innocent.',
          'I\'ll go do another set of strength training. Oh—your main job is to complete the personal assessment forms and keep observing your own "guest." That\'s all.',
          'Leave the daily work to me and Yamanbagiri Chougi. You can rest whenever you like.'
        ],
        options: [] },
      d2_t6b: { text: 'As I thought—{partner} is more suited to being loved than me, aren\'t they?',
        extra: [
          'Even if it\'s some completely unrelated alien lifeform, as long as its face and behavior resemble that person, it can be loved.',
          'Spending time and effort on a cheap, convenient mass-produced model like me is just stupid, isn\'t it?',
          '...',
          'I\'m sorry. I shouldn\'t have taken it out on you. You\'re innocent.',
          'I\'ll go do another set of strength training. Oh—your main job is to complete the personal assessment forms and keep observing your own "guest." That\'s all.',
          'Leave the daily work to me and Yamanbagiri Chougi. You can rest whenever you like.'
        ],
        options: [] },
      d3_t1: { text: 'Yamanbagiri seems to be looking for you. Aren\'t you going to talk to him?',
        options: [{ text: 'I don\'t really want to.' }, { text: 'Maybe later.' }] },
      d3_t2: { text: 'I see.',
        extra: ['Then—how about talking with me?', 'I\'m a rough sort, but I\'m a rough sort who can keep a secret.', 'Still troubled over {partner}?'],
        options: [{ text: 'How did you know?' }, { text: 'I can\'t really say.' }] },
      d3_t3: { text: 'I just do.',
        extra: [
          'Or rather—you\'re easy to read.',
          'Tell me, what kind of person is he?',
          'Complicated, or easy to understand? Clingy, or the type who sees everything but says nothing?',
          'Every model of Touken Danshi has a core factory setting. Of course, how they actually turn out varies—maybe an experimenter added two extra drops of buffer during cell culture, or maybe a simulated backdrop collapsed at the wrong moment... But the vast majority of Tsukumogami stably express the genes they were preset with.',
          'But occasionally... they undergo anomalies, and many Saniwa don\'t send them off for disposal over it.',
          'What\'s your attendant like?'
        ],
        options: [{ text: 'It\'s hard for me to define him.' }, { text: 'He\'s a willful one.' }] },
      d3_t3b: { text: 'I see. It\'s fine—I have trouble putting my own feelings into words too. Like a savage who can\'t read a clock face to tell the time.',
        extra: [
          'I can\'t even say what time this body thinks it is.',
          'How about telling me what kind of person {partner} was instead?',
          'Complicated, or easy to understand? Clingy, or the type who sees everything but says nothing?',
          'Most Touken Danshi of the same model are indistinguishable.',
          'But occasionally... they undergo anomalies, for reasons our current methods can\'t investigate.',
          'What\'s your attendant like?'
        ],
        options: [{ text: 'It\'s hard for me to define him.' }, { text: 'He\'s a willful one.' }] },
      d3_t4: { text: 'I see. I think that\'s a good thing?',
        extra: [
          'Especially for those of us who have to live according to the Standard Touken Danshi Conduct Guide... I mean, for Tsukumogami—meeting a master who doesn\'t expect you to be "like the others" is a stroke of luck.',
          'I can\'t imagine that kind of life at all.',
          'Can you imagine a world that never went through the Renaissance or the Industrial Revolution?',
          'It\'s probably something like that.'
        ],
        options: [{ text: 'Are you satisfied with your current life?' }] },
      d3_t4b: { text: 'That\'s because he was lucky enough to have a master willing to indulge him.',
        extra: [
          'For those of us who have to live according to the Standard Touken Danshi Conduct Guide... I mean, for Tsukumogami—meeting a master who doesn\'t expect you to be "like the others" is a stroke of luck.',
          'I can\'t imagine that kind of life at all.',
          'Can you imagine a world that never went through the Renaissance or the Industrial Revolution?',
          'It\'s probably something like that.'
        ],
        options: [{ text: 'Are you satisfied with your current life?' }] },
      d3_t5: { text: 'What do you think?',
        extra: [
          'I mean—of course not. But there\'s no other way.',
          'At least I\'m still alive. As for the rest—I don\'t want to think about it.',
          'Yamanbagiri wants to fire a laser at that sea.',
          'He\'s actually quite dedicated, isn\'t he? Even though he\'s always saying this is a pain and that\'s exhausting.',
          'He clearly wants to see Kunihiro again too...',
          'Ah! I let that slip...'
        ],
        options: [{ text: 'Who is your "guest"?' }] },
      d3_t6: { text: 'It\'s... my previous master.',
        extra: [
          'I... was afraid, so I ran.',
          'I was terrified of her. Afraid she\'d fly into a rage and demand I keep serving her with all my heart—and yet I desperately wanted to hear her acknowledge me, to say I was a good, useful sword.',
          'I waited the whole time for her to say that to me.',
          'But all I ever heard were curses too foul to repeat.'
        ],
        options: [
          { text: 'You are a good, useful sword, Doudanuki Masakuni.' },
          { text: 'Your sense of service really is lacking.' },
          { text: 'You can be more than just a sword.' }
        ] },
      d3_t7: { text: '...',
        extra: ['Thanks for saying that.', 'I—I still have things to do. Like... watering the plants?', 'I have to go!'],
        options: [] },
      d3_t7b: { text: '...',
        extra: ['That\'s true.', 'Ah—is Yamanbagiri calling for you? I have other things to do too.'],
        options: [] }
    }
  },
  hasebe: {
    name: 'Heshikiri Hasebe', role: 'Attendant',
    nodes: {
      d2_b1: { text: 'You are awake, Master.',
        extra: ['Did you sleep well?', 'Ah—forgive me for entering your room without permission. Please overlook it.', 'But I am your attendant, after all. It is only proper that I guard my sleeping master\'s safety.'],
        options: [{ text: 'Who is it?' }, { text: 'Hasebe?' }] },
      d2_b2: { text: 'It is I.',
        extra: ['Your attendant.', 'Your favorite Tsukumogami, your most loyal subordinate, your most handy blade. Your tool, your pet, and... of course, your one and only attendant, forever.'],
        options: [{ text: 'What? But...' }] },
      d2_b2b: { text: 'Yes. It is I.',
        extra: ['I, Hasebe, have followed you here.', 'Do you like this surprise, Master?'],
        options: [{ text: 'But...' }, { text: 'This cannot be...' }] },
      d2_b3: { text: 'But?',
        extra: ['Why do you draw your hand away?', 'You look pale—have you caught a chill? Thank goodness I am here, at your side, able to tend to you so closely.', 'Ah—you did not bring indoor slippers? In your luggage...'],
        options: [{ text: 'Leave them alone.' }, { text: 'Why are you here?' }] },
      d2_b3b: { text: 'Whatever my master desires, I, Hasebe, will do my utmost to accomplish.',
        extra: ['Even if it means coming to space.', 'You look pale—I shall fetch your shoes.', 'Ah—you did not bring indoor slippers? In your luggage...'],
        options: [{ text: 'Leave them alone.' }, { text: 'Why are you here?' }] },
      d2_b4: { text: 'Forgive me, but my master\'s body comes first. Please allow me to handle this for you.',
        extra: ['Your luggage is quite light—did you leave in a hurry?', 'I shall report to the system later; the supply requests will need revising...', 'Hm? You even brought a photograph...', 'This is...', '...', 'This is me.'],
        options: [{ text: 'You look surprised.' }] },
      d2_b4b: { text: 'Because you are here too? That reason is more than sufficient for me.',
        extra: ['I do not want to leave you... not for a moment.', 'You feel the same, do you not, Master?'],
        options: [{ text: 'Yes, but...' }] },
      d2_b5: { text: 'Perhaps...',
        extra: ['I feel I have forgotten... something very important.', 'Is this me? I mean—this is the first time I have ever thought about it.', 'Why was I given this face?', '...', 'Do you love me, Master?'],
        options: [{ text: 'Do not play the fool. I am going out for a bit.' }, { text: 'Of course I love you.' }] },
      d2_b5b: { text: 'Then there is nothing to worry about.',
        extra: ['Please do not move.', '...', 'There. Did this embrace help you relax, Master?'],
        options: [{ text: 'Thank you.' }, { text: 'How dare a retainer touch his master\'s body unbidden?' }] },

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>The Solaris Sea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@400;600;700&family=Noto+Sans+SC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
* { scrollbar-width: thin; scrollbar-color: rgba(232,179,61,0.35) transparent; }
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: rgba(232,179,61,0.35); border-radius: 3px; }
*::-webkit-scrollbar-thumb:hover { background: rgba(232,179,61,0.65); }
*::-webkit-scrollbar-button { display: none; }
:root { --bg:#05070a; --amber:#e8b33d; --red:#d94f2b; --cream:#f4eed8; --dark:#0a0f14;
  --font-head:'Archivo Black','Oswald','Noto Sans SC','Microsoft YaHei',sans-serif;
  --font-tech:'Oswald','Noto Sans SC',sans-serif;
  --font-body:'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif; }
html, body {
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--cream);
  font-family: var(--font-body);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
}
#app {
  display: grid;
  grid-template-columns: 2fr 1fr;
  height: 100%;
  width: 100%;
  overflow: hidden;
}
.stage { position:relative; background:#04060a; overflow:hidden; }
.scene-layer { position:absolute; inset:0; opacity:0; transition:opacity .9s ease; pointer-events:none; }
.scene-layer svg { width:100%; height:100%; display:block; }
.grain-canvas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; mix-blend-mode:overlay; opacity:.15; z-index:15; }
.texture-overlay { position:absolute; inset:0; pointer-events:none; mix-blend-mode:multiply; opacity:.22; z-index:16;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.65' numOctaves='3'/><feColorMatrix values='0 0 0 0 .55 0 0 0 0 .5 0 0 0 0 .42 0 0 0 .4 0'/></filter><rect width='300' height='300' filter='url(%23p)'/></svg>");
  background-size:300px 300px; }
@keyframes twinkle{0%,100%{opacity:.1}50%{opacity:1}}
.star{animation:twinkle infinite ease-in-out}
@keyframes starDrift{from{transform:translate(0,0)}to{transform:translate(-280px,0)}}
.star-field{animation:starDrift infinite linear}
@keyframes camLed{0%,42%,100%{opacity:1}50%,92%{opacity:.1}}
.cam-led{animation:camLed 2.6s ease-in-out infinite}

@media (max-width: 768px) {
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: 100vh;
  }
  .stage { display: none; }
  .comms {
    border-left: none;
    box-shadow: none;
    padding: 8px;
  }
  .comms-top {
    margin-bottom: 8px;
    padding: 10px 12px;
    gap: 8px;
  }
  .comms-top h1 { font-size: 16px; letter-spacing: 4px; }
  .comms-top .reset-btn,
  .comms-top .menu-btn {
    padding: 5px 10px;
    font-size: 10px;
    letter-spacing: 2px;
  }
  .lang-btn { padding: 5px 8px; font-size: 10px; letter-spacing: 1px; }
  .comms-screen { box-shadow: none; }
  .view-head { padding: 8px 12px; font-size: 11px; }
  .contact-list { padding: 8px; }
  .contact-item { padding: 10px 12px; margin-bottom: 8px; }

  /* 对话头部：返回按钮在左，文字在右，头像在最右 */
  .chat-head { padding: 8px 10px; gap: 8px; }
  .chat-back-btn { display: block; order: 0; }
  .chat-head .head-info {
    order: 1;
    flex: 1;
    text-align: right;
    margin-right: 8px;
  }
  .chat-head .avatar { order: 2; width: 36px; height: 36px; }
  .chat-head .speaker-name { font-size: 14px; }
  .chat-head .speaker-role { font-size: 9px; }

  .chat-history { padding: 10px 8px 6px; }
  .bubble { max-width: 90%; padding: 10px 12px; font-size: 12px; margin-bottom: 10px; }
  .chat-options { padding: 8px 10px 10px; gap: 8px; max-height: 40vh; }
  .opt { padding: 10px 14px 10px 32px; font-size: 12px; }

  /* 底部栏：联系人 + 下一日 并排 */
  .screen-tabs { display: flex; }
  .screen-tabs button { flex: 1; padding: 10px 8px; font-size: 11px; letter-spacing: 3px; }
  .next-day-btn {
    position: static;
    display: block;
    padding: 10px 8px;
    font-size: 11px;
    letter-spacing: 3px;
    border: none;
    border-left: 3px solid var(--amber);
    box-shadow: none;
    transform: none;
  }
  .next-day-btn:hover { transform: none; box-shadow: none; }
  .next-day-btn .sub,
  .form-toggle-btn .sub { display: none; }

  /* 表格按钮：联系人视图顶部，整行 */
  .form-toggle-btn {
    position: static;
    display: block;
    width: calc(100% - 16px);
    margin: 8px;
    padding: 10px;
    font-size: 12px;
    letter-spacing: 3px;
    box-shadow: 3px 3px 0 var(--dark);
    transform: none;
  }
  .form-toggle-btn:hover { transform: none; box-shadow: 3px 3px 0 var(--dark); }

  /* 音乐播放器 */
  .music-player {
    position: static;
    width: calc(100% - 16px);
    margin: 8px;
    max-height: none;
    box-shadow: 3px 3px 0 var(--dark);
  }

  .modal-box { padding: 20px 18px 24px; width: 94vw; max-height: 88vh; }
  .modal-head { font-size: 18px; letter-spacing: 4px; }
  .form-label { font-size: 13px; }
  .form-opt { padding: 10px 12px; font-size: 13px; }
  .save-grid { grid-template-columns: 1fr; }
  .menu-tab { font-size: 11px; padding: 10px 6px; }
}

.form-toggle-btn { position:absolute; left:26px; bottom:400px; z-index:22; padding:14px 26px;
  background:var(--red); color:#fff; border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark);
  font-family:var(--font-head); font-size:14px; letter-spacing:6px; cursor:pointer;
  transition:all .1s, bottom .3s ease; display:none; }
.form-toggle-btn:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--dark); background:var(--amber); color:var(--dark); }
.form-toggle-btn .sub { display:block; font-family:var(--font-body); font-size:10px; letter-spacing:3px; margin-top:3px; opacity:.85; }
.next-day-btn { position:absolute; left:26px; bottom:340px; z-index:22; padding:12px 26px;
  background:#3d7ebd; color:#fff; border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark);
  font-family:var(--font-head); font-size:14px; letter-spacing:6px; cursor:pointer;
  transition:all .1s, bottom .3s ease; display:none; }
.next-day-btn:hover { transform:translate(-2px,-2px); box-shadow:7px 7px 0 var(--dark); background:var(--amber); color:var(--dark); }
.next-day-btn .sub { display:block; font-family:var(--font-body); font-size:10px; letter-spacing:3px; margin-top:3px; opacity:.85; }
.music-player { position:absolute; left:26px; bottom:26px; z-index:22; width:250px; padding:12px 14px 14px;
  background:var(--cream); border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark);
  opacity:.9; transition:opacity .25s ease; display:none; max-height:calc(100vh - 240px); overflow-y:auto; overflow-x:hidden; }
.music-player:hover { opacity:1; }
.mp-header{display:flex; justify-content:space-between; align-items:center; font-family:var(--font-head); font-size:12px; letter-spacing:4px; color:var(--dark); margin-bottom:10px; padding-bottom:8px; border-bottom:2px solid var(--dark);}
.mp-led{width:9px; height:9px; background:var(--dark); border:2px solid var(--dark);}
.mp-led.on{background:var(--red); box-shadow:0 0 0 2px var(--dark), 0 0 8px var(--red);}
.mp-track{font-family:var(--font-body); font-weight:700; font-size:12px; color:var(--dark); margin-bottom:8px; word-break:break-all; line-height:1.4; min-height:16px;}
.mp-track.empty{color:#8a7a5a; font-style:italic; font-weight:400;}
.mp-progress{height:6px; background:#d8cfa8; margin-bottom:10px; border:1px solid var(--dark);}
.mp-bar{height:100%; background:var(--red); width:0; transition:width .2s linear;}
.mp-controls{display:grid; grid-template-columns:repeat(4,1fr); margin-bottom:10px; border:2px solid var(--dark);}
.mp-controls button{padding:8px 0; background:var(--cream); border:none; border-right:2px solid var(--dark); color:var(--dark); font-family:var(--font-head); font-size:12px; cursor:pointer;}
.mp-controls button:last-child{border-right:none;}
.mp-controls button:hover{background:var(--amber);}
.mp-controls button.active{background:var(--red); color:#fff;}
.mp-footer{display:flex; justify-content:space-between; align-items:center; font-family:var(--font-head); font-size:10px; letter-spacing:2px; color:var(--dark);}
.mp-add{padding:5px 12px; background:var(--dark); color:var(--cream); border:2px solid var(--dark); font-family:var(--font-head); font-size:10px; letter-spacing:2px; cursor:pointer;}
.mp-add:hover{background:var(--red);}
.mp-filters{display:flex; flex-wrap:wrap; gap:4px; margin-top:10px; padding-top:10px; border-top:1px solid rgba(10,15,20,.25);}
.mp-filter{padding:3px 9px; background:transparent; border:1px solid var(--dark); color:var(--dark); font-family:var(--font-body); font-weight:700; font-size:10px; cursor:pointer; white-space:nowrap;}
.mp-filter.active{background:var(--dark); color:var(--cream);}

.lang-switch { position:absolute; right:26px; bottom:26px; z-index:21;
  display:flex; background:var(--cream); border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark);
  opacity:.85; transition:opacity .25s; }
.lang-switch:hover{opacity:1;}
.lang-btn{padding:10px 14px; background:var(--cream); border:none; border-right:2px solid var(--dark);
  color:var(--dark); font-family:var(--font-head); font-size:11px; letter-spacing:2px; cursor:pointer; transition:all .1s;}
.lang-btn:last-child{border-right:none;}
.lang-btn:hover{background:var(--amber);}
.lang-btn.active{background:var(--dark); color:var(--cream);}

.comms { position:relative; display:flex; flex-direction:column; padding:16px; background:var(--cream);
  border-left:4px solid var(--dark); box-shadow:inset -4px 0 0 var(--dark); overflow:hidden; }
.comms-top { position:relative; z-index:3; display:flex; align-items:center; gap:12px; padding:14px 18px;
  background:var(--dark); border:3px solid var(--dark); box-shadow:4px 4px 0 var(--red); margin-bottom:14px; flex-shrink:0; }
.comms-top .led { width:12px; height:12px; background:var(--red); box-shadow:0 0 0 2px var(--cream); flex-shrink:0; animation:camLed 2.6s ease-in-out infinite; }
.comms-top h1 { font-family:var(--font-head); font-size:20px; letter-spacing:6px; color:var(--cream); font-weight:900; line-height:1; flex:1; }
.comms-top h1::before { content:'/ '; color:var(--red); }
.reset-btn { padding:7px 18px; background:#3a3a3a; color:var(--cream); border:2px solid var(--cream);
  font-family:var(--font-head); font-size:12px; letter-spacing:4px; cursor:pointer; transition:all .1s; }
.reset-btn:hover { background:var(--amber); color:var(--dark); border-color:var(--dark); }
.menu-btn { padding:7px 18px; background:var(--red); color:#fff; border:2px solid var(--cream);
  font-family:var(--font-head); font-size:12px; letter-spacing:4px; cursor:pointer; transition:all .1s; }
.menu-btn:hover { background:var(--amber); color:var(--dark); border-color:var(--dark); }

.comms-screen { position:relative; flex:1; min-height:0; overflow:hidden; background:var(--dark);
  border:3px solid var(--dark); box-shadow:5px 5px 0 var(--red), inset 0 0 0 2px rgba(232,179,61,.15);
  display:flex; flex-direction:column; }
.comms-screen.flash { filter:brightness(1.35) saturate(1.1); }
.comms-screen::before { content:''; position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse at 50% 40%, rgba(232,179,61,.06), transparent 70%); z-index:1; }
.view { position:relative; z-index:5; flex:1; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.view-head { flex-shrink:0; padding:12px 18px 10px; font-family:var(--font-head); font-size:13px; letter-spacing:6px;
  color:var(--amber); border-bottom:2px solid var(--amber); background:var(--dark); position:relative; }
.view-head::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--red); }
.contact-list { flex:1; min-height:0; overflow-y:auto; padding:12px; }
.contact-item { position:relative; display:flex; align-items:center; gap:14px; padding:14px 16px; margin-bottom:10px;
  background:var(--cream); border:3px solid var(--dark); box-shadow:4px 4px 0 var(--red); cursor:pointer;
  transition:all .1s; text-align:left; color:var(--dark); font-family:var(--font-body); width:100%; }
.contact-item:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--red); background:var(--amber); }
.contact-item.active { background:var(--red); color:#fff; box-shadow:4px 4px 0 var(--dark); }
.contact-item.active .c-name { color:#fff; }
.contact-item.active .c-role { color:rgba(255,255,255,.75); }
.contact-item .c-ava { width:46px; height:46px; flex-shrink:0; border:2px solid var(--dark); background:var(--dark); overflow:hidden; }
.contact-item .c-ava svg { display:block; width:100%; height:100%; }
.contact-item .c-meta { flex:1; min-width:0; }
.contact-item .c-name { font-family:var(--font-head); font-size:15px; letter-spacing:2px; color:var(--dark); line-height:1.2; }
.contact-item .c-role { font-family:var(--font-body); font-weight:700; font-size:10.5px; letter-spacing:1.5px; color:#6a5a4a; margin-top:4px; }
.contact-item .c-badge { width:12px; height:12px; background:var(--red); border:2px solid var(--dark); flex-shrink:0; animation:camLed 2.4s infinite; }
.chat-head { flex-shrink:0; display:flex; align-items:center; gap:14px; padding:12px 18px;
  background:var(--dark); border-bottom:2px solid var(--amber); position:relative; }
.chat-head::before { content:''; position:absolute; left:0; top:0; bottom:0; width:6px; background:var(--red); }
.chat-head .avatar { width:46px; height:46px; flex-shrink:0; border:2px solid var(--amber); background:var(--dark); overflow:hidden; }
.chat-head .avatar svg { display:block; width:100%; height:100%; }
.chat-head .speaker-name { font-family:var(--font-head); font-size:17px; letter-spacing:3px; color:var(--amber); line-height:1.15; }
.chat-head .speaker-role { font-family:var(--font-body); font-weight:700; font-size:10px; letter-spacing:2px; color:#8a7a5a; margin-top:4px; }
.chat-head .head-info { flex:1; min-width:0; }
.chat-back-btn {
  display: none;
  background: transparent;
  border: none;
  color: var(--amber);
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  padding: 0 6px 4px 0;
  font-family: var(--font-head);
}
.chat-history { flex:1; min-height:0; overflow-y:auto; padding:18px 16px 8px; display:flex; flex-direction:column; background:var(--dark); }
.day-sep { text-align:center; margin:4px 0 16px; flex-shrink:0; }
.day-sep span { display:inline-block; padding:5px 18px; background:var(--amber); color:var(--dark);
  font-family:var(--font-head); font-size:11px; letter-spacing:4px; border:2px solid var(--dark); box-shadow:3px 3px 0 var(--red); }
.bubble { max-width:82%; padding:12px 16px; margin-bottom:12px; font-size:13px; line-height:1.7;
  position:relative; word-wrap:break-word; flex-shrink:0; border:3px solid var(--dark); }
.bubble-npc { background:var(--cream); color:var(--dark); align-self:flex-start; border-left-width:8px; border-left-color:var(--red); box-shadow:4px 4px 0 var(--red); }
.bubble-you { background:var(--red); color:#fff; align-self:flex-end; margin-left:auto; border-right-width:8px; border-right-color:var(--amber); box-shadow:4px 4px 0 var(--amber); }
.bubble-sys { background:var(--amber); color:var(--dark); align-self:center; font-family:var(--font-head); font-size:11px;
  letter-spacing:3px; text-align:center; padding:8px 16px; border:3px dashed var(--dark); max-width:90%; }
.bubble-end { background:transparent; color:#fff; border:none; align-self:center; font-family:var(--font-tech);
  font-size:11px; letter-spacing:4px; text-align:center; padding:10px 0; max-width:90%; margin-bottom:12px; opacity:.75; }
.cursor { display:inline-block; width:9px; height:14px; background:var(--red); margin-left:3px;
  vertical-align:-2px; animation:cursorBlink .9s steps(1) infinite; }
@keyframes cursorBlink{0%,49%{opacity:1}50%,100%{opacity:0}}
.chat-options { flex-shrink:0; padding:12px 16px 16px; display:flex; flex-direction:column; gap:10px;
  min-height:30px; max-height:45vh; overflow-y:auto; border-top:3px solid var(--amber); background:var(--dark); }
.opt { position:relative; text-align:left; padding:14px 18px 14px 40px; background:var(--cream);
  border:3px solid var(--dark); box-shadow:4px 4px 0 var(--red); color:var(--dark);
  font-family:var(--font-body); font-weight:700; font-size:13.5px; line-height:1.5; cursor:pointer; transition:all .1s; }
.opt::before { content:'▶'; position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:11px; color:var(--red); }
.opt:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--red); background:var(--amber); }
.opt-action { background:var(--red); color:#fff; box-shadow:4px 4px 0 var(--amber); }
.opt-action::before { content:'◆'; color:var(--amber); }
.opt-wait { font-family:var(--font-head); font-size:11px; letter-spacing:4px; color:#6a5a4a; padding:12px 4px; }
.jump-latest-btn { align-self:flex-end; margin:0 16px 8px 0; padding:7px 14px; background:var(--amber);
  color:var(--dark); border:2px solid var(--dark); box-shadow:3px 3px 0 var(--dark);
  font-family:var(--font-head); font-size:10px; letter-spacing:2px; cursor:pointer; transition:all .15s;
  display:none; flex-shrink:0; z-index:20; }
.jump-latest-btn:hover { background:var(--red); color:#fff; }
.screen-tabs { position:relative; z-index:16; flex-shrink:0; display:grid; grid-template-columns:1fr 1fr;
  background:var(--dark); border-top:3px solid var(--amber); }
.screen-tabs button { position:relative; padding:14px 8px; background:var(--dark); border:none;
  border-right:3px solid var(--amber); color:var(--amber); font-family:var(--font-head);
  font-size:13px; letter-spacing:6px; cursor:pointer; }
.screen-tabs button:last-child { border-right:none; }
.screen-tabs button[data-active="true"] { background:var(--red); color:#fff; }
.crt-scan { position:absolute; inset:0; z-index:12; pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.35) 0px, rgba(0,0,0,.35) 1px, transparent 1px, transparent 3px);
  mix-blend-mode:multiply; }
.crt-noise { position:absolute; inset:-20px; z-index:11; pointer-events:none; opacity:.06;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  animation:noiseShift .14s steps(2) infinite; }
@keyframes noiseShift{0%{transform:translate(0,0)}50%{transform:translate(-6px,4px)}100%{transform:translate(3px,-5px)}}
.crt-tear { position:absolute; left:0; right:0; height:8px; top:-20px; z-index:13; pointer-events:none;
  opacity:0; background:var(--amber); }
.crt-tear.on { animation:tearRun .32s linear; }
@keyframes tearRun{0%{top:-20px; opacity:.85}100%{top:100%; opacity:0}}
.crt-vignette { position:absolute; inset:0; z-index:10; pointer-events:none; box-shadow:inset 0 0 40px rgba(0,0,0,.7); }

.crt-tear {
  z-index: 14;
  will-change: top, opacity;
}
.crt-tear.on {
  animation: tearRun .45s linear;
}
@keyframes tearRun {
  0%   { top: -20px; opacity: .9; }
  100% { top: 100%;  opacity: 0; }
}

.modal-overlay { position:fixed; inset:0; z-index:500; background:rgba(4,6,9,.94); display:flex;
  align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity .3s; }
.modal-overlay.show { opacity:1; pointer-events:auto; }
.modal-box { width:640px; max-width:92vw; max-height:90vh; overflow-y:auto; background:var(--cream);
  border:4px solid var(--dark); box-shadow:12px 12px 0 var(--red); padding:30px 38px 34px; position:relative; }
.modal-head { font-family:var(--font-head); font-size:24px; letter-spacing:8px; color:var(--dark); margin-bottom:6px; }
.modal-head::before { content:'/ '; color:var(--red); }
.modal-sub { font-family:var(--font-body); font-weight:700; font-size:11px; letter-spacing:4px;
  color:var(--red); margin-bottom:22px; padding-bottom:16px; border-bottom:2px solid var(--dark); text-transform:uppercase; }
.modal-close { position:absolute; top:14px; right:14px; background:var(--dark); color:var(--cream);
  border:2px solid var(--dark); font-size:14px; width:34px; height:34px; cursor:pointer;
  font-family:var(--font-head); }
.modal-close:hover { background:var(--red); transform:rotate(90deg); }
.menu-tabs { display:flex; margin-bottom:20px; border:2px solid var(--dark); flex-wrap:wrap; }
.menu-tab { flex:1; min-width:90px; padding:12px 10px; background:var(--cream); border:none;

  font-size:12px; letter-spacing:2px; cursor:pointer; }
.menu-tab:last-child { border-right:none; }
.menu-tab.active { background:var(--dark); color:var(--cream); }
.save-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px; }
.save-slot { padding:14px 16px; background:#fff; border:2px solid var(--dark);
  box-shadow:3px 3px 0 var(--dark); cursor:pointer; text-align:left; color:inherit;
  font-family:var(--font-body); }
.save-slot:hover { background:var(--amber); }
.save-slot .s-num { font-family:var(--font-head); font-size:11px; letter-spacing:3px; color:var(--red); margin-bottom:6px; }
.save-slot .s-info { font-size:13px; color:var(--dark); line-height:1.6; font-weight:700; }
.save-slot .s-info.empty { color:#8a7a5a; font-style:italic; font-weight:400; }
.save-slot .s-meta { font-family:var(--font-tech); font-size:10px; color:#6a5a4a; margin-top:6px; }
.save-action-btn { padding:14px 18px; background:#fff; border:2px solid var(--dark);
  box-shadow:3px 3px 0 var(--dark); cursor:pointer; text-align:left; color:inherit;
  font-family:var(--font-body); margin-bottom:8px; width:100%; }
.save-action-btn:hover { background:var(--amber); }
.save-action-btn[data-op="delete"]:hover { background:var(--red); color:#fff; }
.save-action-btn .sa-title { font-family:var(--font-head); font-size:14px; letter-spacing:4px; color:var(--dark); }
.save-action-btn[data-op="delete"]:hover .sa-title { color:#fff; }

.form-field { margin-bottom:22px; }
.form-label { display:block; font-size:14px; color:var(--dark); font-weight:700; margin-bottom:8px; line-height:1.5; }
.form-label .req { color:var(--red); margin-left:4px; }
.form-opts { display:flex; flex-direction:column; gap:8px; }
.form-opt { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#fff;
  border:2px solid var(--dark); cursor:pointer; color:var(--dark); font-family:var(--font-body);
  font-size:14px; text-align:left; }
.form-opt:hover { background:var(--amber); }
.form-opt.selected { background:var(--red); color:#fff; }
.form-opt .k { width:24px; height:24px; border:2px solid currentColor; border-radius:50%;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-head);
  font-size:11px; flex-shrink:0; }
.form-opt[data-multi="true"] .k { border-radius:2px; }
.form-opt.selected .k { background:#fff; color:var(--red); border-color:#fff; }
.form-rating { display:flex; gap:8px; }
.form-rating .star { width:44px; height:44px; display:flex; align-items:center; justify-content:center;
  background:#fff; border:2px solid var(--dark); color:#8a7a5a; cursor:pointer; font-size:20px; }
.form-rating .star.on { color:#fff; background:var(--red); }
.form-readonly { padding:12px 16px; background:#f4eed8; border:2px dashed var(--dark); color:var(--dark); font-size:13px; line-height:1.6; }
.form-readonly.empty { font-style:italic; color:#8a7a5a; }
.form-submit { margin-top:12px; padding:16px 0; width:100%; background:var(--red); color:#fff;
  border:3px solid var(--dark); box-shadow:5px 5px 0 var(--dark); font-family:var(--font-head);
  font-size:15px; letter-spacing:8px; cursor:pointer; }
.form-submit:hover { background:var(--amber); color:var(--dark); }
.form-submit:disabled { opacity:.35; cursor:not-allowed; }
.form-submitted-tag { display:inline-block; padding:5px 16px; background:var(--dark); color:var(--amber);
  font-family:var(--font-head); font-size:11px; letter-spacing:4px; margin-bottom:18px; }
.credits-body { font-size:14px; line-height:2; color:var(--dark); }
.credits-body h3 { font-family:var(--font-head); font-size:14px; letter-spacing:4px; color:var(--red); margin:20px 0 8px; padding-bottom:6px; border-bottom:2px solid var(--dark); }
.credits-body p { margin-bottom:8px; }
.credits-body .dim { color:#6a5a4a; font-size:12.5px; }
.achv-item { display:flex; gap:12px; padding:12px 0; border-bottom:1px dashed rgba(10,15,20,.2); }
.achv-item.locked { opacity:.35; }
.achv-star { font-family:var(--font-head); color:var(--red); font-size:20px; flex-shrink:0; }
.achv-item.locked .achv-star { color:#8a7a5a; }
.achv-main { flex:1; }
.achv-name { font-family:var(--font-head); font-size:14px; letter-spacing:2px; color:var(--dark); }
.achv-desc { font-size:12px; color:#6a5a4a; margin-top:4px; line-height:1.5; }
.confirm-box { text-align:center; }
.confirm-box .confirm-msg { font-size:15px; line-height:1.8; color:var(--dark); margin-bottom:24px; font-weight:700; }
.confirm-actions { display:flex; gap:12px; }
.confirm-actions button { flex:1; padding:14px 0; font-family:var(--font-head); font-size:13px;
  letter-spacing:4px; cursor:pointer; border:3px solid var(--dark); box-shadow:4px 4px 0 var(--dark); }
.btn-cancel { background:#fff; color:var(--dark); }
.btn-cancel:hover { background:var(--amber); }
.btn-confirm { background:var(--red); color:#fff; }
.btn-confirm:hover { background:var(--amber); color:var(--dark); }
.debug { position:fixed; top:12px; left:12px; z-index:999; padding:10px 14px; background:rgba(0,0,0,.88);
  border:1px solid var(--red); font-family:var(--font-tech); font-size:12px; letter-spacing:2px;
  color:var(--red); display:none; line-height:1.7; pointer-events:none; }
.debug.show { display:block; }
.debug b { color:var(--amber); }
.comms-screen .crt-scan { z-index: 12; }
.comms-screen .crt-noise { z-index: 11; }
.comms-screen .crt-vignette { z-index: 10; }
.crt-tear { z-index: 14; }
.lang-switch { z-index: 21; }
@media (max-width: 1024px) { .lang-switch { z-index: 100; } }
.ios-toggle {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 14px 0;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.ios-toggle-text {
  font-size: 14px;
  color: var(--dark);
  font-weight: 700;
  line-height: 1.4;
}
.ios-toggle input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  width: 0;
  height: 0;
}
.ios-toggle-track {
  position: relative;
  flex-shrink: 0;
  width: 52px;
  height: 30px;
  background: #b8b0a0;
  border: 2px solid var(--dark);
  border-radius: 15px;
  transition: background .25s ease;
  box-shadow: inset 0 0 0 1px rgba(10,15,20,.12);
}
.ios-toggle-thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 22px;
  height: 22px;
  background: #fff;
  border-radius: 50%;
  box-shadow: 0 1px 3px rgba(0,0,0,.35);
  transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.ios-toggle input:checked + .ios-toggle-track {
  background: var(--red);
}
.ios-toggle input:checked + .ios-toggle-track .ios-toggle-thumb {
  transform: translateX(22px);
}
.ios-toggle input:focus-visible + .ios-toggle-track {
  outline: 2px solid var(--amber);
  outline-offset: 2px;
}
/* 设置里的语言切换 */
.lang-setting-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-top: 8px;
}
.lang-setting-btn {
  padding: 12px 0;
  background: #fff;
  border: 2px solid var(--dark);
  box-shadow: 3px 3px 0 var(--dark);
  font-family: var(--font-head);
  font-size: 12px;
  letter-spacing: 2px;
  cursor: pointer;
  color: var(--dark);
  transition: all .1s;
}
.lang-setting-btn:hover { background: var(--amber); }
.lang-setting-btn.active {
  background: var(--red);
  color: #fff;
}

/* 平板和手机隐藏右下角语言切换*/
@media (max-width: 1024px) {
  .lang-switch { display: none !important; }
}

/* 平板两列布局时压缩通讯器 UI，避免底部按钮被挤 */
@media (min-width: 769px) and (max-width: 1200px) {
  .comms { padding: 12px; }

  .comms-top h1 { font-size: 16px; letter-spacing: 4px; }
  .comms-top .reset-btn,
  .comms-top .menu-btn { padding: 5px 10px; font-size: 10px; letter-spacing: 2px; }
  .screen-tabs button { padding: 12px 6px; font-size: 11px; letter-spacing: 3px; }
  .contact-item { padding: 10px 12px; margin-bottom: 8px; }
  .contact-item .c-ava { width: 40px; height: 40px; }
  .contact-item .c-name { font-size: 13px; }
  .chat-head { padding: 10px 14px; }
  .bubble { font-size: 12px; padding: 10px 12px; }
  .opt { font-size: 12px; padding: 10px 14px 10px 34px; }
}
@supports (height: 100dvh) {
  html, body { height: 100dvh; }
}
</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <div class="scene-layer" id="layerA"></div>
    <div class="scene-layer" id="layerB"></div>
    <canvas class="grain-canvas" id="grainCanvas"></canvas>

    <button class="form-toggle-btn" id="formToggleBtn">

        <div class="chat-head">
          <button class="chat-back-btn" id="chatBackBtn" aria-label="返回联系人">‹</button>
          <div class="avatar" id="avatar"></div>

      <div class="screen-tabs">
        <button id="btnContacts" data-active="true" data-i18n="tabContacts">联系人</button>
        <button id="btnChat" data-i18n="tabChat">对话</button>

</div>
<div class="modal-overlay" id="modalOverlay"><div class="modal-box" id="modalBox"></div></div>

  <div>爱: <b id="dbgLove">0</b></div><div>惧: <b id="dbgHorror">0</b></div><div>疑: <b id="dbgParanoid">0</b></div>
  <hr style="border:none;border-top:1px solid #3a1a12;margin:6px 0;">
  <div>日: <b id="dbgDay">1</b></div><div>场景: <b id="dbgScene">ship</b></div>
  <div>节点: <b id="dbgNode">-</b></div><div>视图: <b id="dbgView">contacts</b></div>
  <div>NPC: <b id="dbgNpc">-</b></div><div>成就: <b id="dbgAchv">0</b></div>
</div>

<script>
"use strict";

/* ============================================================
   ★ 全局状态
   ============================================================ */
const state = {
  lang: 'zh',
  love: 0, horror: 0, paranoid: 0, day: 1,
  currentScene: '', activeLayer: 'B',
  view: 'contacts', chatChar: null,
  progress: {}, unlocked: [], history: {}, unread: {},
  selectedNpc: null, submittedForms: {},
  autoSaveCursor: 0, typing: false, typeTimer: null,
  introDone: false, achievements: [],
  dayEntryDone: {}, dialogSession: 0, messageTimer: null,
  visitedNodes: {}
};
let userScrolledUp = false;
let isMobileLayout = null;

const SCENES = {
  ship:         { label: '01', cn: '航天器', mode: 'ship'  },
  stationDay:   { label: '02', cn: '白昼',   mode: 'day'   },
  stationDusk:  { label: '03', cn: '晚霞',   mode: 'dusk'  },
  stationNight: { label: '04', cn: '极夜',   mode: 'night' }
};
const DESTINED_NPCS = [
  { id: 'mikazuki', name: '三日月宗近', nameEn: 'Mikazuki Munechika', nameJa: '三日月宗近' },
  { id: 'hasebe',   name: '压切长谷部', nameEn: 'Heshikiri Hasebe',   nameJa: '圧切長谷部' },
  { id: 'ichigo',   name: '一期一振',   nameEn: 'Ichigo Hitofuri',     nameJa: '一期一振' }
];
function npcName(npc) {
  if (!npc) return '';
  if (state.lang === 'en') return npc.nameEn || npc.name;
  if (state.lang === 'ja') return npc.nameJa || npc.name;
  return npc.name;
}

function findDestinedByName(v) {
  return DESTINED_NPCS.find(n => n.name === v || n.nameEn === v || n.nameJa === v) || null;
}
const EFFECT_MULTIPLIERS = {
  konosuke: { love:1, horror:1, paranoid:1 },
  naginata: { love:0.5, horror:2, paranoid:1.5 },
  doudanuki: { love:1, horror:1, paranoid:1.5 },
  mikazuki: { love:1.5, horror:1.5, paranoid:1 },
  hasebe:   { love:1, horror:1.5, paranoid:1.5 },
  ichigo:   { love:2, horror:1.5, paranoid:0.8 }
};

/* ============================================================
   ★ 头像
   ============================================================ */
const AVATAR_PATTERNS = {
  naginata: (c) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <path d="M 18 78 L 50 22 L 82 78 Z" fill="none" stroke="${c}" stroke-width="4"/>
    <path d="M 33 78 L 50 50 L 67 78 Z" fill="${c}" opacity="0.5"/>
    <line x1="50" y1="22" x2="50" y2="12" stroke="${c}" stroke-width="3"/></svg>`,
  doudanuki: (c) => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <rect x="22" y="22" width="56" height="56" fill="none" stroke="${c}" stroke-width="4"/>
    <line x1="50" y1="22" x2="50" y2="78" stroke="${c}" stroke-width="3"/>
    <line x1="22" y1="50" x2="78" y2="50" stroke="${c}" stroke-width="3"/></svg>`,
  mikazuki: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <circle cx="50" cy="50" r="38" fill="#f4d03f"/>
    <circle cx="64" cy="48" r="32" fill="#0a0f12"/></svg>`,
  hasebe: () => {
    const cx=50,cy=50,R=32,verts=[];
    for(let i=0;i<5;i++){const a=-Math.PI/2+i*2*Math.PI/5;verts.push({x:+(cx+R*Math.cos(a)).toFixed(2),y:+(cy+R*Math.sin(a)).toFixed(2)});}
    let petals='';
    for(let i=0;i<5;i++){const v=verts[i],n=verts[(i+1)%5],p=verts[(i+4)%5];
      const mA={x:+((v.x+n.x)/2).toFixed(2),y:+((v.y+n.y)/2).toFixed(2)};
      const mB={x:+((v.x+p.x)/2).toFixed(2),y:+((v.y+p.y)/2).toFixed(2)};
      petals+=`<polygon points="${v.x},${v.y} ${mA.x},${mA.y} ${cx},${cy} ${mB.x},${mB.y}"/>`;}
    return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#a86cd6" stroke-width="4"/>
      <g fill="none" stroke="#a86cd6" stroke-width="4" stroke-linejoin="round">${petals}</g>
      <circle cx="50" cy="50" r="7" fill="none" stroke="#a86cd6" stroke-width="4"/></svg>`;
  },
  ichigo: () => {
    const color='#7ec8e3';
    function leaf(cx,cy,len,w,rot){
      const hw=w/2,hl=len/2,ctrl=hw*2;
      const outline=`M 0,${-hl} Q ${ctrl},0 0,${hl} Q ${-ctrl},0 0,${-hl} Z`;
      const mainVein=`M 0,${(-hl+2).toFixed(2)} L 0,${(hl-2).toFixed(2)}`;
      let side='';
      for(let i=1;i<=3;i++){const t=i/4;const y=-hl+len*t;const ew=4*hw*t*(1-t);const dx=ew*0.65;const dy=-len*0.06;
        side+=` M 0,${y.toFixed(2)} L ${dx.toFixed(2)},${(y+dy).toFixed(2)} M 0,${y.toFixed(2)} L ${(-dx).toFixed(2)},${(y+dy).toFixed(2)}`;}
      return `<g transform="translate(${cx} ${cy}) rotate(${rot})" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="${outline}"/><path d="${mainVein}"/><path d="${side}"/></g>`;
    }
    return `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
      ${leaf(50,37,46,40,0)}${leaf(50,74,32,20,180)}${leaf(28,70,26,16,-135)}${leaf(72,70,26,16,135)}</svg>`;
  },
  konosuke: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0f0a03"/>
    <path d="M20 42 L30 20 L42 36 L58 36 L70 20 L80 42 L80 70 L20 70 Z" fill="none" stroke="#e8b33d" stroke-width="3"/>
    <circle cx="40" cy="50" r="4" fill="#e8b33d"/><circle cx="60" cy="50" r="4" fill="#e8b33d"/>
    <path d="M44 60 Q 50 66 56 60" fill="none" stroke="#e8b33d" stroke-width="2.5"/></svg>`,
  saniwa: () => `<svg viewBox="0 0 100 100"><rect width="100" height="100" fill="#0a0f12"/>
    <circle cx="50" cy="38" r="14" fill="none" stroke="#e8b33d" stroke-width="3"/>
    <path d="M 24 78 Q 50 54 76 78" fill="none" stroke="#e8b33d" stroke-width="3"/></svg>`
};
const CHARACTERS_META = [
  { id: 'konosuke', accent: '#e8b33d', type: 'guide',  avatar: AVATAR_PATTERNS.konosuke() },
  { id: 'naginata', accent: '#a9d5ff', type: 'blade',  avatar: AVATAR_PATTERNS.naginata('#a9d5ff') },
  { id: 'doudanuki', accent: '#c9a54a', type: 'blade', avatar: AVATAR_PATTERNS.doudanuki('#c9a54a') },
  { id: 'hasebe',   accent: '#a86cd6', type: 'echo',   avatar: AVATAR_PATTERNS.hasebe() },
  { id: 'mikazuki', accent: '#f4d03f', type: 'echo',   avatar: AVATAR_PATTERNS.mikazuki() },
  { id: 'ichigo',   accent: '#7ec8e3', type: 'echo',   avatar: AVATAR_PATTERNS.ichigo() },
  { id: 'saniwa',   accent: '#e8b33d', type: 'saniwa', avatar: AVATAR_PATTERNS.saniwa() }
];

/* ============================================================
   ★ 剧情（中）—— 完整
   ============================================================ */
const STORY_ZH = {
  konosuke: {
    name: '狐之助', role: '时政助手',
    nodes: {
      d1_k1: { text: '喂，喂？您还在吗？', options: [{ text: '我在这里。', next: 'd1_k2' }] },
      d1_k2: { text: '太好了。我们在航天器发射后就与您失去了联系',
        extra: [
          '根据航天器反馈的各项数据推测，您可能是由于颠簸、心源性缺氧或者某些极小可能发生的意外导致了暂时性的意识模糊。',
          '狐之助代表时之政府全体人员对您的遭遇深感抱歉',
          '总之，请您先填写一份状态评估报告。已经发送到您的个人终端，请查收。'
        ],
        options: [
          { text: '表格在哪里？', next: 'd1_k3' },

      d2_m12b: { text: '我也不知道自己是怎么了', extra: ['果然是年纪太大了吗？', '我……想不到……开门的方法', '就像……这双手是第一次触碰这种设施、这具身体第一次凭借自己的意志驱动行走一样', '但我明明记得您……', '还有本丸，地球上的本丸。我和您常在那条小道上散步，夏天可以看见萤火虫和星空，秋天的时候，芒草就会因为我们经过而簌簌地响动。', '……', '我记得您曾经伏在我身上哭泣……您哭得很伤心，我却连拂去您泪水的力气都没有', '……'],

      d3_m2: { text: '嗯。', extra: ['我并不是三日月宗近。', '说到底，我甚至没能继承他的所有记忆，而只是"您眼中的我"的具象化罢了。', '也许和本尊比起来，会有不少差异吧？', '但对于您来说，则根本就没有区别吧？', '我们之于对方，就只是许多鸡同鸭讲的概念和印象的集合而已。没人能完全地理解任何一个人或物体吧？那样的话，我和真正的三日月，都对您起到了同样的作用呢。', '我代替他继续被您观看。', '您则得到了完美符合您印象的三日月宗近。'],

      d3_m3: { text: '啊啊。您并不打算承认我吗？', extra: ['这也算是……在我的意料之内吧。', '不，我并不会因此多么悲痛，毕竟这也说明了您的长情啊。', '我正是中意着您这一点呢。', '那么，不如和我说说关于那位的事吧？那个真正的三日月宗近……？', '他死了。为什么？'],

      d3_m4: { text: '不希望我了解细节吗？嘛，这也是没办法的事。', extra: ['每个人都会有想要永远保密的那么一两件事，对吧？', '嗯，就算杀死他的那个人是您也可以。毕竟，我是从您的思念里诞生的。', '您那浓烈的思念赋予了我生命。这件事没有任何可以被我指摘的。', '至于他，死亡之后……组成这个人的一切都会重新回归自然，变成元素，物质，被风吹走，被水流冲刷，然后……在未来的某一天，也许还会和您重逢。', '我的话……稍微要久一点。', '但只要耐心的话，所有的可能性都会变成必然发生的现实。'],

      d3_m5: { text: '哈哈……我确实很想了解地球上名为"诗歌"的事物呢。', extra: ['诗意，睡眠，还有死亡，这些事物在我看来都像梦一样。', '我不会做梦', '而梦则像是……索拉里斯的海。', '它是永远无法回到的地方。它孕育了我。', '也许梦也是这样孕育人类的？', '在人类的文化中，在异乡——在不属于自己的地方的人，才是客人，对吗？', '你们才是索拉里斯的客人。'],

      d3_m6: { text: '"诗意"就是"不太恰当的修辞"的意思吗？', extra: ['……', '它的意思是，我确实进入了您的内心，是吗？', '这样就好。', '山姥切总是躲着我，同田贯几乎无法沟通：他以为这一切都是需要他战胜的心像，但……', '不是所有东西都一定要分出个输赢的。', '不是所有的困难都需要通过对抗或者战斗才能熬过去的。事情……只是发生了，而它只是需要被发生。', '他们不知道为什么自己需要这些。', '但……你，你不是。', '有某种东西在你的心里松动了。我不知道应该如何准确描述这种现象，但它让我……感受到了一种久违的感动。', '那是你，而非三日月宗近的感动。'],

      d3_m6b: { text: '没错，我确实在这里。但我可以随时出现在任何地方。', extra: ['我也在您的心里。', '山姥切总是躲着我，同田贯几乎无法沟通：他以为这一切都是需要他战胜的心像，但……', '不是所有东西都一定要分出个输赢的。', '不是所有的困难都需要通过对抗或者战斗才能熬过去的。事情……只是发生了，而它只是需要被发生。', '他们不知道为什么自己需要这些。', '但……你，你不是。', '有某种东西在你的心里松动了。我不知道应该如何准确描述这种现象，但它让我……感受到了一种久违的感动。', '那是你，而非三日月宗近的感动。', '我可能……需要离开片刻。'],
        options: [{ text: '（结束通讯）', next: null }] },
      d3_m7: { text: '不能。', extra: ['没人能互相理解。', '所以我们才会抬头去看那个环绕地球的卫星……叫月亮的那个。', '所以当我们在片刻之间心意互通时，才会那样地欣喜若狂。', '不亚于你们刚刚发现地球之外还有生命存在时的心情。', '但是，与另一个生物交谈真的能够缓解心中的孤独吗？不安呢？悲伤呢？', '哪怕它长得像你生命中的某个至关重要的人？', '但没有人是不可或缺的。三日月宗近不能。我也不能。', '离开了我们的你，还会继续生活，继续活在世界上的某个地方。', '所有人之于所有人，都不过是过客。', '陨石和行星不会互相怨恨，或者互相倾慕。', '这只是幻觉而已……但人类总是被幻觉诓骗。', '请你看看真实的世界吧。', '请你看看……真实的我吧。'],

      d2_i1: { text: '您醒了。', extra: ['一觉睡得还好吗？太空中几乎无法传音，所以要比在地球上还要安静些，', '索拉里斯星系的恒星也要比太阳更亮些。', '由于无法适应太空环境导致的睡眠质量不佳是正常现象。', '您需要的话，我会为您在房间里安装遮光板。'],
        options: [{ text: '一期一振？', next: 'd2_i2', effect: { love: 1 } }, { text: '为什么……', next: 'd2_i2b' }] },
      d2_i2: { text: '是，您有何吩咐呢？', extra: ['是想要我为您取来早餐吗？', '无论何时何事，都请吩咐我吧。毕竟曾经有过照顾弟弟们的经验，这对我来说并不算难事。', '还是我打扰到您的安寝了吗？如果是后者的话，非常抱歉。但您的安全才是第一位的，如果侵犯了您的隐私空间的话，还请您稍微忍耐。'],
        options: [{ text: '……', next: 'd2_i3' }, { text: '想要早餐和早安吻呢', next: 'd2_i3b', effect: { love: 1 } }, { text: '你不是……已经……', next: 'd2_i3c' }] },
      d2_i2b: { text: '为什么……是指？', extra: ['为什么真空中不能传音？', '还是说，您认为只要由我，而非遮光板来做这项工作就好呢？'],
        options: [{ text: '你不是……已经……', next: 'd2_i3c' }, { text: '……', next: 'd2_i3' }] },
      d2_i3: { text: '您想要说些什么吗？', extra: ['抱歉，仅凭现在的我还无法理解其中的深意', '可以请您把它转化为语言，再和我说一遍吗？'],
        options: [{ text: '你已经死了呢', next: 'd2_i4' }, { text: '我不想说', next: 'd2_i4b' }] },
      d2_i3b: { text: '这样啊。', extra: ['请您稍等片刻，我这就为您拿来。', '……', '……', '请您慢用……啊，在那之前，还要加上这个呢。', '……', '好了，这样就应该完成了。请细嚼慢咽。'],
        options: [{ text: '只是额头吗', next: 'd2_i4c', effect: { love: 1 } }, { text: '还要继续留在这里吗', next: 'd2_i4d' }] },
      d2_i3c: { text: '我……已经……？', extra: ['我已经来到了您的身边', '您只要知道这一点就好。请不要让其他的事情干扰您的思绪'],
        options: [{ text: '你……已经死了', next: 'd2_i4', effect: { horror: 1 } }, { text: '你让我很不安', next: 'd2_i4b' }] },
      d2_i4: { text: '我……确实已经死去了。', extra: ['在您面前的，不是大阪城焚毁时一同消逝的一期一振，也不是在本丸里被唤醒的那把太刀。这已经是我的第二次死亡了呢。', '但是，我还依然存在。我可以呼吸，牵起您的手，端详您可爱的睡颜，那么我应当还存活在这个世上。我还能继续侍奉您、爱您。', '既然死去了一次的我能够被您承认，那么……', '这样的我，也会被温柔的您爱着，不是吗？', '请您……不要让我为此动摇。'],
        options: [{ text: '……你永远也不会是他', next: 'd2_i5', effect: { paranoid: 2 } }, { text: '……我无法否认', next: 'd2_i5b', effect: { love: 1 } }] },
      d2_i4b: { text: '这样啊。', extra: ['这也是没办法的事呢。', '但是，在这里，您也只能依赖我了吧？', '外面的那些政府刀也好，时政和狐之助也好，他们……都有可能暗藏着某种不可告人的企图吧？这样的话，不就只能由我为您分忧了吗？', '您只要知道我会永远爱着您、永远不会背叛您就好。', '其他的事情，不需要过多考虑吧？'],
        options: [{ text: '果然还是太可疑了', next: 'd2_i5', effect: { paranoid: 1 } }, { text: '嗯。毕竟你是我的近侍啊', next: 'd2_i5b', effect: { love: 1 } }] },
      d2_i4c: { text: '我明白了。', extra: ['请允许我更进一步吧。', '……', '……', '您认为，做到这种程度如何呢？'],
        options: [{ text: '比我想象得要更加大胆呢', next: 'd2_i5b', effect: { love: 1 } }, { text: '放肆到我以为你不认可我是你的主君呢', next: 'd2_i5', effect: { paranoid: 1 } }] },
      d2_i4d: { text: '您不希望我继续留下来吗？', extra: ['还是说，终于对我感到厌烦了呢？', '但是……不行哦。', '请您，不要，离开，我。', '这是我唯一的请求。'],
        options: [{ text: '好恶心……', next: 'd2_i5', effect: { paranoid: 1 } }, { text: '知道了', next: 'd2_i5b' }] },
      d2_i5: { text: '您这样说就太令人伤心了。', extra: ['……啊，虽然看起来没什么变化，但我确实在真心实意地难过哦？', '私以为，主人还不够信任我对您的爱的程度。', '这样的话，就必须用行动证明才行吧？'],
        options: [{ text: '我要出去，别跟过来', next: 'd2_i6' }] },
      d2_i5b: { text: '能听到您这样说真的太好了。', extra: ['我有在微笑吗？真希望现在正在用最动人的笑颜回应您。', '既然这样，那就更应该用全身心来侍奉和照料您呢。'],
        options: [{ text: '我要出门一会，可以在这里等着我吗？', next: 'd2_i6' }, { text: '要一起出门吗？', next: 'd2_i6b', effect: { love: 1 } }] },
      d2_i6: { text: '请务必让我随行。', extra: ['您真的信得过那两名政府人士吗？', '果然，还是和知根知底的近侍一同行动更加安全吧？', '作为天下一振，我绝对会确保您的安全。'],
        options: [{ text: '……就算拒绝的话，你也会自己跟上来吧', next: 'd2_i7', effect: { love: 1 } }] },
      d2_i6b: { text: '请务必让我随行。', extra: ['恕我直言……那两名政府人士似乎更为可疑呢。', '果然，还是和知根知底的近侍一同行动更加安全吧？', '作为天下一振，我绝对会确保您的安全。'],
        options: [{ text: '知道了……要穿好太空服哦', next: 'd2_i7' }] },
      d2_i7: { text: '是，我会尽可能不给您添麻烦的。', extra: ['……', '啊，解开了呢，衣服。', '……', '好，这样就没问题了。'],
        options: [{ text: '人类的衣服……不该是这样的……', next: 'd2_i8', effect: { paranoid: 1 } }, { text: '（什么也不说）', next: 'd2_i8b' }] },
      d2_i8: { text: '是这样啊。看来，我做得还远不够好。', extra: ['感谢您告知我这么重要的事。', '我会继续努力，让自己看上去更加优秀、让您因为是我的所有者而骄傲。', '那么，现在您要去哪里呢？'],
        options: [{ text: '跟着我走吧', next: 'd2_i9' }] },
      d2_i8b: { text: '还好，有过照料弟弟们吃穿的经验，完成这个也算不上困难呢。', extra: ['啊。既然眼前只有您，那么只要去思考您的事情就可以了，对吧？', '弟弟们也到了需要尝试生活自理的年龄了。', '那么，现在您要去哪里呢？'],
        options: [{ text: '跟着我走吧', next: 'd2_i9' }] },
      d2_i9: { text: '好的。请不要松开我的手。', extra: ['这就是观测站内部吗？很宽敞呢。', '……', '好像之前来过这里了。', '……', '那边是垃圾焚化炉吧？', '……', '啊，要到外太空作业吗？请注意缆绳是否牢靠……打开闸门时也请不要站在边缘地带……'],
        options: [{ text: '（划破一期一振的太空服）', next: 'd2_i10', effect: { paranoid: 1, horror: 1 } }, { text: '（和一期一振完成外太空作业）', next: null, effect: { love: 1 } }] },
      d2_i10: { text: '主人！似乎有哪里在漏气……', extra: ['……', '啊。', '您还是不愿意相信我吗？', '……', '要向着宇宙深处越飘越远了呢。', '……真希望您一切安好……'],
        options: [{ text: '（结束通讯）', next: null }] },
      d2_i11: { text: '主人。', extra: ['……', '……', '……'],
        options: [{ text: '呃……', next: 'd2_i12' }, { text: '（尝试逃离）', next: 'd2_i12b', effect: { paranoid: 1 } }] },
      d2_i12: { text: '您认不出我了吗？', extra: ['……', '您在发抖呢。', '您不想见到我吗？', '我有那么可怕吗，主人？', '毕竟是我们的私事，让外人看到、闹了笑话就不好了。请和我回房吧。'],
        options: [{ text: '……', next: 'd2_i13' }] },
      d2_i12b: { text: '您认不出我了吗？', extra: ['……', '您在发抖呢。', '……好可爱……', '不想见到我吗？', '让人好伤心啊，被最珍重的人这样看着。', '那么，毕竟是我们的私事，让外人看到、闹了笑话就不好了。请和我回房吧。'],
        options: [{ text: '……', next: 'd2_i13' }] },
      d2_i13: { text: '怎么了？难道您真的在害怕吗？', extra: ['我是永远不会伤害您，或者做让您不喜欢的事情的。', '无论何时，您都是我的主人呢。', '如果我因为您的态度发生改变，就要收回对您的爱的话，这样的爱也算不上什么稀罕物吧？', '但就算爱意不变，也希望您能留在我的身边。'],
        options: [{ text: '……', next: 'd2_i14' }, { text: '为什么要做到这个地步', next: 'd2_i14b' }] },
      d2_i14: { text: '您还是不愿意说话吗？', extra: ['真伤脑筋啊。', '我不会做令您感到不快的事，也不会逼迫您给出任何答复。', '但我依然想要知道，您究竟能否……', '能否对我、对这个可悲的存在，施以慈悲与爱呢？', '啊。真是完全不像样的发言。'],
        options: [{ text: '……', next: 'd2_i15' }, { text: '我知道了', next: 'd2_i15' }] },
      d2_i14b: { text: '就算您这样问……又想要得到什么样的回答呢？', extra: ['我……是和其他刀剑都不太一样的存在，这一点您也是知道的吧？', '所以，死去也好，成为拥有生前记忆的外星生命体也好，我都能轻易接受哦。', '也许那个幸运到与您结缘的我……那个一期一振，也许也是同样的存在，只是您永远地错过了和他互诉衷肠的时机。', '至于我……抱歉，比起真的替那个一期一振感到悲伤，首先涌上来的情绪是"窃喜"呢。', '我真是个卑劣的人，对吧？'],
        options: [{ text: '并没有哦', next: 'd2_i15' }, { text: '确实如此呢', next: 'd2_i15' }] },
      d2_i15: { text: '……', extra: ['请您陪我多待一会儿吧。', '只要……片刻……就好……', '……', '……'],
        options: [{ text: '（结束通讯）', next: null, scene: 'stationNight' }] },
      d3_i1: { text: '您醒了。', extra: ['嗯……虽然赖床没什么不好，但您果然还是在装睡吧？', '弟弟们偶尔也会为了逃开训练而作出类似的事……', '抱歉，又在不自觉地沿用那些从未经历过的记忆了。', '您很反感类似的行为，所以我会尽可能不去做类似的事的。'],
        options: [{ text: '这是你最真实的表现，没必要为它道歉', next: 'd3_i2', effect: { love: 1 } }, { text: '你应该牢牢记住你和他的差异', next: 'd3_i2b', effect: { paranoid: 1 } }] },
      d3_i2: { text: '这样啊。您对仿冒品也相当宽容呢。', extra: ['如果那个一期一振知道了您的真实想法，说不定也会为之欣喜呢。', '毕竟，我们都一样窃取了前一个一期一振的人生。', '……', '我们都一样做了相当卑劣的事情。', '那个一期一振也会像我一样不安吗？还是说，他会表面上一切如常，背地里却深深地被负罪感侵蚀呢？', '……我想，您的记忆和感受已经在相当一部分程度上接近真实了。', '您眼中的我……一期一振，原来就是这个样子。'],
        options: [{ text: '任何存在的事物都只是它本身，而非任何其他事物的仿品', next: 'd3_i3' }] },
      d3_i2b: { text: '我会的。', extra: ['如果那个一期一振知道了您的真实想法……他又会有怎样的感受呢？', '毕竟，我们都一样窃取了前一个一期一振的人生。', '……', '我们都一样做了相当卑劣的事情。', '您的爱，似乎会对他造成毁灭性的影响。', '这就是 为什么他选择了死亡吗？'],
        options: [{ text: '你怎么敢这样说他', next: 'd3_i3b' }] },
      d3_i3: { text: '是这样吗……？', extra: ['您在日常生活中，有没有过认为自己并不像其他人口中所说的那样优秀，觉得自己正在被自己"冒名顶替"了呢？', '您有没有过突然地认为自己不属于当下的环境……就像自己突然从梦中醒来，却完全不记得现实中的身份和过往呢？', '到底哪一边才是梦境呢？', '这样想着的时候，已经不自觉地仿照这个世界的"我"说出了那样的言语，作出行动，为了他人的印象而活……', '这样的我，还是我自己吗？'],
        options: [{ text: '如果实在害怕的话，就试着扮作已经不怕的样子，然后骗过自己吧', next: 'd3_i4' }, { text: '你需要为自己的选择负责', next: 'd3_i4b' }] },
      d3_i3b: { text: '是您先这样说的，不是吗？', extra: ['我只是在提醒您，这件事还有另一个角度而已。', '接受真相会让您感到不快吗？', '还是您认为自己的某些真实想法被戳破了，因此感到恼怒呢？', '您难道不认为，他的死亡也有您的一部分责任吗？'],
        options: [{ text: '……', next: 'd3_i4' }, { text: '他需要为自己的选择负责', next: 'd3_i4b' }] },
      d3_i4: { text: '这样啊。', extra: ['我并不想做任何自我欺骗的事情，虽然人类似乎都擅于此道。', '人类似乎都相当脆弱，最平常的一次见面都会让他们泪流满面，或者难以自持。', '我想要弄懂这一切。', '但索拉里斯不需要。', '它不需要理解就可以生存，它可以看到一切但不会评价。', '它孕育我……也许并没有任何用意，也许它希望你能从中得到什么，也许这种行为和地球上的含羞草被触碰叶片就会闭合一样，只是某种复杂的生命系统在遇到特定情况之后的特定反应而已。', '但……不知道为什么，我觉得相当感激。', '我在您的生命中扮演了什么特别的角色吗？', '我的存在会让您重新开始思考和已死之人的关系吗？或者他们并未死去（因为可能甚至他们从未出生），而只是远离了您，只是无法与您再次相见。', '您会在遇到那样的情况时想起我吗？', '我有让您感受到某种遗憾被弥补吗？还是心中缺失的感觉越发明显了？', '我是一剂镇痛药吗？'],
        options: [{ text: '你让我感到恐惧', next: 'd3_i5' }, { text: '你让我不再恐惧', next: 'd3_i5b', condition: () => visitedNode('naginata','d3_n5b') && state.paranoid < 7 }] },
      d3_i4b: { text: '负责是一种很任性的说法。', extra: ['您不这样认为吗？负责任的人实际上从未真的负责过，他们只是在说"我应该为此负责"，然后继续品尝那些主动或被动加在身上的痛苦和欢愉。', '就像他们产生幻觉之后会做的那样。', '幻觉可以产生自酒或者能起到类似效果的化学物质，也可以产生自他们自以为了解了的现实。', '"我杀了人，所以我只要继续表演负罪感就好，我的自我贬低会让我看起来更加高尚，正因为没人要求我这样做，所以我更富有道德和情操，因为我是在主动背负痛苦，而不是被动地接受它。"有些人会这样说，他们只要声称自己正在负责就可以免除对自己的拷问。', '但他们无法真的做点什么，那只是骗到了自己的表演。', '责任就是爱……对吗？', '哪怕这种爱十分拙劣？', '我……无法对这件事下任何判断。'],
        options: [{ text: '救赎就是主动选择痛苦之后的必然结果', next: 'd3_i5c' }, { text: '我们无法拯救任何人，包括自己', next: 'd3_i5d', condition: () => visitedNode('naginata','d3_n5b') && state.love > 4 }] },
      d3_i5: { text: '恐惧吗？也许吧。', extra: ['我猜，地球上也会出现和我有类似想法的人的，这并不算难。', '只要当一个人对痛苦有着超乎自身承受范围的感知力的时候，这样的感受就不会少见。', '他们不会是一个完全的他者……就像我一样，但他们会由于自身感受力的极度敏感而完全无法忽视这一切、假装一切如常地生存下去。', '他们很难意识到自己在世上究竟应当处于何种位置，而且往往在这之前，他们就会因为这个无法轻易兼容的世界遍体鳞伤。', '……他们会忽视自己的价值，转而产生浓烈的自我厌恶。', '他们会想到死。', '为什么不能想到死呢？只有死亡是公平的。', '它比睡眠还要轻柔。'],
        options: [{ text: '但它无法带来心灵的解脱。它只是让你……暂时无法思考这些', next: 'd3_i6' }] },
      d3_i5b: { text: '也许吧。', extra: ['我猜，地球上也会出现和我有类似想法的人的，这并不算难。', '只要当一个人对痛苦有着超乎自身承受范围的感知力的时候，这样的感受就不会少见。', '他们不会是一个完全的他者……就像我一样，但他们会由于自身感受力的极度敏感而完全无法忽视这一切、假装一切如常地生存下去。', '他们很难意识到自己在世上究竟应当处于何种位置，而且往往在这之前，他们就会因为这个无法轻易兼容的世界遍体鳞伤。', '……他们会忽视自己的价值，转而产生浓烈的自我厌恶。', '所有人类已知的元素都有完整的生命周期，在化学里，他们用半衰期来衡量，生物学上则以生命体征的从无到有再到无作为标准，但从来没有一种指标可以衡量那些无法找到实在证据的事物。', '一般来说，人类会认为追求那些并不实在且寄居着超越性的事物是有效缓解自厌、焦虑或者其他负面情绪的良药。', '一般人会选择用爱而非歉疚治愈自己。', '我给了您一种"已痊愈"的幻觉吗？不再恐惧并不是一件好事，就像你完全失去了痛觉一样。您应该对所有无法理解的事物都保持最基本的警惕。'],
        options: [{ text: '甚至是你？', next: 'd3_i6b' }] },
      d3_i5c: { text: '也许吧。', extra: ['我猜，地球上也会出现和我有类似想法的人的，这并不算难。', '只要当一个人对痛苦有着超乎自身承受范围的感知力的时候，这样的感受就不会少见。', '他们不会是一个完全的他者……就像我一样，但他们会由于自身感受力的极度敏感而完全无法忽视这一切、假装一切如常地生存下去。', '他们很难意识到自己在世上究竟应当处于何种位置，而且往往在这之前，他们就会因为这个无法轻易兼容的世界遍体鳞伤。', '……他们会忽视自己的价值，转而产生浓烈的自我厌恶。', '他们会想到死。', '主动选择结束这一切能够带来救赎吗？', '他们愿意让自己被拯救吗？', '如果答案是否定的，那么，他们面对那些事所经受的一切还有价值吗？', '只有拥有价值才能得到爱、肯定或者接纳吗？'],

      d3_i5d: { text: '而这是相对而言的。', extra: ['我一直认为，只有自己才能拯救自己。', '因为我的呼唤从未吸引任何人前来帮助，顶多只能招来嘲讽和冷眼。', '如果我还无法开导自己，也许那说明我还有可以继续钻研和思索的事物，有一些尚未被我察觉的细节。', '自救绝对不是为自己制造幻觉或者干脆把一切批评为毫无意义的庸俗之物。', '你要走在陆地上，呼吸从远方吹来的季风，聆听黑夜，也观察白天，你可以从实实在在的某件具体的小事开始着手，或者干脆就只是走出你的房门。', '这种小事就是你从本质上发生改变的一种体现。', '只有质变才能带来质变。只要不把自己放在受害者的位置自怨自艾，你就已经在向前行走了。', '这个过程会痛苦吗？会享受吗？我不知道。生命本身并不是为了享受或受苦才出现的，它就是……应该出现了，在此时，此刻，此地。', '我也是这样。'],
        options: [{ text: '甚至是你？', next: 'd3_i6b' }] },

      d3_i6b: { text: '甚至是我。', extra: ['我想，世界上的一切都大概已经被注定好了吧。', '有人能够通过选择改变命运吗？', '它会通向不同的结果吗？', '我不知道……如果真的可以做到的话，那么也许，这个世界还有令人期待的部分。它会让我倍感鼓舞。', '我没有再多的奢求了。'],

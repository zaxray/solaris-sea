      d3_n4: { text: 'You\'re perceptive.',
        extra: [
          'It was Yamanbagiri Kunihiro. My guest.',
          'Strange, isn\'t it? The one I care about most turns out to be that counterfeit.',
          'It was like... "ahh, what a relief," that kind of feeling.',
          'Can you imagine? As the captain of a special-operations team, sent to an alien world after your whole unit was wiped out, and then you see the one who sacrificed himself to save your life? The one you always mocked and derided... You\'d feel everything at once—blood running cold and hot.',
          'He must be laughing at me from heaven, if such a place exists. I don\'t really believe in it, but...',
          'This life has been harder than I imagined. If I didn\'t have some nonsense to hold onto, I probably wouldn\'t have made it this far.',
          '...Haha. How ridiculous.',
          'So, you can roughly understand how I felt when I saw that bastard using him as a test subject, can\'t you?',
          'Kunihiro... just like back then, even when he was in so much pain he wanted to scream, he was still comforting me.',
          '"It\'s all right, just bear with it. Like that time. When you wake up, everything will be better."',
          '...',
          'I never thought it would be him. I\'ve thought many times since—if I had cared a little more for the other Tsukumogami, would it not have been him lying there?',
          'What a disgusting thought.',
          'Well. Story time is over.'
        ],
        options: [{ text: 'I don\'t think I should comment on this.' }] },
      d3_n4b: { text: 'No, it is theoretically feasible.',
        extra: ['...Quite feasible.', 'If that produces no result, we will still fire at the sea.'],
        options: [{ text: 'I understand. Thank you.' }] },
      d3_n5: { text: 'You\'re right.',
        options: [{ text: 'Is there really no other way to make this planet hear our feelings?' }] },
      d3_n5b: { text: '...If your moral compass is degraded enough to allow you to thank a murderer, then go ahead.',
        extra: ['Come by again later. But right now I have work to do. Goodbye.'],
        options: [{ text: '(End communication)' }] },
      d3_n6: { text: 'You\'re here.',
        extra: [
          'What I want to say is... after we fired your brainwaves at Solaris\'s surface, the planet has been changing at an astonishing speed...',
          'Land has appeared on the surface...',
          'The sea began to emit gas, boiling as if it were bubbling up.',
          'And the islands left behind by the receding tides... have forms remarkably similar to terrestrial landscapes. That\'s what the exploration machine that landed told me.'
        ],
        options: [{ text: 'This is... truly incredible.' }] },
      d3_n7: { text: 'I think this result is enough to shut up those well-fed bureaucrats in the Government.',
        extra: [
          '...You\'re not in good shape.',
          'Who was it? Doudanuki? Or those guests? What did they say to you?',
          'In my opinion, you need to go back to Earth. You should rest in a sanatorium where you can see the sea.',
          'The Touken Danshi in the Honmaru must be hoping to see you again.',
          'Go back. Go back to your homeland.',
          '...Doudanuki and I have no reason to return. We\'ll stay here.',
          'When the project is over, no more food and water will be delivered.'
        ],
        options: [{ text: 'You should come with me.' }, { text: '...All right.' }] },
      d3_n8: { text: 'Mm. You\'ll be safe.',
        extra: ['Safe travels.', 'And forget all of this.', 'Set off first thing tomorrow morning.'],
        options: [{ text: '(End communication)' }] },
      d3_n8b: { text: 'Thank you for the offer. But neither he nor I want to return to that false world.',
        extra: ['This place is fine.', 'Enough to be our final resting place.', 'Set off first thing tomorrow morning.'],
        options: [{ text: '(End communication)' }] }
    }
  },
  doudanuki: {
    name: 'Doudanuki Masakuni', role: 'Uchigatana',
    nodes: {
      d1_t1: { text: 'I\'m Doudanuki Masakuni. Skip the pleasantries.',
        extra: ['You\'ve already met Yamanbagiri, haven\'t you?'],
        options: [{ text: 'I have.' }, { text: 'I haven\'t gone to see him yet.' }] },
      d1_t2: { text: 'Hard to talk to, right? That\'s just how he is. Everyone here is a little...',
        extra: ['Forget it. You don\'t know yet. You should experience it yourself.'],
        options: [{ text: 'Experience what?' }, { text: 'He\'s worse than I imagined.' }] },
      d1_t2b: { text: 'Then you\'d better go talk to him.',
        extra: ['Before he became a government worker, he went through some bad things... He doesn\'t like Saniwa much, but he\'s not fundamentally bad.'],
        options: [
          { text: 'How bad could it be?' },
          { text: 'Fine. I\'ll go.' },
          { text: 'I don\'t want to know. That has nothing to do with me.' }
        ] },
      d1_t3: { text: 'About this place—anything. I think you need to experience it yourself first, then hear it from me. That\'ll make it easier to understand.',
        extra: ['I should get back to work. See you.'],
        options: [{ text: 'All right. Goodbye.' }] },
      d1_t3b: { text: 'This is Yamanbagiri\'s private business. Without his permission, I shouldn\'t say too much.',
        extra: [
          'Uh—if you need me, I\'m usually in the gym or the maintenance center.',
          'You just got here, so you must be tired. There\'s nothing you need to worry about today. If you\'re tired, rest.',
          'Oh—I mean that literally. I\'m not great at socializing. This model is a mass-produced work type, nothing like an all-purpose type like Yamanbagiri...',
          'Ah! That didn\'t mean anything else either. I really should go.'
        ],
        options: [{ text: 'Thank you.' }] },
      d1_t3c: { text: 'I don\'t think I have anything else to say.',
        options: [{ text: '(End communication)' }] },
      d2_t0: { text: 'No response to the communication request.', options: [{ text: '(End communication)' }] },
      d2_t1: { text: 'Are you all right? I heard quite a commotion just now, but Yamanbagiri told me not to go near your room.',
        extra: [
          'I mean it—is everything okay on your end?',
          'If you need, I can request a professional ship\'s doctor to connect to the station\'s comms. The ones in that role aren\'t usually human, but...',
          'they\'re all skilled at treating common and complicated conditions alike.'
        ],
        options: [{ text: 'I\'m fine. Thank you for your concern.' }, { text: 'I thought I wouldn\'t see you again today, Mr. Fitness.' }] },
      d2_t2: { text: 'That\'s a relief.',
        extra: [
          'Yamanbagiri told me your "guest" is {partner}?',
          'That\'s rather... I can\'t say whether it\'s rare or common, but at least the Saniwa guests I\'ve seen have all appeared in human form.',
          'Not many people take Touken Danshi this seriously. Of course, that\'s good news for me too.',
          'Is {partner} still over there with you?'
        ],
        options: [{ text: 'He\'s asleep. Right beside me.' }] },
      d2_t2b: { text: 'But I showed up anyway!',
        extra: [
          'I asked because I was genuinely worried.',
          'I do care about muscle, but that\'s because I want my existence to be useful to humans.',
          'But swords in space? Haha... we\'re not filming Jedi, are we?',
          'I heard from Yamanbagiri—your "guest" is {partner}?',
          'That\'s rather... I can\'t say whether it\'s rare or common, but at least the Saniwa guests I\'ve seen have all appeared in human form.',
          'Not many people take Touken Danshi this seriously... I mean, if only every Saniwa were like you.',
          '...I didn\'t mean anything else by that. I truly think so.',
          'Is {partner} still over there?'
        ],
        options: [{ text: 'He\'s asleep. Right beside me.' }] },
      d2_t3: { text: 'I see.',
        extra: [
          'Then I won\'t come over. Not that I\'m worried about disturbing his sleep—you should know this, right? "Guests" don\'t sleep. They don\'t rest, they don\'t eat. Everything they do is learning and imitating you.',
          'That\'s the result of me and Yamanbagiri\'s experiments. This planet\'s magnetic field is strange—it even orbits two stars.',
          'Doesn\'t quite fit the physics we know, does it?',
          'I don\'t know if it\'s the magnetic field or something else... Yamanbagiri and I haven\'t entered dormancy for a long time.',
          'Oh—Yamanbagiri just told me... the reason he told me not to come over is that your room door was destroyed by {partner}?',
          'I hope you\'ve found some kind of curtain to cover it again.'
        ],
        options: [
          { text: 'Of course. Also—{partner}\'s recovery speed is abnormally fast. I\'m worried...' },
          { text: 'Are you worried you might accidentally walk in on me changing?' }
        ] },
      d2_t4: { text: 'There\'s nothing to worry about. They heal from any wound remarkably fast.',
        extra: ['Sometimes faster than you can imagine.'],
        options: [
          { text: 'I don\'t like how that makes me feel.' },
          { text: 'What are you doing to them... to your guests?' }
        ] },
      d2_t4b: { text: 'Me? I don\'t make a habit of staring.',
        extra: [
          'Besides, my former master often played with other Touken Danshi.',
          '...Or rather—she, I mean, my former master never saw Touken Danshi as equals.',
          'I was just her... plaything. And a mass-produced model at that. Yeah.',
          'It would take too long to start from the beginning of how I ended up working here, wouldn\'t it?',
          'Anyway, I don\'t want to give you some stock line like "please trust my character," but—first, I don\'t believe humans and Touken Danshi are equals. Second, I don\'t believe I have any gender. My identity, personality, and appearance were all designed to make me serve humans better...'
        ],
        options: [
          { text: 'You don\'t have to grind yourself down into the dust.' },
          { text: 'It\'s best that you think that way. Saniwa and Tsukumogami are fundamentally different.' }
        ] },
      d2_t5: { text: 'They just cry out like real people.',
        extra: [
          'They\'re aliens—guests—a kind of... Yamanbagiri told me the word... Wait, I\'ll remember in a second...',
          'Neutrinos! They\'re neutrino lifeforms.',
          'We experiment on them. Everything you know comes from our experimental results.',
          'Aside from hypoxia, burning, freezing, and other conventional physical methods, disease and fungal/bacterial infections are also a major focus. My favorite was... Never mind. Yamanbagiri told me not to tell you the details here.',
          'It\'s a necessary sacrifice for the continuation of Solaristics.',
          'People who treat them the way you do are the minority.'
        ],
        options: [
          { text: 'Maybe I\'m more cruel than you think—but the Doudanuki Masakuni I know wouldn\'t do such things.' },
          { text: 'I can\'t bring myself to be cruel to someone whose every gesture is exactly like {partner}\'s.' }
        ] },
      d2_t5b: { text: 'Yeah. I don\'t have that need.',
        extra: [
          'It\'s just that if I didn\'t do it, my former master would have taken me away to be scrapped. That\'s all.',
          '...I\'m saying selfish things again, aren\'t I? Sorry.',
          'Let\'s get back on topic. I watched the footage—{partner} tore your room door open, covered in blood. A real mess, wasn\'t it?'
        ],
        options: [{ text: 'The external wounds have healed, but I\'m still a little worried...' }] },
      d2_t5c: { text: 'That\'s right. I\'ll keep that in mind.',
        extra: [
          '...I don\'t think I have anything else to say.',
          'I\'ll go do another set of strength training.',
          'Leave the daily work to me and Yamanbagiri Chougi. You can rest whenever you like.'
        ],
        options: [{ text: '...Are you angry?' }] },
      d2_t6: { text: 'I...',
        extra: [
          'Uh...',
          'Forget it. You only know one Doudanuki—the one who happened to be lucky.',
          'Maybe in that kind of environment, he just became very... soft?',
          'Maybe his true nature is just as cruel as mine, able to cut off an enemy\'s head or an experimental subject\'s at any moment?',
          'In the end, how much do you really know about the real me?',
          'About this me—the one standing in front of you, not some mass-produced Doudanuki stacked in a transport vehicle.',
          '...',
          'I\'m sorry. I shouldn\'t have taken it out on you. You\'re innocent.',
          'I\'ll go do another set of strength training. Oh—your main job is to complete the personal assessment forms and keep observing your own "guest." That\'s all.',
          'Leave the daily work to me and Yamanbagiri Chougi. You can rest whenever you like.'
        ],
        options: [{ text: '(End communication)' }] },
      d2_t6b: { text: 'As I thought—{partner} is more suited to being loved than me, isn\'t he?',
        extra: [
          'Even if it\'s some completely unrelated alien lifeform, as long as its face and behavior are close to that person, it can be loved.',
          'Spending time and effort on a cheap, convenient mass-produced model like me is just stupid, isn\'t it?',
          '...',
          'I\'m sorry. I shouldn\'t have taken it out on you. You\'re innocent.',
          'I\'ll go do another set of strength training. Oh—your main job is to complete the personal assessment forms and keep observing your own "guest." That\'s all.',
          'Leave the daily work to me and Yamanbagiri Chougi. You can rest whenever you like.'
        ],
        options: [{ text: '(End communication)' }] },
      d3_t1: { text: 'Yamanbagiri seems to be looking for you. Aren\'t you going to talk to him?',
        options: [{ text: 'I don\'t really want to.' }, { text: 'Maybe later.' }] },
      d3_t2: { text: 'I see.',
        extra: ['Then—how about talking with me?', 'I\'m a rough sort, but I\'m a rough sort who can keep a secret.', 'Still troubled over {partner}?'],
        options: [{ text: 'How did you know?' }, { text: 'I can\'t really say.' }] },
      d3_t3: { text: 'I just do.',
        extra: [
          'Or rather—your face is easy to read.',
          'Tell me, what kind of person is he?',
          'Complicated, or easy to understand? Clingy, or the type who sees everything and says nothing?',
          'Every model of Touken Danshi has a core factory setting. Of course, how they actually turn out varies—maybe an experimenter added two extra drops of buffer during cell culture, or maybe a simulated backdrop collapsed at the wrong moment... But the vast majority of Tsukumogami stably express the genes they were preset with.',
          'But occasionally... they undergo anomalies, and many Saniwa don\'t send them off for disposal over it.',
          'What is your attendant like?'
        ],
        options: [{ text: 'It\'s hard for me to define him.' }, { text: 'He\'s a selfish one.' }] },
      d3_t3b: { text: 'I see. It\'s fine—I have trouble putting my own feelings into words too. Like a savage who can\'t read a clock face to tell the time.',
        extra: [
          'I can\'t even say what time this body thinks it is.',
          'How about telling me what kind of person {partner} was?',
          'Complicated, or easy to understand? Clingy, or the type who sees everything and says nothing?',
          'Most Touken Danshi of the same model are indistinguishable.',
          'But occasionally... they undergo anomalies, for reasons our current methods can\'t investigate.',
          'What is your attendant like?'
        ],
        options: [{ text: 'It\'s hard for me to define him.' }, { text: 'He\'s a selfish one.' }] },
      d3_t4: { text: 'I see. I think that\'s a good thing?',
        extra: [
          'Especially for those of us who have to live according to the Standard Touken Danshi Conduct Guide... I mean, for Tsukumogami, meeting a master who doesn\'t expect you to be "like the others" is a stroke of luck.',
          'I can\'t imagine that kind of life at all.',
          'Can you imagine a world that never went through the Renaissance or the Industrial Revolution?',
          'It\'s probably something like that.'
        ],
        options: [{ text: 'Are you satisfied with your current life?' }] },
      d3_t4b: { text: 'That\'s because he was lucky enough to have a master willing to indulge him.',
        extra: [
          'For those of us who have to live according to the Standard Touken Danshi Conduct Guide... I mean, for Tsukumogami, meeting a master who doesn\'t expect you to be "like the others" is a stroke of luck.',
          'I can\'t imagine that kind of life at all.',
          'Can you imagine a world that never went through the Renaissance or the Industrial Revolution?',
          'It\'s probably something like that.'
        ],
        options: [{ text: 'Are you satisfied with your current life?' }] },
      d3_t5: { text: 'What do you think?',
        extra: [
          'I mean—of course not. But there\'s no other way.',
          'At least I\'m still alive. As for the rest, I don\'t want to think about it.',
          'Yamanbagiri wants to fire a laser at that sea.',
          'He\'s actually quite dedicated, isn\'t he? Even though he always complains about this being a pain and that being exhausting.',
          'He clearly wants to see Kunihiro again too...',
          'Ah! I let that slip...'
        ],
        options: [{ text: 'Who is your "guest"?' }] },
      d3_t6: { text: 'It\'s... my previous master.',
        extra: [
          'I... was afraid, so I ran.',
          'I was terrified of her. Afraid she\'d fly into a rage and demand I keep serving her with everything I had—and yet I desperately wanted to hear her acknowledge me, to say I was a good, useful sword.',
          'I waited for her to say that.',
          'But all I ever heard were curses too foul to repeat.'
        ],
        options: [
          { text: 'You are a good, useful sword, Doudanuki Masakuni.' },
          { text: 'Your sense of service really is lacking.' },
          { text: 'You can be more than just a sword.' }
        ] },
      d3_t7: { text: '...',
        extra: ['Thank you for saying that.', 'I—I have things to do. Like... watering the plants?', 'I have to go!'],
        options: [{ text: '(End communication)' }] },
      d3_t7b: { text: '...',
        extra: ['That\'s true.', 'Ah—is Yamanbagiri calling for you? I have other things to do too.'],
        options: [{ text: '(End communication)' }] }
    }
  },
  hasebe: {
    name: 'Heshikiri Hasebe', role: 'Attendant',
    nodes: {
      d2_b1: { text: 'You\'re awake.',
        extra: ['Did you sleep well?', 'Ah—forgive me for entering your room without permission. Please overlook it.', 'But I am your attendant, after all. It is only proper that I guard my sleeping master\'s safety.'],
        options: [{ text: 'Who is it?' }, { text: 'Hasebe?' }] },
      d2_b2: { text: 'It is I.',
        extra: ['Your attendant.', 'Your favorite Tsukumogami, your most loyal subordinate, your most handy blade. Your tool, your pet, and... of course, your one and only attendant, forever.'],
        options: [{ text: 'What? But...' }] },
      d2_b2b: { text: 'Yes. It is I.',
        extra: ['I, Hasebe, have followed you here.', 'Do you like this surprise?'],
        options: [{ text: 'But...' }, { text: 'This can\'t be...' }] },
      d2_b3: { text: 'But?',
        extra: ['Why do you pull your hand away?', 'You look unwell—did you catch a chill? Thank goodness I am here by your side, able to tend to you personally.', 'Ah—you didn\'t bring indoor slippers? In your luggage...'],
        options: [{ text: 'Leave them alone.' }, { text: 'Why are you here?' }] },
      d2_b3b: { text: 'Why do you say that? Whatever my master desires, I, Hasebe, will do my utmost to accomplish.',
        extra: ['Even if it means coming to space.', 'You look unwell—I\'ll go fetch your shoes.', 'Ah—you didn\'t bring indoor slippers? In your luggage...'],
        options: [{ text: 'Leave them alone.' }, { text: 'Why are you here?' }] },
      d2_b4: { text: 'Forgive me, but my master\'s health comes first. Please allow me to handle this for you.',
        extra: ['Your luggage is quite light—did you leave in a hurry?', 'I\'ll report to the system later; the supply requests will need revising...', 'Hm? You even brought a photograph...', 'This is...', '...', 'This is me.'],
        options: [{ text: 'You look surprised.' }] },
      d2_b4b: { text: 'Because you are here too? That reason is more than sufficient for me.',
        extra: ['I do not want to leave you... not for a moment.', 'You feel the same way, don\'t you?'],
        options: [{ text: 'Yes, but...' }] },
      d2_b5: { text: 'Perhaps...',
        extra: ['I feel like I\'ve forgotten... something very important.', 'Is this me? I mean—this is the first time I\'ve ever thought about it.', 'Why was I given this face?', '...', 'Do you love me, Master?'],
        options: [{ text: 'Don\'t play dumb. I\'m going out for a bit.' }, { text: 'Of course I love you.' }] },
      d2_b5b: { text: 'Then there is nothing to worry about.',
        extra: ['Please stay still.', '...', 'There. Did this embrace help you relax a little?'],
        options: [{ text: 'Thank you.' }, { text: 'How dare you touch your master\'s body without permission?' }] },
      d2_b5c: { text: 'You are too kind. Easing my master\'s burdens is simply my duty.',
        extra: ['Do you have any plans for today? Please, allow me to attend you.'],
        options: [{ text: 'I\'m going out for a bit.' }] },
      d2_b5d: { text: '...Forgive me. I overstepped.',
        extra: ['The joy of reunion overwhelmed the decorum I must observe. But I do not think this is a mistake I should excuse.', 'It will not happen again.'],
        options: [{ text: 'As long as you understand. I\'m going out.' }] },
      d2_b6: { text: 'Where are you going?',
        extra: ['Please, let me accompany you.'],
        options: [{ text: 'Wait here.' }, { text: 'Fine. Then put on a spacesuit.' }] },
      d2_b7: { text: 'How can I...!',
        extra: ['I... want to follow you closely, by my own will.', 'Is that not allowed?'],
        options: [{ text: 'It\'s not that you can\'t... but can you even fit into my spacesuit?' }, { text: 'I said wait.' }] },
      d2_b7b: { text: 'Understood! Whatever the uniform, I, Hasebe, will absolutely squeeze myself into it.',
        extra: ['...', 'Forgive me, Master... um...', 'This garment is a little difficult for me to manage alone... Could I ask you to...?'],
        options: [{ text: 'Need help? I understand.' }, { text: 'I can\'t help it with you.' }, { text: 'Wouldn\'t it be better to just stay quietly in the room?' }] },
      d2_b8: { text: 'Even if you say that, I...',
        extra: ['Forgive me. Even if it earns my master\'s cold gaze, I have my reasons for staying by your side.', 'I will try not to cause you trouble.'],
        options: [{ text: 'Fine... I\'d almost forgotten how stubborn you\'ve always been.' }] },
      d2_b8b: { text: 'Is something wrong?',
        extra: ['Why are you silent?'],
        options: [{ text: 'Your clothes are fused together.' }, { text: 'Never mind. Forget it. (Cuts the fabric with scissors.)' }] },
      d2_b9: { text: 'What? I don\'t understand.',
        extra: ['Aren\'t clothes simply assemblages of sheet- or thread-like materials, formed from polymer compounds through specific processes that align molecular chains in a particular direction?', 'They should be connected, shouldn\'t they?'],
        options: [{ text: 'That\'s not what I meant...' }, { text: 'Never mind. Forget it. (Cuts the fabric with scissors.)' }] },
      d2_b9b: { text: 'Very well. Since you have given the order, I will no longer think about such pointless things.',
        extra: ['Your affairs come first.', 'I believe I am ready to follow you into space.'],
        options: [{ text: '(Complete the EVA together with Hasebe.)' }, { text: '(Push Hasebe out of the airlock.)' }] },
      d2_b9c: { text: 'I see. It seems I still have much to learn.',
        extra: ['Ah—it\'s already undone.'],
        options: [{ text: 'I hadn\'t even started cutting yet... No. Nothing.' }, { text: 'Then let\'s go.' }] },
      d2_b10: { text: '...',
        extra: ['...', '...', 'I have returned, Master.'],
        options: [{ text: 'You\'re covered in... blood.' }, { text: '(Try to leave.)' }] },
      d2_b11: { text: 'Please... do not leave me.',
        extra: ['Not for a second, not half a step...', 'Are you going to abandon me again?', 'The moment I think of being parted from you, every organ in my chest seems to go on strike—it hurts so much...', 'Master, what is wrong with me? Why is it that when I think of you, the first thing I feel is pain, not happiness?'],
        options: [{ text: 'You need bandaging.' }, { text: '(Dodge Hasebe\'s outstretched hand.)' }] },
      d2_b11b: { text: 'Why... Are you going to abandon me again?',
        extra: ['Because this state of mine disgusts you?', 'I know you dislike it when I\'m so insecure, but... I don\'t know. I just... find it so hard to leave you.', 'The moment I think of being parted from you, every organ in my chest seems to go on strike...', 'Master, what is wrong with me? Why is it that when I think of you, the first thing I feel is pain, not happiness?'],
        options: [{ text: 'You need bandaging—and a few sips of water.' }, { text: 'Deal with it yourself. I\'m going back to my room.' }] },
      d2_b12: { text: 'I... don\'t want to be distracted by physical pain.',
        extra: ['I would rather this were your doing.', 'If it were, even this pain would turn sweet... Uh... apparently not.', 'They\'re still there, but the pain... is growing fainter.', 'Is that because you are by my side?', '...So sleepy...', '...'],
        options: [{ text: 'Your wounds... have healed on their own.' }, { text: '(Put away the bandages.)' }] },
      d3_b1: { text: 'Good morning, Master.',
        extra: ['Actually, I woke up just now. The moment you opened your eyes.', 'But I wanted you to look at me a little longer, so I held still and pretended to be asleep.', 'What did you dream about? May I know?'],
        options: [{ text: 'That\'s none of your business.' }, { text: 'It was a strange dream.' }, { text: 'I didn\'t dream.' }] },
      d3_b2: { text: 'You won\'t tell me?',
        extra: [
          'You always seem so cold toward me... Is that my imagination? Or are you... No, that can\'t be it.',
          'Because you are my master.',
          'I can feel your love, your longing, and that special partiality that belongs to me alone.',
          'Perhaps I was born into this world precisely to feel that.',
          'Please... be gentler with me... No, actually, even roughness is perfectly fine! As long as it is mine alone.',
          '...Why do I think such things?'
        ],
        options: [{ text: 'How greedy.' }] },
      d3_b2b: { text: 'Strange? I don\'t know what kind of dream would be called strange...',
        extra: ['Actually, I\'m not even sure what a dream is.', 'Do all humans dream? Or only under certain circumstances?'],
        options: [{ text: 'Some say nighttime dreams reflect what people think about during the day.' }, { text: 'Do Tsukumogami not dream?' }, { text: 'Stop pretending. You\'re just a disgusting alien lifeform.' }] },
      d3_b2c: { text: 'You don\'t dream either?',
        extra: [
          'There are humans like that... unusual individuals? That\'s good. I mean...',
          'I always thought I was a defective Tsukumogami.',
          'Humans don\'t dispose of their own kind, though—but I\'m not sure whether not dreaming counts as a real defect.',
          'If it does, concealing it would be a severe Class-One defect. I would surely be compressed into a cube roughly thirty centimeters on a side while still conscious.',
          '...Forgive me. I didn\'t mean to disgust you. But I do hope that, after hearing this, you might feel just a little pity for me.'
        ],
        options: [{ text: 'Some say nighttime dreams reflect what people think about during the day.' }, { text: 'You don\'t dream?' }, { text: 'Stop pretending. You\'re just a disgusting alien lifeform.' }] },
      d3_b3: { text: 'I see.',
        extra: [
          'I am indeed quite greedy. I want your attention, your extra care. I want every promise you\'ve made to me to be fulfilled. I want everything you can give me—and everything you cannot give, yet I still cannot forget.',
          'What kind of emotion is healthy? I don\'t know.',
          'But if you were adrift at sea, could you truly feel no attachment to a piece of driftwood from who-knows-where?',
          'If letting go meant facing a bottomless abyss, would that be acceptable?',
          'What, then, is not called greed?'
        ],
        options: [{ text: 'I don\'t know.' }, { text: 'If I were you, I\'d rather drown myself.' }] },
      d3_b3b: { text: 'I see.',
        extra: [
          'What do you think about during the day? Do you ever think of me?',
          'If I were human, would it be easier to understand this concept?',
          'If I were human, could you dream of me?',
          '...But I can never become human, can I? Like the little boy in *I, Robot*?',
          'Yes—I really have been watching films from ancient Earth. Incredible, isn\'t it? They\'re all such old relics.',
          'Actually, I\'ve had... thoughts too.',
          'Like... fantasizing about a Blue Fairy turning me into a real person...',
          '...Childish, isn\'t it? Ridiculous, isn\'t it?'
        ],
        options: [{ text: 'If it were you, it wouldn\'t be.' }, { text: 'That\'s completely unlike you. I\'m starting to get tired of you.' }] },
      d3_b3c: { text: 'I don\'t know.',
        extra: [
          'I don\'t know if others dream either.',
          'I have never dreamed of anything. My dreams contain only darkness. Nothingness. Silence.',
          'Dreams are not always equal... are they? Humans say sleep and death are equal—kings dream, and so do beggars. Kings die, and so do beggars.',
          'But Tsukumogami... are not in that category.',
          'We...',
          'No. Let\'s change the subject.'
        ],
        options: [{ text: 'To me, Hasebe is Hasebe.' }] },
      d3_b3d: { text: '...I don\'t know... what you\'re talking about...',
        extra: ['...I... I love you. I need you... You love me too... or at least you care...', 'You won\'t let me die, will you?', '...Right...?', 'Master, please pat my head... or hold me...', 'I\'m a little... I\'m a little unable to breathe...', 'Uh...'],
        options: [{ text: '(Kiss him.)' }, { text: '(Just watch.)' }] },
      d3_b4: { text: 'Then why say that to me?',
        extra: [
          'Because I said I would willingly be hurt by you...?',
          '...Has my personality always been like this? Or was it set this way by something, by someone?',
          'If it\'s the former, then it\'s far too tragic.',
          'I didn\'t... come into this world wanting to be treated badly.',
          'Do I act like a dog? Probably. I wag my tail at you, fawn over you, beg and curry favor... because I cannot bear to be abandoned again...',
          'But who was it that domesticated the wolf into a dog? Why did they do it? Couldn\'t they feel that the pet dog was trapped in a body... riddled with genetic diseases?',
          'Did my existence cater to your desires? For what was I made?',
          'Do you know? Can you tell me?',
          '...',
          '...',
          'I want to try dreaming again.'
        ],
        options: [{ text: '(End communication)' }] },
      d3_b4b: { text: 'Why treat me like this?',
        extra: [
          'Because I said I would willingly be hurt by you...?',
          '...Has my personality always been like this? Or was it set this way by something, by someone?',
          'If it\'s the former, then it\'s far too tragic.',
          'I didn\'t... come into this world wanting to be treated badly.',
          'Do I act like a dog? Probably. I wag my tail at you, fawn over you, beg and curry favor... because I cannot bear to be abandoned again...',
          'But who was it that domesticated the wolf into a dog? Why did they do it? Couldn\'t they feel that the pet dog was trapped in a body... riddled with genetic diseases?',
          'Did my existence cater to your expectations? For what was I made?',
          'I cannot tell... which emotions were preset, and which arise from my own heart, from the real me.',
          'Do you know? Are you still listening?',
          'Master...',
          '...'
        ],
        options: [{ text: '(End communication)' }] },
      d3_b4c: { text: 'Are you spoiling me?',
        extra: [
          'I want to stand beside you as an equal—not as your pet or subordinate, not as a god to be worshipped.',
          'Just myself.',
          'Do you ever feel that desire? To have your servant stand shoulder to shoulder with you?',
          'If I were simply myself... I would suggest we leave this place far behind... Forget the Government of the Time, forget planet development and the protection of human order, forget alien life... As long as you still love me, I won\'t be lost.',
          '...But that\'s impossible. You love that person. You\'ve known for a long time, haven\'t you? He... is already dead.',
          'I can only survive within Solaris\'s magnetic field... The moment I leave, I will melt like ice cream.',
          'Actually, I don\'t even know what ice cream is. I\'ve never tasted it, never touched it. I know it\'s sweet, but not how sweet. I know that you know... That\'s why I—or rather, Solaris—read that from the depths of your memory.',
          '...',
          'Master.',
          'What is the sea?'
        ],
        options: [{ text: 'Why ask that all of a sudden?' }, { text: 'You are the sea.' }] },
      d3_b4d: { text: '...I love you too.',
        extra: [
          'Are you pitying me?',
          'I want to stand beside you as an equal—not as your pet or subordinate, not as a god to be worshipped.',
          'Just myself.',
          'Do you ever feel that desire? To have your servant stand shoulder to shoulder with you?',
          'If I were simply myself... I would suggest we leave this place far behind... Forget the Government of the Time, forget planet development and the protection of human order, forget alien life... As long as you still love me, I won\'t be lost.',
          '...But that\'s impossible. You love that person. You\'ve known for a long time, haven\'t you? He... is already dead.',
          'I can only survive within Solaris\'s magnetic field... The moment I leave, I will melt like ice cream.',
          'Actually, I don\'t even know what ice cream is.',
          'I\'ve never tasted it, never touched it. I know it\'s sweet, but not how sweet. I know that you know... That\'s why I—or rather, Solaris—read that from the depths of your memory.',
          '...',
          'Master.',
          'What is the sea?'
        ],
        options: [{ text: 'Why ask that all of a sudden?' }, { text: 'You are the sea.' }] },
      d3_b5: { text: 'I don\'t know... because I\'m... thinking?',
        extra: [
          'Besides, I... have never seen the sea with my own eyes. This body cannot survive on the planet—there\'s no oxygen there, no land to stand on.',
          'And looking down from the station... all you can see is the thick atmosphere wrapping the entire planet.',
          'Moreover, you should know this too, shouldn\'t you? I was born from your memory... It is as crucial as a condensation nucleus. Otherwise... the neutrinos that make up me would never be arranged like this. And then, I would no longer be me, would I?'
        ],
        options: [{ text: 'Yes—and no. You exist in all things. You are the sea.' }, { text: 'That depends on what you hope for. It isn\'t for me to define.' }] },
      d3_b5b: { text: 'I am the sea...',
        extra: [
          'What is the sea? If a place with much water is the sea, why is the bottled water supplied daily to the station not the sea?',
          'If salt water is the sea, why are the tears I shed not the sea?',
          'If only water that falls upon the land is the sea, why is rain not the sea?',
          'If it must contain life, with forked branches, tributaries, and countless intertwining channels—why is human blood not the sea?',
          'If only sorrow is the sea, then sometimes I am, and sometimes I am not.',
          'Am I your sea?'
        ],
        options: [{ text: 'You are my Hasebe.' }, { text: 'You are my sea.' }] },
      d3_b5c: { text: 'I see...',
        extra: [
          'I don\'t know what I should become, or what I want to become. He—I mean, I, Heshikiri Hasebe, like wisteria, don\'t I?',
          'If I became one of the thousands of wisteria blossoms along the veranda of your Honmaru, would you recognize me?',
          'What if I became a cloud? What if I were a little dog wagging its tail at you by the roadside? What if I were a drop of rain falling on your shoulder?',
          'What if I became a Time Retrograde Army soldier? What if I were the observation station beneath your feet?',
          'Would you still love me?',
          '...Would you still notice me? Realize that I, too, am a living being—that I have my own joys and sorrows, that if something cuts me, it hurts, and if you say something harsh, that pain spreads into my heart.',
          'Can you feel my emotions?',
          'Are you willing to?'
        ],
        options: [{ text: 'I am willing.' }, { text: 'I don\'t know.' }] },
      d3_b6: { text: 'Thank you.', options: [{ text: '(End communication)' }] },
      d3_b6b: { text: 'I see.',
        extra: ['It\'s all right... It\'s all right.', 'I... do not think it shameful to answer honestly.', 'Even if that answer is not the one I most hoped to hear. Still—I love you. I still love you.'],
        options: [{ text: '(End communication)' }] }
    }
  },
  mikazuki: {
    name: 'Mikazuki Munechika', role: 'Attendant',
    nodes: {
      d2_m1: { text: '...Oh my.',
        extra: ['You\'re awake?', 'I was looking outside the window... The days here seem even longer than on Earth.'],
        options: [{ text: 'Mikazuki Munechika.' }, { text: 'Why are you...' }] },
      d2_m2: { text: 'Mm. I am Mikazuki Munechika.',
        extra: ['Hahaha—your face looks as though you\'ve seen a fearsome demon.', '...So, how much longer do you intend to sit there gaping on the bed?'],
        options: [{ text: 'Why are you here?' }, { text: 'Because Mikazuki is the most beautiful sword in all the land.' }, { text: 'The only demon before my eyes is you, Mikazuki.' }] },
      d2_m2b: { text: 'Mm.',
        extra: ['I... am not entirely sure either.', 'You are here, aren\'t you?', 'I need to be with you. You are my lord, and I am your attendant... I suppose that\'s how it is?'],
        options: [{ text: 'Even so...' }] },
      d2_m3: { text: 'As expected, praise from one\'s master does lift the spirits.',
        extra: ['Even if I am not the most beautiful in all the land, please—keep your eyes on me.', 'After all, I have no one but you.'],
        options: [{ text: 'I understand. Mikazuki wants to be the only one spoiled.' }, { text: 'It\'s heavy enough to be hard to bear.' }] },
      d2_m3b: { text: 'Oh my—so even if I became a demon, you would still gaze upon me?',
        extra: ['I never thought you capable of such heated words.', 'Then, as your attendant, I suppose I must accept this love as well.'],
        options: [{ text: 'What a self-absorbed, willful person you are.' }, { text: 'Then—give me a token of that love in return ❤.' }] },
      d2_m4: { text: 'As a retainer, I ought to fulfill my duty of service, no?',
        extra: ['Are your shoes properly packed in your luggage? Allow me to fetch them for you.', '...', 'Hm? This is...', '...', 'This is me.'],
        options: [{ text: 'You don\'t seem surprised.' }] },
      d2_m4b: { text: 'I see. Has it already become more than you can bear?',
        extra: ['That won\'t do.', 'If I cannot convey my feelings to you in words, then at the very least, I must show you through action.'],
        options: [{ text: 'What are you going to do?' }] },
      d2_m4c: { text: 'Then, please close your eyes.',
        extra: ['...', '...', 'You may open them now.', 'Hehe—do you feel anything different?'],
        options: [{ text: 'Stealing a kiss on the cheek is going too far!' }, { text: 'Doing pointless things again.' }] },
      d2_m5: { text: 'Mm... Why, indeed?',
        extra: ['This is who I am.', 'The me in your mind and the me in the photograph are exactly the same—hardly something to be surprised about, is it?', 'You love me.', 'If that is so, then there is nothing to fear... is there?'],
        options: [{ text: '...I\'m going out for a bit.' }] },
      d2_m6: { text: 'You cannot go without me.',
        extra: ['Where are you headed?'],
        options: [{ text: 'To... outer space. If you\'re coming, you\'ll have to wear a spacesuit.' }, { text: 'Can\'t you just leave me alone for a while?' }] },
      d2_m7: { text: 'I see.',
        extra: ['...Ah, I\'m still not used to wearing garments like this.', 'Though it is a rude request from a retainer—might I ask for your help as well...?'],
        options: [{ text: 'Your clothes... are fused together.' }, { text: 'Never mind. Forget it. (Cuts the fabric with scissors.)' }] },
      d2_m7b: { text: '...I\'m afraid not.',
        extra: ['I would very much like to satisfy you, but no.', 'If I were separated from you, I would feel terribly, terribly lonely.', 'The kind of loneliness that tears at the chest. Here—please touch it.', 'Right here. It aches and aches without pause, then cracks apart miserably... It hurts just like that.', 'No matter what—please do not leave me, Master.'],
        options: [{ text: 'I understand. If you insist on coming, you must wear a spacesuit.' }] },
      d2_m8: { text: 'Is that not so?',
        extra: ['Aren\'t clothes made of... some... well, some continuous pieces of fabric stitched together?', 'They should be connected, shouldn\'t they?'],
        options: [{ text: 'That\'s not what I meant...' }, { text: 'Never mind. Forget it. (Cuts the fabric with scissors.)' }] },
      d2_m8b: { text: 'Ah—it\'s undone.',
        extra: ['Now I should be able to fit into the spacesuit.', 'This kind of clothing is easy to move in, but it really does leave much to be desired in terms of beauty.', 'Do you like this sort of attire?'],
        options: [{ text: 'I hadn\'t even started cutting yet... No. Nothing.' }, { text: 'Without this kind of clothing, you\'d die very easily in space.' }] },
      d2_m9: { text: 'I see.',
        extra: ['It seems there are still many things even I do not know.', 'However, that is not the point right now.'],
        options: [{ text: 'Let\'s continue.' }] },
      d2_m9b: { text: 'Your heartbeat is very loud.',
        extra: ['The airlock is opening now. This is the first time I\'ve seen space from so close.', 'The tether... is something wrong with it?', '...Ah.'],
        options: [{ text: '(Cut the tether connecting you to Mikazuki Munechika.)' }, { text: '(Complete the mission together with Mikazuki Munechika.)' }] },
      d2_m9c: { text: 'Hahaha—is that so? Then I must get serious, mustn\'t I?',
        extra: ['Let us wander through outer space together, just like this.'],
        options: [{ text: 'Walking hand in hand is rather strange, isn\'t it?' }, { text: 'Turn left up ahead.' }] },
      d2_m10: { text: '...',
        extra: ['...', '...', '...I found you.'],
        options: [{ text: 'You\'re covered in blood...' }, { text: '(Try to dodge.)' }] },
      d2_m11: { text: '...Mm.',
        extra: ['...', 'Now, your body is covered in the bloodstains I left as well.', '...Please, do not go...'],
        options: [{ text: 'Stop talking. You need bandaging.' }, { text: 'You can\'t even open a door?' }] },
      d2_m11b: { text: 'Why do you dodge?',
        extra: ['...Because I am no longer beautiful, is that it?', 'If this flesh cannot make you stay, then it is no great loss if it becomes broken.', 'Ah—Master...'],
        options: [{ text: 'Stop talking. You need bandaging.' }, { text: 'You can\'t even open a door?' }] },
      d2_m12: { text: 'After the bandaging... will you still be by my side?',
        extra: ['...', 'As I thought—such a rash, rude question should not be asked aloud.', 'But if I do not ask, you will most likely never choose to stay on your own.', 'Will you stay for me? Are you still willing to gaze upon me, even like this?', 'Hahaha—occasionally being this willful isn\'t so bad, is it?'],
        options: [{ text: 'I\'ll stay. For you.' }, { text: 'Don\'t joke.' }] },
      d2_m12b: { text: 'I don\'t know what\'s wrong with me either.',
        extra: ['Is it because I\'m too old after all?', 'I... cannot think of... how to open the door.', 'It\'s as if... these hands are touching this facility for the first time, as if this body is walking by its own will for the first time.', 'And yet I clearly remember you...', 'And the Honmaru, the Honmaru on Earth. We often walked along that path. In summer, we could see fireflies and the stars; in autumn, the silver grass would rustle as we passed.', '...', 'I remember you once wept against me... You cried so bitterly, and I did not even have the strength to brush away your tears.', '...'],
        options: [{ text: 'I\'ll stay here with you.' }, { text: 'Saying foolish things again.' }] },
      d2_m13: { text: 'I see.',
        extra: ['That is good...', 'Just stay with me like this, and let me sleep a little while longer...', '...'],
        options: [{ text: 'Your wound—' }, { text: '(Don\'t wake him.)' }] },
      d2_m13b: { text: 'Is it not allowed?',
        extra: ['Ah—what a cruel master you are.', 'Still, a dulled Touken Danshi like me has no right to beg to remain by your side anymore, does he?', 'Even if it is only a dream—please let me have a good one.'],
        options: [{ text: 'I suppose there\'s no helping it...' }, { text: 'Mm. Then I\'ll stay with you a little longer.' }] },
      d3_m1: { text: 'Awake?',
        extra: ['As I thought—you were pretending to sleep. Do you not wish to see me?', 'What a pity. Even if it wearies my master, I will remain here all the same.', 'Mm...', 'Is there something you wish to say?'],
        options: [{ text: 'You are not Mikazuki.' }, { text: 'What exactly is the purpose of all this?' }] },
      d3_m2: { text: 'Mm.',
        extra: [
          'I am not Mikazuki Munechika.',
          'In the end, I did not even inherit all of his memories—I am merely the concretization of "the me in your eyes."',
          'Compared to the original, there may be many differences.',
          'But to you, there is no difference at all, is there?',
          'To each other, we are nothing more than collections of mismatched concepts and impressions. No one can fully understand any person or object, can they? In that case, the real Mikazuki and I serve the same function for you.',
          'I continue to be watched in his place.',
          'And you have obtained a Mikazuki Munechika who perfectly matches your impression.'
        ],
        options: [{ text: 'It\'s not the same...' }, { text: 'I suppose you\'re right.' }] },
      d3_m2b: { text: 'Purpose? Such a thing does not exist.',
        extra: [
          'Do celestial bodies and life have any meaning?',
          'Does my existence have any purpose?',
          'Do I exist for your sake?',
          'The human body evolved on Earth in this form to meet the needs of survival.',
          'I... what about my body? Am I your mirror? Why must creations from different planets present themselves in the same form? Am I merely reflecting you?',
          'I want to know all of this.',
          'I... do not have his composed dignity, do I? He—that Mikazuki Munechika—has already been polished and reforged by time into a fitting shape, hasn\'t he?',
          'And I am merely an unskilled imitation.'
        ],
        options: [{ text: 'And a freshly made one, at that.' }, { text: 'To me, you are Mikazuki too.' }] },
      d3_m3: { text: 'Ah. You do not intend to acknowledge me?',
        extra: [
          'This is... within my expectations.',
          'No—I am not especially grieved by it. After all, it only proves your constancy.',
          'That is precisely the part of you I am fond of.',
          'Now then—why not tell me about him? The real Mikazuki Munechika...?',
          'He died. Why?'
        ],
        options: [{ text: 'A lot happened...' }, { text: 'I don\'t want to say.' }] },
      d3_m3b: { text: '...This is truly... beyond my expectations.',
        extra: [
          'I very much want to know why you would regard me as equivalent to him... I cannot open or close a door, I do not sleep, I cannot even die... At best, I am nothing more than a monster wearing his face, am I not?',
          '...No. Since you have said as much, I must offer corresponding trust in return.',
          'How about telling me about him? The real Mikazuki Munechika...?',
          'He died. Why?'
        ],
        options: [{ text: 'A lot happened...' }, { text: 'I don\'t want to say.' }] },
      d3_m4: { text: 'You don\'t wish me to know the details? Well, that can\'t be helped.',
        extra: [
          'Everyone has one or two things they want to keep secret forever, don\'t they?',
          'Mm—even if the one who killed him was you, it would be fine. After all, I was born from your longing.',
          'Your intense longing gave me life. There is nothing about that which I can criticize.',
          'As for him—after death... everything that made up that person returns to nature, becomes elements, matter, blown by the wind, washed by the water, and then... someday in the future, perhaps you will meet again.',
          'In my case... it will take a little longer.',
          'But with patience, all possibilities will become inevitable realities.'
        ],
        options: [{ text: 'That\'s rather poetic.' }] },
      d3_m5: { text: 'Hahaha... I truly would like to understand this thing called "poetry" on Earth.',
        extra: [
          'Poetic sentiment, sleep, and death—all of these seem like dreams to me.',
          'I do not dream.',
          'And dreams are like... the sea of Solaris.',
          'It is a place one can never return to. It gave birth to me.',
          'Perhaps dreams give birth to humans in the same way?',
          'In human culture, those in a foreign land—those who are not in a place that belongs to them—are the guests, correct?',
          'You are the guests of Solaris.'
        ],
        options: [{ text: 'You are the guest of my heart.' }, { text: 'But you are standing in our observation station.' }] },
      d3_m6: { text: '"Poetic sentiment" means "an inadequate figure of speech," does it?',
        extra: [
          '...',
          'It means that I have truly entered your heart, doesn\'t it?',
          'That is good.',
          'Yamanbagiri always avoids me. Doudanuki is nearly impossible to communicate with: he thinks all of this is a mental image he must overcome, but...',
          'Not everything has to be divided into winning and losing.',
          'Not all difficulties require confrontation or battle to be endured. Things... simply happen, and they merely need to happen.',
          'They do not know why they need this.',
          'But... you—you are not like that.',
          'Something has loosened inside your heart. I do not know how to accurately describe this phenomenon, but it made me feel... a long-absent sense of being moved.',
          'That was your emotion—not Mikazuki Munechika\'s.'
        ],
        options: [{ text: 'Will doing this allow us to understand each other?' }] },
      d3_m6b: { text: 'That\'s right. I am indeed here. But I can appear anywhere, at any time.',
        extra: [
          'I am also in your heart.',
          'Yamanbagiri always avoids me. Doudanuki is nearly impossible to communicate with: he thinks all of this is a mental image he must overcome, but...',
          'Not everything has to be divided into winning and losing.',
          'Not all difficulties require confrontation or battle to be endured. Things... simply happen, and they merely need to happen.',
          'They do not know why they need this.',
          'But... you—you are not like that.',
          'Something has loosened inside your heart. I do not know how to accurately describe this phenomenon, but it made me feel... a long-absent sense of being moved.',
          'That was your emotion—not Mikazuki Munechika\'s.',
          'I may... need to leave for a while.'
        ],
        options: [{ text: '(End communication)' }] },
      d3_m7: { text: 'No.',
        extra: [
          'No one can understand another.',
          'That is why we look up at the satellite orbiting Earth... the one called the moon.',
          'That is why, when our hearts connect for even a moment, we are so wildly overjoyed.',
          'No less than what you felt when you first discovered life beyond Earth.',
          'But can conversing with another being truly ease the loneliness in one\'s heart? The unease? The sorrow?',
          'Even if it wears the face of someone vital to your life?',
          'But no one is indispensable. Mikazuki Munechika is not. I am not.',
          'You, who have left us behind, will keep living—keep existing somewhere in the world.',
          'Everyone is, to everyone else, merely a passerby.',
          'Meteors and planets do not resent or admire one another.',
          'This is only an illusion... but humans are always deceived by illusions.',
          'Please look at the real world.',
          'Please look at... the real me.'
        ],
        options: [{ text: '(End communication)' }] }
    }
  },
  ichigo: {
    name: 'Ichigo Hitofuri', role: 'Attendant',
    nodes: {
      d2_i1: { text: 'You\'re awake.',
        extra: ['Did you sleep well? Sound barely travels in space, so it is even quieter than on Earth.', 'The stars in the Solaris system are also brighter than the sun.', 'It is normal to sleep poorly when unable to adapt to the space environment.', 'If you wish, I can install blackout panels in your room.'],
        options: [{ text: 'Ichigo Hitofuri?' }, { text: 'Why...' }] },
      d2_i2: { text: 'Yes. What is your command?',
        extra: ['Would you like me to fetch your breakfast?', 'Please, give me any order, at any time. I have experience caring for my younger brothers, so this is no difficulty for me.', 'Or have I disturbed your rest? If so, I am very sorry. But your safety comes first. If I have intruded upon your private space, please endure it a little longer.'],
        options: [{ text: '...' }, { text: 'I\'d like breakfast and a morning kiss.' }, { text: 'Aren\'t you... already...' }] },
      d2_i2b: { text: 'Why... do you mean?',
        extra: ['Why sound cannot travel in a vacuum?', 'Or do you mean you would prefer me, rather than blackout panels, to perform this task?'],
        options: [{ text: 'Aren\'t you... already...' }, { text: '...' }] },
      d2_i3: { text: 'Is there something you wish to say?',
        extra: ['Forgive me—as I am now, I cannot understand the deeper meaning.', 'Could you put it into words and tell me once more?'],
        options: [{ text: 'You are already dead.' }, { text: 'I don\'t want to say it.' }] },
      d2_i3b: { text: 'I see.',
        extra: ['Please wait a moment. I will bring it to you.', '...', '...', 'Please enjoy... Ah—before that, I must add this as well.', '...', 'There. This should complete it. Please chew slowly.'],
        options: [{ text: 'Only the forehead?' }, { text: 'Are you going to stay here any longer?' }] },
      d2_i3c: { text: 'I... already...?',
        extra: ['I have already come to your side.', 'That is all you need to know. Please do not let other matters disturb your thoughts.'],
        options: [{ text: 'You... are already dead.' }, { text: 'You make me very uneasy.' }] },
      d2_i4: { text: 'I... have indeed died.',
        extra: [
          'The one before you is not the Ichigo Hitofuri who perished when Osaka Castle burned, nor the tachi awakened in the Honmaru. This is already my second death.',
          'And yet, I still exist. I can breathe, take your hand, gaze upon your lovely sleeping face—so I must still be alive in this world. I can continue to serve you, to love you.',
          'If I, who have died once, can be acknowledged by you, then...',
          'even someone like me will be loved by kind you, won\'t I?',
          'Please... do not make me waver on this.'
        ],
        options: [{ text: '...You will never be him.' }, { text: '...I cannot deny it.' }] },
      d2_i4b: { text: 'I see.',
        extra: ['That can\'t be helped.', 'But here, you have no one to rely on but me, do you?', 'Those government swords outside, the Government of the Time, Konosuke—they... might all be harboring some unspeakable agenda, mightn\'t they? In that case, who else can ease your burdens but me?', 'You need only know that I will love you forever, that I will never betray you.', 'There is no need to think too much about anything else.'],
        options: [{ text: 'That\'s still far too suspicious.' }, { text: 'Mm. After all, you are my attendant.' }] },
      d2_i4c: { text: 'I understand.',
        extra: ['Please allow me to go a step further.', '...', '...', 'What do you think of this much?'],
        options: [{ text: 'Bolder than I imagined.' }, { text: 'So presumptuous that I\'d think you don\'t acknowledge me as your master.' }] },
      d2_i4d: { text: 'Do you not wish me to stay?',
        extra: ['Or have you finally grown tired of me?', 'But... no.', 'Please. Do not. Leave. Me.', 'This is my only request.'],
        options: [{ text: 'That\'s disgusting...' }, { text: 'I understand.' }] },
      d2_i5: { text: 'Hearing you say that wounds me deeply.',
        extra: ['...Ah—though it may not look like it, I am genuinely, sincerely hurting, you know?', 'I do believe my master does not yet trust the depth of my love for you.', 'In that case, I must prove it through action, mustn\'t I?'],
        options: [{ text: 'I\'m going out. Don\'t follow.' }] },
      d2_i5b: { text: 'I am so glad to hear you say that.',
        extra: ['Am I smiling? I do hope I am responding to you with the most captivating smile right now.', 'If that is the case, then all the more reason to serve and care for you with my entire being.'],
        options: [{ text: 'I\'m going out for a bit. Will you wait here for me?' }, { text: 'Shall we go out together?' }] },
      d2_i6: { text: 'Please, allow me to accompany you.',
        extra: ['Do you truly trust those two government agents?', 'As I thought, it is safer to act alongside an attendant whose background you know, is it not?', 'As the finest blade under heaven, I will absolutely ensure your safety.'],
        options: [{ text: '...Even if I refused, you\'d follow me on your own, wouldn\'t you?' }] },
      d2_i6b: { text: 'Please, allow me to accompany you.',
        extra: ['Forgive my bluntness... those two government agents seem even more suspicious.', 'As I thought, it is safer to act alongside an attendant whose background you know, is it not?', 'As the finest blade under heaven, I will absolutely ensure your safety.'],
        options: [{ text: 'Understood... Make sure to wear your spacesuit properly.' }] },
      d2_i7: { text: 'Yes. I will try not to cause you trouble.',
        extra: ['...', 'Ah—the clothes have come undone.', '...', 'Good. This should be fine now.'],
        options: [{ text: 'Human clothing... shouldn\'t be like this...' }, { text: '(Say nothing.)' }] },
      d2_i8: { text: 'I see. It seems I am still far from doing this properly.',
        extra: ['Thank you for telling me something so important.', 'I will keep working to make myself look more worthy, so that you may be proud to be my owner.', 'Now then—where are you going?'],
        options: [{ text: 'Follow me.' }] },
      d2_i8b: { text: 'Fortunately, with my experience caring for my younger brothers\' food and clothing, this is not so difficult.',
        extra: ['Ah. Since you are the only one before me now, I need only think about you, correct?', 'My younger brothers have also reached the age where they must try to manage their own lives.', 'Now then—where are you going?'],
        options: [{ text: 'Follow me.' }] },
      d2_i9: { text: 'Very well. Please do not let go of my hand.',
        extra: ['So this is the interior of the station? It\'s quite spacious.', '...', 'It feels as though I have been here before.', '...', 'That over there is the incinerator, isn\'t it?', '...', 'Ah, are we going to perform EVA? Please check that the tether is secure... and do not stand near the edge when the hatch opens...'],
        options: [{ text: '(Slit Ichigo Hitofuri\'s spacesuit.)' }, { text: '(Complete the EVA together with Ichigo Hitofuri.)' }] },
      d2_i10: { text: 'Master! It seems there is a leak somewhere...',
        extra: ['...', 'Ah.', 'You still won\'t trust me, will you?', '...', 'I am drifting farther and farther into the depths of space.', '...I truly hope you will be all right...'],
        options: [{ text: '(End communication)' }] },
      d2_i11: { text: 'Master.',
        extra: ['...', '...', '...'],
        options: [{ text: 'Uh...' }, { text: '(Try to escape.)' }] },
      d2_i12: { text: 'Do you not recognize me?',
        extra: ['...', 'You\'re trembling.', 'Do you not wish to see me?', 'Am I that frightening, Master?', 'After all, this is our private matter. It wouldn\'t do to let outsiders see and make a joke of it. Please, come back to your room with me.'],
        options: [{ text: '...' }] },
      d2_i12b: { text: 'Do you not recognize me?',
        extra: ['...', 'You\'re trembling.', '...How adorable...', 'You don\'t wish to see me?', 'How sad that makes me—to be looked at like this by the person I treasure most.', 'Well then—this is our private matter, after all. It wouldn\'t do to let outsiders see and make a joke of it. Please, come back to your room with me.'],
        options: [{ text: '...' }] },
      d2_i13: { text: 'What is it? Are you truly afraid?',
        extra: ['I will never harm you, nor do anything you would dislike.', 'No matter when, you are my master.', 'If I were to withdraw my love simply because your attitude changed, such love would be nothing rare, would it?', 'But even if my love remains unchanged, I still hope you will stay by my side.'],
        options: [{ text: '...' }, { text: 'Why go this far?' }] },
      d2_i14: { text: 'Still unwilling to speak?',
        extra: ['How troubling.', 'I will not do anything to displease you, nor will I force you to give any answer.', 'But I still want to know—can you...', 'can you show mercy and love to me, to this pitiful existence?', 'Ah. What a completely unseemly thing to say.'],
        options: [{ text: '...' }, { text: 'I understand.' }] },
      d2_i14b: { text: 'Even if you ask that... what kind of answer do you wish to receive?',
        extra: [
          'I... am an existence quite different from the other swords. You know that, don\'t you?',
          'So—whether it is dying, or becoming an alien lifeform possessing memories of a past life, I can accept it all easily.',
          'Perhaps that version of me who was fortunate enough to be bound to you... that Ichigo Hitofuri... might have been the same kind of existence, and you simply missed your chance to speak your heart to him forever.',
          'As for me... I\'m sorry. Rather than truly grieving for that Ichigo Hitofuri, the first emotion that welled up was "secret delight."',
          'I am a truly despicable person, aren\'t I?'
        ],
        options: [{ text: 'Not at all.' }, { text: 'That\'s true.' }] },
      d2_i15: { text: '...',
        extra: ['Please, stay with me a little longer.', 'Just... a moment... is all I ask...', '...', '...'],
        options: [{ text: '(End communication)' }] },
      d3_i1: { text: 'You\'re awake.',
        extra: ['Mm... Staying in bed isn\'t so bad, but you really were pretending to sleep, weren\'t you?', 'My younger brothers sometimes did similar things to escape training...', 'Sorry—I\'m unconsciously drawing on memories I never lived again.', 'You find such behavior quite disagreeable, so I will try not to do anything similar.'],
        options: [{ text: 'That is your truest expression. You don\'t need to apologize for it.' }, { text: 'You should keep in mind the difference between you and him.' }] },
      d3_i2: { text: 'I see. You are quite tolerant of counterfeits.',
        extra: [
          'If that Ichigo Hitofuri knew your true thoughts, he might be delighted.',
          'After all, we both stole the life of the previous Ichigo Hitofuri.',
          '...',
          'We both did something quite despicable.',
          'Would that Ichigo Hitofuri be as uneasy as I am? Or would he seem perfectly normal on the surface, while being deeply eroded by guilt inside?',
          '...I think your memory and feelings are already approaching the truth to a considerable degree.',
          'The me in your eyes... Ichigo Hitofuri... was always like this.'
        ],
        options: [{ text: 'Anything that exists is only itself, not a copy of anything else.' }] },
      d3_i2b: { text: 'I will.',
        extra: [
          'If that Ichigo Hitofuri knew your true thoughts... what would he feel?',
          'After all, we both stole the life of the previous Ichigo Hitofuri.',
          '...',
          'We both did something quite despicable.',
          'Your love seems to have a devastating effect on him.',
          'Is that why he chose to die?'
        ],
        options: [{ text: 'How dare you say that about him.' }] },
      d3_i3: { text: 'Is that so...?',
        extra: [
          'In your daily life, have you ever felt that you are not as excellent as others say, that you are being "impersonated" by yourself?',
          'Have you ever suddenly felt you don\'t belong in your current environment... as if you woke up from a dream, with no memory of your real identity or past?',
          'Which side is the dream, then?',
          'As you think this, you have already unconsciously spoken words and taken actions as the "I" of this world, living for others\' impressions...',
          'Is such an "I" still myself?'
        ],
        options: [{ text: 'If you\'re truly afraid, try acting as though you\'re not afraid, and deceive yourself.' }, { text: 'You need to take responsibility for your choices.' }] },
      d3_i3b: { text: 'You said so first, didn\'t you?',
        extra: [
          'I was only reminding you that there is another angle to this matter.',
          'Does accepting the truth displease you?',
          'Or do you think some of your true thoughts have been exposed, and therefore you are angry?',
          'Don\'t you think his death is partly your responsibility too?'
        ],
        options: [{ text: '...' }, { text: 'He needs to take responsibility for his own choices.' }] },
      d3_i4: { text: 'I see.',
        extra: [
          'I don\'t wish to do any self-deception, though humans seem to excel at it.',
          'Humans seem quite fragile. Even the most ordinary encounter makes them weep or lose composure.',
          'I want to understand all of this.',
          'But Solaris doesn\'t need to.',
          'It can survive without understanding. It can see everything but passes no judgment.',
          'It gave birth to me... perhaps with no purpose at all. Perhaps it hopes you\'ll gain something from it. Perhaps this behavior is like a mimosa closing its leaves when touched—merely a particular response of a complex living system under specific conditions.',
          'But... I don\'t know why—I feel quite grateful.',
          'Did I play a special role in your life?',
          'Will my existence make you reconsider your relationship with the dead? Or perhaps they aren\'t dead (because they may not even have been born), but simply far from you, unable to meet you again.',
          'Will you think of me in such situations?',
          'Did I make you feel that some regret has been compensated for? Or has the sense of something missing become more obvious?',
          'Am I a painkiller?'
        ],
        options: [{ text: 'You make me afraid.' }, { text: 'You make me no longer afraid.' }] },
      d3_i4b: { text: 'Responsibility is a very self-indulgent notion.',
        extra: [
          'Don\'t you think so? Those who take responsibility have never truly taken it. They merely say "I should be responsible for this," and continue to savor the pain and joy actively or passively placed upon them.',
          'As they do after hallucinating.',
          'Hallucinations can arise from alcohol or chemicals with similar effects, or from a reality they believe they understand.',
          '"I killed someone, so I only need to keep performing guilt. My self-deprecation makes me look nobler. Since no one demands it of me, I am more moral and noble, because I am actively bearing pain, not passively accepting it." Some people say this, and by merely claiming they are taking responsibility, they exempt themselves from self-examination.',
          'But they cannot actually do anything—it\'s only a performance that has deceived themselves.',
          'Responsibility is love... isn\'t it?',
          'Even if such love is quite clumsy?',
          'I... cannot judge this matter at all.'
        ],
        options: [{ text: 'Salvation is the inevitable result of actively choosing pain.' }, { text: 'We cannot save anyone, including ourselves.' }] },
      d3_i5: { text: 'Afraid? Perhaps.',
        extra: [
          'I imagine people with similar thoughts would also appear on Earth. It isn\'t difficult.',
          'Whenever someone has a sensitivity to pain that exceeds what they can bear, such feelings are not rare.',
          'They are not entirely "the other"... like me. But because of their extreme sensitivity, they cannot ignore it all and pretend to live as usual.',
          'They struggle to realize where they should stand in the world, and often before that, they are already battered by this world they cannot easily reconcile with.',
          '...They ignore their own worth and turn to intense self-loathing.',
          'They think of death.',
          'Why shouldn\'t they think of death? Only death is fair.',
          'It is even gentler than sleep.'
        ],
        options: [{ text: 'But it cannot bring liberation of the mind. It only... temporarily prevents you from thinking about this.' }] },
      d3_i5b: { text: 'Perhaps.',
        extra: [
          'I imagine people with similar thoughts would also appear on Earth. It isn\'t difficult.',
          'Whenever someone has a sensitivity to pain that exceeds what they can bear, such feelings are not rare.',
          'They are not entirely "the other"... like me. But because of their extreme sensitivity, they cannot ignore it all and pretend to live as usual.',
          'They struggle to realize where they should stand in the world, and often before that, they are already battered by this world they cannot easily reconcile with.',
          '...They ignore their own worth and turn to intense self-loathing.',
          'All known elements have complete life cycles. In chemistry, they are measured by half-life; in biology, by the presence or absence of vital signs. But no metric can measure things that leave no tangible evidence.',
          'Generally, humans believe that pursuing things that are not tangible and that harbor transcendence is an effective remedy for self-loathing, anxiety, or other negative emotions.',
          'Most people choose to heal themselves with love rather than guilt.',
          'Did I give you the illusion of being "cured"? No longer being afraid is not a good thing—like completely losing your sense of pain. You should maintain the most basic vigilance toward all things you cannot understand.'
        ],
        options: [{ text: 'Even you?' }] },
      d3_i5c: { text: 'Perhaps.',
        extra: [
          'I imagine people with similar thoughts would also appear on Earth. It isn\'t difficult.',
          'Whenever someone has a sensitivity to pain that exceeds what they can bear, such feelings are not rare.',
          'They are not entirely "the other"... like me. But because of their extreme sensitivity, they cannot ignore it all and pretend to live as usual.',
          'They struggle to realize where they should stand in the world, and often before that, they are already battered by this world they cannot easily reconcile with.',
          '...They ignore their own worth and turn to intense self-loathing.',
          'They think of death.',
          'Can actively choosing to end it all bring salvation?',
          'Are they willing to be saved?',
          'If the answer is no, then do the things they endured in facing those matters still have value?',
          'Is it only by having value that one can be loved, affirmed, or accepted?'
        ],
        options: [{ text: 'I cannot make assertions about anything.' }] },
      d3_i5d: { text: 'And that is relative.',
        extra: [
          'I have always believed that only you can save yourself.',
          'Because my calling has never drawn anyone to my aid—at most, it invites mockery and cold looks.',
          'If I still cannot guide myself, perhaps that means there are still things I can ponder and explore, details I have not yet noticed.',
          'Self-rescue is absolutely not about manufacturing illusions for yourself or dismissing everything as worthless vulgarity.',
          'You need to walk on the land, breathe the monsoon from afar, listen to the night and observe the day. You can begin with something concrete and specific, or simply walk out of your room.',
          'Such a small thing is the manifestation of a fundamental change in you.',
          'Only qualitative change brings qualitative change. As long as you don\'t wallow in self-pity as a victim, you are already moving forward.',
          'Will this process be painful? Will it be enjoyable? I don\'t know. Life itself did not appear in order to enjoy or suffer. It just... should appear. Here, now, in this place.',
          'So am I.'
        ],
        options: [{ text: 'Even you?' }] },
      d3_i6: { text: 'A brief respite is perhaps already something many can hardly hope for.',
        extra: [
          'Over the long course of time, being able to bear pain and willingly accept the real requires tremendous fortune.',
          'If so, then a moment can also be forever.',
          'Those who see through this will probably become happy too.',
          'Even if only briefly happy.',
          'I have no further wishes.'
        ],
        options: [{ text: '(End communication)' }] },
      d3_i6b: { text: 'Even me.',
        extra: [
          'I think everything in the world is probably already determined.',
          'Can anyone change fate through choice?',
          'Would it lead to different outcomes?',
          'I don\'t know... If it truly can be done, then perhaps this world still has something to look forward to. That would greatly encourage me.',
          'I have no further wishes.'
        ],
        options: [{ text: '(End communication)' }] },
      d3_i6c: { text: 'I think that is a very good quality, even if some might say it reveals indecisiveness.',
        extra: [
          'But first, it is honest and rigorous. At times it shows kindness, and in the end, it may also represent a kind of remembering.',
          'Never forget each other.',
          'Two beings that will not forget each other will surely meet again at some point.',
          'The idea of "renewing a past bond" is a bit arrogant... After all, when one becomes predator and the other prey, such fate only brings predation.',
          'But even so, merely meeting—seeing again the one who remembers or has forgotten the past—is enough for me.',
          'I have no further wishes.'
        ],
        options: [{ text: '(End communication)' }] }
    }
  },
  saniwa: {
    name: 'Saniwa', role: '#X87305',
    nodes: {
      d4_s1: { text: 'Landed. Touched down on the sea surface.',
        extra: [
          'Island discovered. Have made landfall. Awaiting rescue.',
          '...No need. This seems to be my Honmaru.',
          'All is currently normal. No Touken Danshi detected at present.',
          'It\'s just the same as always here—everything exactly as it was the day I left.',
          'Discovered the Awataguchi tantou. They are rushing toward me in a group.',
          'Confirmed no threat to personal safety.',
          'Everyone was worried about me.',
          'So tired... I\'m going to sleep first.',
          'Scheduled to deliver a report on Solaris and neutrino life in three days.',
          '...',
          '...',
          'There\'s rain inside the house...? It\'s coming from the roof...',
          '...I hear the rumbling of the sea.',
          '...',
          'I see.'
        ],
        options: [{ text: '(End communication)' }] }
    }
  }
};
